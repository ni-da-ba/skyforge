<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Open Sky emblem seven-scale recognition review sheet</title>
  <desc id="desc">Human-gate contact sheet showing one locked Skyfarer's Guild Open Sky emblem across seven required applications: monumental facade, hanging sign, vertical banner, aircraft marking, crate stamp, monochrome carving, and a low-resolution 7x7 pixel approximation.</desc>
  <defs>
    <style>
      .bg{fill:#0b1f33}.panel{fill:#102a42;stroke:#36536c;stroke-width:2}.title{fill:#f4ead3;font:700 42px Georgia,serif}.sub{fill:#b9c8d5;font:20px Arial,sans-serif}.label{fill:#f4ead3;font:700 22px Arial,sans-serif}.small{fill:#c4d0da;font:17px Arial,sans-serif}.brass{stroke:#d7b77a}.light{stroke:#f4ead3}.ink{stroke:#25313b}.thin{stroke-width:12}.mark{fill:none;stroke-width:16;stroke-linecap:round;stroke-linejoin:round}.star{fill:#f2dfad;stroke:none}.monoStar{fill:#25313b;stroke:none}.line{fill:none;stroke:#d7b77a;stroke-width:3}.pixel{fill:#f4ead3}.pixel2{fill:#d7b77a}
    </style>
    <g id="openSkyMark" class="mark brass">
      <path d="M-96 70 A134 134 0 1 1 96 70"/>
      <path d="M-108 18 C-70 21 -39 -4 -16 -48 C-37 10 -67 45 -108 53"/>
      <path d="M108 18 C70 21 39 -4 16 -48 C37 10 67 45 108 53"/>
      <path d="M-66 72 Q0 120 66 72"/>
      <path class="star" d="M0 -120 L13 -57 L58 -44 L13 -31 L0 32 L-13 -31 L-58 -44 L-13 -57 Z"/>
      <circle cx="0" cy="-44" r="8" fill="#0b1f33" stroke="none"/>
    </g>
    <g id="openSkyMono" class="mark ink">
      <path d="M-96 70 A134 134 0 1 1 96 70"/>
      <path d="M-108 18 C-70 21 -39 -4 -16 -48 C-37 10 -67 45 -108 53"/>
      <path d="M108 18 C70 21 39 -4 16 -48 C37 10 67 45 108 53"/>
      <path d="M-66 72 Q0 120 66 72"/>
      <path class="monoStar" d="M0 -120 L13 -57 L58 -44 L13 -31 L0 32 L-13 -31 L-58 -44 L-13 -57 Z"/>
      <circle cx="0" cy="-44" r="8" fill="#efe5ce" stroke="none"/>
    </g>
  </defs>

  <rect width="1600" height="1080" class="bg"/>
  <text x="60" y="72" class="title">OPEN SKY — PRACTICAL-SCALE RECOGNITION GATE</text>
  <text x="60" y="108" class="sub">One locked institutional mark across seven applications. Review identity survival, monochrome legibility, and low-resolution recognition.</text>
  <text x="60" y="136" class="small">Review palette is illustrative only; CIV-0002/CIV-0005 do not freeze final RGB values or Minecraft blocks.</text>

  <!-- Row 1 -->
  <g transform="translate(50 180)">
    <rect width="475" height="365" rx="14" class="panel"/>
    <text x="24" y="38" class="label">1 — Monumental / facade</text>
    <rect x="50" y="80" width="375" height="220" rx="8" fill="#8b8172"/>
    <rect x="70" y="100" width="335" height="180" rx="6" fill="#6e675d" stroke="#b7aa93" stroke-width="4"/>
    <g transform="translate(237 190) scale(.72)"><use href="#openSkyMark"/></g>
    <text x="24" y="338" class="small">Full geometry; distance silhouette should remain immediate.</text>
  </g>

  <g transform="translate(562 180)">
    <rect width="475" height="365" rx="14" class="panel"/>
    <text x="24" y="38" class="label">2 — Hanging sign</text>
    <path d="M145 78 h185 M165 78 v48 M310 78 v48" class="line"/>
    <rect x="128" y="118" width="220" height="190" rx="10" fill="#0b1f33" stroke="#d7b77a" stroke-width="7"/>
    <g transform="translate(238 214) scale(.50)"><use href="#openSkyMark"/></g>
    <text x="24" y="338" class="small">Street-scale sign; same silhouette and star/cradle relationship.</text>
  </g>

  <g transform="translate(1074 180)">
    <rect width="475" height="365" rx="14" class="panel"/>
    <text x="24" y="38" class="label">3 — Vertical flag / banner</text>
    <path d="M115 72 v242" stroke="#d7b77a" stroke-width="9"/>
    <path d="M115 82 h230" stroke="#d7b77a" stroke-width="9"/>
    <path d="M135 100 h185 v208 l-92 -42 -93 42 z" fill="#132f49" stroke="#d7b77a" stroke-width="6"/>
    <g transform="translate(228 190) scale(.46)"><use href="#openSkyMark"/></g>
    <text x="24" y="338" class="small">Tall fabric treatment; no alternate chapter emblem replaces the core.</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(50 575)">
    <rect width="355" height="355" rx="14" class="panel"/>
    <text x="22" y="38" class="label">4 — Aircraft marking</text>
    <path d="M42 132 C120 92 240 88 315 115 L335 250 C250 272 135 270 45 238 Z" fill="#9aa4a8" stroke="#d4dde1" stroke-width="3"/>
    <path d="M250 105 L320 66 L333 128" fill="#7e898e" stroke="#d4dde1" stroke-width="3"/>
    <g transform="translate(188 191) scale(.38)"><use href="#openSkyMark"/></g>
    <text x="22" y="326" class="small">Reduced standard mark on hull/tail; readable at glance.</text>
  </g>

  <g transform="translate(435 575)">
    <rect width="355" height="355" rx="14" class="panel"/>
    <text x="22" y="38" class="label">5 — Crate / equipment stamp</text>
    <rect x="55" y="80" width="245" height="205" rx="5" fill="#8f7250" stroke="#b89468" stroke-width="5"/>
    <path d="M55 112 h245 M80 80 v205 M275 80 v205" stroke="#654d36" stroke-width="7"/>
    <g transform="translate(178 187) scale(.34)"><use href="#openSkyMono"/></g>
    <text x="22" y="326" class="small">Utility treatment; simple enough for stamping and inspection plates.</text>
  </g>

  <g transform="translate(820 575)">
    <rect width="355" height="355" rx="14" class="panel"/>
    <text x="22" y="38" class="label">6 — Monochrome carving</text>
    <rect x="55" y="75" width="245" height="220" rx="10" fill="#efe5ce" stroke="#b9aa91" stroke-width="5"/>
    <g transform="translate(178 187) scale(.43)"><use href="#openSkyMono"/></g>
    <text x="22" y="326" class="small">No color dependency; geometry alone must identify the Guild.</text>
  </g>

  <g transform="translate(1205 575)">
    <rect width="345" height="355" rx="14" class="panel"/>
    <text x="22" y="38" class="label">7 — 7×7 pixel realization</text>
    <rect x="57" y="72" width="231" height="231" fill="#071522" stroke="#36536c" stroke-width="3"/>
    <!-- 7x7 approximate identity: open ring, beacon/star, paired wings, cradle. -->
    <g transform="translate(74 89)">
      <!-- grid guides -->
      <g stroke="#193650" stroke-width="1">
        <path d="M0 0V196 M28 0V196 M56 0V196 M84 0V196 M112 0V196 M140 0V196 M168 0V196 M196 0V196"/>
        <path d="M0 0H196 M0 28H196 M0 56H196 M0 84H196 M0 112H196 M0 140H196 M0 168H196 M0 196H196"/>
      </g>
      <!-- ring / open sky -->
      <rect x="56" y="0" width="28" height="28" class="pixel2"/><rect x="84" y="0" width="28" height="28" class="pixel2"/><rect x="112" y="0" width="28" height="28" class="pixel2"/>
      <rect x="28" y="28" width="28" height="28" class="pixel2"/><rect x="140" y="28" width="28" height="28" class="pixel2"/>
      <rect x="0" y="56" width="28" height="28" class="pixel2"/><rect x="168" y="56" width="28" height="28" class="pixel2"/>
      <rect x="0" y="84" width="28" height="28" class="pixel2"/><rect x="168" y="84" width="28" height="28" class="pixel2"/>
      <rect x="28" y="112" width="28" height="28" class="pixel2"/><rect x="140" y="112" width="28" height="28" class="pixel2"/>
      <!-- star/beacon -->
      <rect x="84" y="28" width="28" height="28" class="pixel"/><rect x="56" y="56" width="28" height="28" class="pixel"/><rect x="84" y="56" width="28" height="28" class="pixel"/><rect x="112" y="56" width="28" height="28" class="pixel"/><rect x="84" y="84" width="28" height="28" class="pixel"/>
      <!-- paired wings -->
      <rect x="28" y="84" width="28" height="28" class="pixel"/><rect x="56" y="112" width="28" height="28" class="pixel"/><rect x="112" y="112" width="28" height="28" class="pixel"/><rect x="140" y="84" width="28" height="28" class="pixel"/>
      <!-- cradle, deliberately open below -->
      <rect x="56" y="140" width="28" height="28" class="pixel2"/><rect x="112" y="140" width="28" height="28" class="pixel2"/><rect x="84" y="168" width="28" height="28" class="pixel2"/>
    </g>
    <text x="22" y="326" class="small">Approximation only; recognizability must survive extreme simplification.</text>
  </g>

  <path d="M60 976 H1540" class="line"/>
  <text x="60" y="1015" class="label">HUMAN GATE</text>
  <text x="230" y="1015" class="sub">PASS if all seven applications read as one institution; monochrome works; low resolution is recognizable without navy/brass.</text>
  <text x="60" y="1048" class="small">Core geometry authority: CIV-0002 + CIV-0005. Local failures should be fixed by bounded application-specific simplification before reconsidering the locked emblem.</text>
</svg>