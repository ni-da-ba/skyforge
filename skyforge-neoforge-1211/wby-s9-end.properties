# WBY S9 End candidate pins and provenance
# Target: Minecraft 1.21.1 / NeoForge 21.1.249.
# This file records candidate pins, not simultaneous promotion. S9 profiles must select explicit,
# mutually compatible variants. Resolved JAR/ZIP hashes belong in Actions evidence on exact head.

minecraft.version=1.21.1
neoforge.version=21.1.249
profile.id=wby-s9-end
profile.base=wby-s8-incendium-full
profile.optIn=true

# Preferred morphology / substrate instrument. Install into a fresh-world datapacks directory.
# Nullscape states it is incompatible with most End worldgen projects, except Better End.
nullscape.version=1.2.14
nullscape.coordinate=maven.modrinth:LPjGiSO4:3fv8O3xX@zip
nullscape.environment=server-singleplayer-data-pack
nullscape.license=Stardust Labs License
nullscape.source=https://modrinth.com/datapack/nullscape/version/3fv8O3xX
nullscape.requires=none
nullscape.notes=Fresh End required. Separate from non-BetterEnd End biome/worldgen candidates unless exact compatibility is proven.

# BetterEnd: New Dawn is the preferred broad End library but also owns a custom generator.
# Keep a distinct BetterEnd-only control and a Nullscape + BetterEnd compatibility arm.
