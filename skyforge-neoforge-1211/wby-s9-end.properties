betterEndNewDawn.requires=bclibNewDawn,wunderLibNewDawn,worldWeaverNewDawn
betterEndNewDawn.notes=21.0.26 records a fix for small-island placement with vanilla or third-party End chunk generators; verify active generator ownership in the fresh world. Its food addons are isolated in the betterend-food candidate arm.

