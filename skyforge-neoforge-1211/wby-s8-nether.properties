# WBY S8 Step A: mutually exclusive Nether substrate qualification.
# Target: Minecraft 1.21.1 / NeoForge 21.1.249.
# Candidate artifacts are downloaded from their official upstream release sources. Resolved hashes are recorded by CI.
minecraft.version=1.21.1
neoforge.version=21.1.249
profile.id=wby-s8-nether
profile.base=wby-s7-combat
profile.optIn=true

# Physical substrate arms: vanilla control, Jaden's Nether Expansion / Mosaic, Incendium.
# JNE is All Rights Reserved. Keep as a local review candidate; do not publish/rehost its JAR until this license discrepancy is resolved.
