name: Portable Engine Cutoff Sable

on:
  pull_request:
    paths:
      - ".github/workflows/portable-engine-cutoff-sable.yml"
      - "skyforge-neoforge-1211/build.gradle.kts"
      - "skyforge-neoforge-1211/wave-c1-mods.properties"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgePortableEngineCutoffSableAcceptance.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgePortableEngineCutoffAccess.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeNeoForge1211Mod.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/mixin/SkyforgePortableEngineBlockEntityMixin.java"
      - "skyforge-neoforge-1211/src/test/java/io/github/nidaba/skyforge/neoforge1211/PortableEngineCutoffSableResourceTest.java"
      - "docs/design-audit/portable-engine-cutoff-runtime.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-engine-cutoff-sable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  assembled-sable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify Sable cutoff scope and wiring
        run: ./gradlew :skyforge-neoforge-1211:test --tests '*PortableEngineCutoffSableResourceTest' --no-configuration-cache

      - name: Resolve accepted C11 flight-only runtime
        run: ./gradlew :skyforge-neoforge-1211:waveC11ResolvePinnedMods --no-configuration-cache

      - name: Assemble Sable two-engine cutoff acceptance
        shell: bash
        run: |
          set -euo pipefail
          log="portable-engine-cutoff-sable.log"
          setsid ./gradlew :skyforge-neoforge-1211:runPortableEngineCutoffSableAcceptanceServer             --no-configuration-cache >"${log}" 2>&1 &
          pid=$!
          outcome=""

          for _ in $(seq 1 240); do
            if grep -Fq "PORTABLE_ENGINE_CUTOFF_SABLE_ACCEPTANCE PASS" "${log}" 2>/dev/null; then
              outcome="pass"
              break
            fi
            if grep -Fq "PORTABLE_ENGINE_CUTOFF_SABLE_ACCEPTANCE FAIL" "${log}" 2>/dev/null; then
              outcome="fail"
              break
            fi
            if ! kill -0 "${pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [[ "${outcome}" == "pass" ]]; then
            grep -F "PORTABLE_ENGINE_CUTOFF_SABLE_ACCEPTANCE PASS" "${log}"
            kill -TERM -- "-${pid}" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-${pid}" 2>/dev/null || true
            wait "${pid}" 2>/dev/null || true
            exit 0
          fi

          echo "FAIL assembled Sable Portable Engine cutoff acceptance"
          cat "${log}"
          kill -TERM -- "-${pid}" 2>/dev/null || true
          sleep 1
          kill -KILL -- "-${pid}" 2>/dev/null || true
          wait "${pid}" 2>/dev/null || true
          exit 1
