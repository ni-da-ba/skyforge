      - "skyforge-world/src/test/java/io/github/nidaba/skyforge/world/SkyIslandSemanticChannelReachPlannerTest.java"
      - "skyforge-world/src/test/java/io/github/nidaba/skyforge/world/SkyIslandTerrainAwareRouteSolverTest.java"
      - "skyforge-world/src/test/java/io/github/nidaba/skyforge/world/SkyIslandGeomorphicChannelNetworkPlannerTest.java"
      - "docs/authorship/HYDROLOGY_RESET_TRANCHE_F3K.md"
      - "skyforge-reference/build.gradle.kts"
      - "skyforge-reference/src/main/java/io/github/nidaba/skyforge/reference/HydrologyNaturalTransitionCensusCli.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hydrology-reset-geometry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Run focused key-700 hydrology regressions
        run: |
          ./gradlew \
            :skyforge-world:test \
            --tests '*SkyIslandHydraulicGeometrySkeletonPlannerTest.naturalKey700D2RefinementIsReportedAlongsideComponentSpanOutcomes' \
            --tests '*SkyIslandHydraulicGeometrySkeletonPlannerTest.hydraulicCandidateGeometryIsDeterministicAndKeepsTheAuthoredGraph' \
            --tests '*SkyIslandHydraulicComponentGeometryRefinementTest.key700BoundedSmoothModesAreScoredByExactTerminalComponentAssembly' \
            --tests '*SkyIslandHydraulicNetworkAssemblyPlannerTest.confluence632EdgeOutletComponentsRemainTransitionDeferredUntilBoundaryDropsSolve' \
            --tests '*SkyIslandHydraulicJumpSolverTest' \
            --tests '*SkyIslandHydraulicJumpProfileSolverTest' \
            --tests '*SkyIslandHydraulicCascadeTransitionSolverTest' \
            --tests '*SkyIslandOpenChannelSourceTailwaterSolverTest' \
            --tests '*SkyIslandHydraulicEnergyConfluenceComponentSolverTest' \
            --tests '*SkyIslandHydraulicConfluenceEnergySolverTest' \
            --tests '*SkyIslandGraduallyVariedFlowSolverTest.subcriticalProfileMarchesDownstreamFromUpstreamStageControl' \
            --tests '*SkyIslandGraduallyVariedFlowSolverTest.subcriticalDownstreamSolveRejectsSupercriticalSourceAndInsufficientHead' \
            --no-configuration-cache
      - name: Prepare and verify the persisted F4H/F4D review specimen
        if: always() && github.event_name == 'workflow_dispatch'
        timeout-minutes: 15
        run: ./gradlew :skyforge-neoforge-1211:f4kHydrologyReviewPrepareVerify --no-configuration-cache

      - name: Print key-700 component refinement diagnostics
        if: success()
        run: |
          cat skyforge-world/build/evidence/hydrology-key700-d2-component-test/key-700.txt
          cat skyforge-world/build/test-results/test/TEST-io.github.nidaba.skyforge.world.SkyIslandHydraulicComponentGeometryRefinementTest.xml

      - name: Dump generated hydrology evidence on failure
        if: failure()
        run: python3 scripts/ci/dump_hydrology_failure_evidence.py

      - name: Dump focused failure report
        if: failure()
        run: |
          cat skyforge-world/build/test-results/test/TEST-io.github.nidaba.skyforge.world.SkyIslandHydraulicGeometrySkeletonPlannerTest.xml || true
          cat skyforge-world/build/test-results/test/TEST-io.github.nidaba.skyforge.world.SkyIslandHydraulicComponentGeometryRefinementTest.xml || true
          cat skyforge-world/build/test-results/test/TEST-io.github.nidaba.skyforge.world.SkyIslandHydraulicNetworkAssemblyPlannerTest.xml || true
          cat skyforge-world/build/test-results/test/TEST-io.github.nidaba.skyforge.world.SkyIslandHydraulicEnergyConfluenceComponentSolverTest.xml || true
      - name: Run bounded natural confluence/CASCADE census
        if: success() && github.event_name == 'workflow_dispatch'
        run: ./gradlew :skyforge-reference:hydrologyNaturalTransitionCensus --no-configuration-cache

      - name: Run game-scale ordinary-span calibration sweep (key 700 held out)
        if: success() && github.event_name == 'workflow_dispatch'
        run: ./gradlew :skyforge-reference:hydrologyGameScaleCalibrationSweep --no-configuration-cache

      - name: Print calibration sweep summary
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          summary=skyforge-reference/build/evidence/hydrology-game-scale-calibration-sweep-v1/ordinary-span-sweep.csv
          if [ -f "$summary" ]; then
            awk -F, 'NR == 1 { print "control,heldOut,parameterSet,qualified,rejected,hydraulicFailure,upstreamStageMismatch,deferred,invalidGeometry,maxEnergyResidualMeters,maxUpstreamStageResidualMeters"; next } { print $1 "," $2 "," $6 "," $12 "," $13 "," $14 "," $15 "," $16 "," $17 "," $18 "," $19 }' "$summary"
            echo "Calibration sweep total rows: $(($(wc -l < "$summary") - 1))"
          else
            echo "Game-scale calibration sweep summary was not produced."
          fi

      - name: Print ordinary-span failure diagnostics
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          diagnostics=skyforge-reference/build/evidence/hydrology-game-scale-calibration-sweep-v1/ordinary-span-diagnostics.txt
          if [ -f "$diagnostics" ]; then
            cat "$diagnostics"
          else
            echo "Ordinary-span diagnostics were not produced."
          fi

      - name: Print natural-transition census summary
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          summary=skyforge-reference/build/evidence/hydrology-natural-transition-census-v1/summary.csv
          if [ -f "$summary" ]; then
            cat "$summary"
          else
            echo "Natural-transition census summary was not produced."
          fi
          manifest=skyforge-reference/build/evidence/hydrology-natural-transition-census-v1/identity-manifest.csv
          if [ -f "$manifest" ]; then
            echo "Natural-transition census candidate outcomes:"
            awk -F, 'NR == 1 || $7 == "true" { print }' "$manifest"
          fi

      - name: Upload game-scale calibration sweep evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: hydrology-game-scale-calibration-sweep-${{ github.sha }}
          path: skyforge-reference/build/evidence/hydrology-game-scale-calibration-sweep-v1/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload F4K review preparation evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: f4k-hydrology-review-prep-${{ github.sha }}
          path: skyforge-neoforge-1211/build/acceptance/f4k-hydrology-review/prepare.properties
          if-no-files-found: warn
          retention-days: 14

      - name: Upload natural-transition census evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: hydrology-natural-transition-census-${{ github.sha }}
          path: skyforge-reference/build/evidence/hydrology-natural-transition-census-v1/
          if-no-files-found: warn
          retention-days: 14
