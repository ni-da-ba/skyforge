name: Hydrology Reset Geometry

on:
  pull_request:
    paths:
      - ".github/workflows/hydrology-reset-geometry.yml"
      - "docs/authorship/HYDROLOGY_RESET_TRANCHE_A.md"
      - "docs/authorship/HYDROLOGY_RESET_TRANCHE_B.md"
      - "docs/authorship/HYDROLOGY_RESET_TRANCHE_C.md"
      - "docs/authorship/HYDROLOGY_RESET_TRANCHE_D0.md"
      - "docs/authorship/HYDROLOGY_RESET_TRANCHE_D1.md"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandGeomorphicDiagnostics.java"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandGeomorphicDiagnosticEvaluator.java"
      - "skyforge-world/src/test/java/io/github/nidaba/skyforge/world/SkyIslandGeomorphicDiagnosticEvaluatorTest.java"
      - "skyforge-reference/src/main/java/io/github/nidaba/skyforge/reference/HydrologyGeomorphicDiagnosticsCorpusCli.java"
      - "skyforge-reference/src/test/java/io/github/nidaba/skyforge/reference/HydrologyGeomorphicDiagnosticsCorpusTest.java"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandHydraulicGeometrySample.java"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandHydraulicReachGeometry.java"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandHydraulicChannelNetworkPlan.java"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandHydraulicChannelNetworkPlanner.java"
      - "skyforge-world/src/test/java/io/github/nidaba/skyforge/world/SkyIslandHydraulicChannelNetworkPlannerTest.java"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandSemanticChannelReach.java"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandSemanticChannelReachPlan.java"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandSemanticChannelReachPlanner.java"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandGeomorphicRouteAnchor.java"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandGeomorphicCandidateRoute.java"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandTerrainAwareRouteSolver.java"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandGeomorphicNetworkNodeKind.java"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandGeomorphicNetworkNode.java"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandGeomorphicReachRoute.java"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandGeomorphicChannelNetworkPlan.java"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandGeomorphicChannelNetworkPlanner.java"
      - "skyforge-world/src/test/java/io/github/nidaba/skyforge/world/SkyIslandSemanticChannelReachPlannerTest.java"
      - "skyforge-world/src/test/java/io/github/nidaba/skyforge/world/SkyIslandTerrainAwareRouteSolverTest.java"
      - "skyforge-world/src/test/java/io/github/nidaba/skyforge/world/SkyIslandGeomorphicChannelNetworkPlannerTest.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hydrology-reset-geometry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Run reset geometry tests
        run: |
          ./gradlew \
            :skyforge-world:test --tests '*SkyIslandSemanticChannelReachPlannerTest' \
            :skyforge-world:test --tests '*SkyIslandTerrainAwareRouteSolverTest' \
            :skyforge-world:test --tests '*SkyIslandGeomorphicChannelNetworkPlannerTest' \
            :skyforge-world:test --tests '*SkyIslandHydraulicChannelNetworkPlannerTest' \
            :skyforge-reference:test --tests '*HydrologyGeomorphicDiagnosticsCorpusTest' \
            :skyforge-world:test --tests '*SkyIslandGeomorphicDiagnosticEvaluatorTest' \
            --no-configuration-cache

      - name: Dump focused failure report
        if: failure()
        run: |
          cat skyforge-world/build/test-results/test/TEST-io.github.nidaba.skyforge.world.SkyIslandGeomorphicChannelNetworkPlannerTest.xml || true
          cat skyforge-world/build/test-results/test/TEST-io.github.nidaba.skyforge.world.SkyIslandHydraulicChannelNetworkPlannerTest.xml || true
          cat skyforge-reference/build/test-results/test/TEST-io.github.nidaba.skyforge.reference.HydrologyGeomorphicDiagnosticsCorpusTest.xml || true
          cat skyforge-world/build/test-results/test/TEST-io.github.nidaba.skyforge.world.SkyIslandGeomorphicDiagnosticEvaluatorTest.xml || true
