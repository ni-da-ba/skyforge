permissions:
  contents: read

concurrency:
  group: hydrology-reset-geometry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Run reset geometry tests
        run: |
          ./gradlew \
            :skyforge-world:test --tests '*SkyIslandPreHydrologicTerrainFieldTest' \
            :skyforge-world:test --tests '*SkyIslandSemanticChannelReachPlannerTest' \
            :skyforge-world:test --tests '*SkyIslandTerrainAwareRouteSolverTest' \
            :skyforge-world:test --tests '*SkyIslandGeomorphicChannelNetworkPlannerTest' \
            :skyforge-world:test --tests '*SkyIslandContinuousChannelCenterlinePlannerTest' \
            :skyforge-world:test --tests '*SkyIslandSemanticCorridorCenterlinePlannerTest' \
            :skyforge-world:test --tests '*SkyIslandHydraulicChannelNetworkPlannerTest' \
            :skyforge-reference:test --tests '*HydrologyGeomorphicDiagnosticsCorpusTest' \
            :skyforge-world:test --tests '*SkyIslandGeomorphicReachDiagnosticsPlannerTest' \
            :skyforge-world:test --tests '*SkyIslandGeomorphicQualificationEvaluatorTest' \
            :skyforge-world:test --tests '*SkyIslandHydraulicDiscontinuityDiagnosticsPlannerTest' \
            :skyforge-reference:test --tests '*HydrologyDiscontinuityDiagnosticsCorpusTest' \
            :skyforge-world:test --tests '*SkyIslandContinuousWaterbodyPlannerTest' \
            :skyforge-world:test --tests '*SkyIslandContinuousWaterbodyDiagnosticsPlannerTest' \
            :skyforge-reference:test --tests '*HydrologyWaterbodyDiagnosticsCorpusTest' \
            :skyforge-world:test --tests '*SkyIslandContinuousWaterbodyQualificationEvaluatorTest' \
            :skyforge-world:test --tests '*SkyIslandQualifiedFluvialRealizationPlannerTest' \
            --no-configuration-cache

      - name: Print hydrology diagnostic calibration manifests
        if: success()
        run: |
          if [ ! -f skyforge-reference/build/evidence/hydrology-diagnostics-test-a/manifest.csv ]; then
            ./gradlew :skyforge-reference:test --tests '*HydrologyGeomorphicDiagnosticsCorpusTest' --rerun-tasks --no-configuration-cache
          fi
          cat skyforge-reference/build/evidence/hydrology-diagnostics-test-a/manifest.csv
          echo "--- reach-manifest.csv ---"
          cat skyforge-reference/build/evidence/hydrology-diagnostics-test-a/reach-manifest.csv
          if [ ! -f skyforge-reference/build/evidence/hydrology-discontinuity-test-a/manifest.csv ]; then
            ./gradlew :skyforge-reference:test --tests '*HydrologyDiscontinuityDiagnosticsCorpusTest' --rerun-tasks --no-configuration-cache
          fi
          echo "--- discontinuity-manifest.csv ---"
          cat skyforge-reference/build/evidence/hydrology-discontinuity-test-a/manifest.csv
          if [ ! -f skyforge-reference/build/evidence/hydrology-waterbody-diagnostics-test-a/basin-manifest.csv ]; then
            ./gradlew :skyforge-reference:test --tests '*HydrologyWaterbodyDiagnosticsCorpusTest' --rerun-tasks --no-configuration-cache
          fi
          echo "--- basin-manifest.csv ---"
          cat skyforge-reference/build/evidence/hydrology-waterbody-diagnostics-test-a/basin-manifest.csv

      - name: Dump focused failure report
        if: failure()
        run: |
          cat skyforge-world/build/test-results/test/TEST-io.github.nidaba.skyforge.world.SkyIslandGeomorphicChannelNetworkPlannerTest.xml || true
          cat skyforge-world/build/test-results/test/TEST-io.github.nidaba.skyforge.world.SkyIslandHydraulicChannelNetworkPlannerTest.xml || true
