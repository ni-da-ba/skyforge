name: Compiler Platform Composed Mechanism Persistence

on:
  pull_request:
    paths:
      - "docs/agent-state/COMPILER_INTEGRATION_CAPABILITIES.json"
      - "scripts/compiler-integration/run-exact-stack-fixture.sh"
      - "skyforge-neoforge-1211/wave-c1-mods.properties"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeCompilerIntegrationDiagnostic.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeCompilerIntegrationFailure.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeCompilerIntegrationPhase.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeComposedMechanismPersistenceAcceptance.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeNeoForge1211Mod.java"
      - "skyforge-neoforge-1211/src/test/java/io/github/nidaba/skyforge/neoforge1211/CompilerIntegrationDiagnosticTest.java"
      - "skyforge-neoforge-1211/src/test/java/io/github/nidaba/skyforge/neoforge1211/ComposedMechanismPersistenceResourceTest.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-platform-composed-persistence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  l1-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Verify bounded persistence contracts
        run: >-
          ./gradlew :skyforge-neoforge-1211:test
          --tests '*CompilerIntegrationDiagnosticTest'
          --tests '*ComposedMechanismPersistenceResourceTest'
          --no-configuration-cache

  l2-exact-stack:
    needs: l1-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Resolve exact accepted Create/Sable/Aeronautics stack
        run: ./gradlew :skyforge-neoforge-1211:waveC11ResolvePinnedMods --no-configuration-cache
      - name: Boot A — create, operate, and save composed mechanism
        run: >-
          scripts/compiler-integration/run-exact-stack-fixture.sh
          :skyforge-neoforge-1211:runCompilerPlatformComposedMechanismPersistencePrepareServer
          compiler-platform-composed-persistence-prepare.log
          'COMPILER_PLATFORM_COMPOSED_MECHANISM_PERSISTENCE START'
          'COMPILER_PLATFORM_COMPOSED_MECHANISM_PERSISTENCE PREPARE PASS'
          'COMPILER_PLATFORM_COMPOSED_MECHANISM_PERSISTENCE FAIL'
          120
          180
      - name: Boot B — reopen and prove recovered mechanism is live
        run: >-
          scripts/compiler-integration/run-exact-stack-fixture.sh
          :skyforge-neoforge-1211:runCompilerPlatformComposedMechanismPersistenceVerifyServer
          compiler-platform-composed-persistence-verify.log
          'COMPILER_PLATFORM_COMPOSED_MECHANISM_PERSISTENCE START'
          'COMPILER_PLATFORM_COMPOSED_MECHANISM_PERSISTENCE VERIFY PASS'
          'COMPILER_PLATFORM_COMPOSED_MECHANISM_PERSISTENCE FAIL'
          120
          180