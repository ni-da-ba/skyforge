name: Aircraft compiler exact-stack runtime

on:
  pull_request:
    paths:
      - "tools/aircraft_compiler/**"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeAircraftCompilerRuntimeAcceptance.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeAircraftCompilerPropellerRuntimeAcceptance.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeNeoForge1211Mod.java"
      - "skyforge-neoforge-1211/build.gradle.kts"
      - "skyforge-neoforge-1211/wave-c1-mods.properties"
      - ".github/workflows/aircraft-compiler-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aircraft-compiler-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-stack-main-body-assembly:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile deterministic AIRCRAFT-001 runtime fixture through v0.12
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/aircraft_compiler/tests -v
          python tools/aircraft_compiler/compile.py \
            tools/aircraft_compiler/specimens/guild_utility_monoplane_v0.1.json \
            --blockspace-config tools/aircraft_compiler/specimens/guild_utility_monoplane_blockspace_v0.2.json \
            --target-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_target_v0.4.json \
            --propulsion-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_propulsion_v0.5.json \
            --surface-state-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_surface_state_v0.6.json \
            --tail-lowering-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_tail_lowering_v0.7.json \
            --pilot-station-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_pilot_station_v0.8.json \
            --probe-manifest-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_probe_manifest_v0.9.json \
            --out build/aircraft-compiler-runtime
          python tools/aircraft_compiler/assembly_fixture_cli.py \
            build/aircraft-compiler-runtime/probe_placement_manifest.json \
            tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_assembly_fixture_v0.10.json \
            --out build/aircraft-compiler-runtime
          python tools/aircraft_compiler/glue_encoding_cli.py \
            build/aircraft-compiler-runtime/assembly_fixture.json \
            tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_glue_encoding_v0.11.json \
            --out build/aircraft-compiler-runtime
          python tools/aircraft_compiler/powertrain_lowering_cli.py \
            build/aircraft-compiler-runtime/probe_placement_manifest.json \
            build/aircraft-compiler-runtime/glue_encoding.json \
            tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_powertrain_v0.12.json \
            --out build/aircraft-compiler-runtime
          grep -q '"mainBodyPlacementCount": 114' build/aircraft-compiler-runtime/glue_encoding.json
          grep -q '"nestedChildPlacementCount": 9' build/aircraft-compiler-runtime/glue_encoding.json
          grep -q '"glueDomainCount": 4' build/aircraft-compiler-runtime/glue_encoding.json
          grep -q '"resultingMovingMainBodyPlacementCount": 118' build/aircraft-compiler-runtime/powertrain_v0.12.json
          grep -q '"expectedPrimarySableTransferCount": 127' build/aircraft-compiler-runtime/powertrain_v0.12.json
          grep -q '"firstAcceptedTargetRpm": 128' build/aircraft-compiler-runtime/powertrain_v0.12.json

      - name: Wire v0.12 powertrain recapture and nested Propeller Bearing acceptance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeAircraftCompilerRuntimeAcceptance.java")
          source = path.read_text()

          replacements = {
              "private static final int EXPECTED_MOVING_MAIN_BODY = 114;": "private static final int EXPECTED_MOVING_MAIN_BODY = 118;",
              "private static final int EXPECTED_PRIMARY_SABLE_PAYLOAD = 123;": "private static final int EXPECTED_PRIMARY_SABLE_PAYLOAD = 127;",
              "private static final int EXPECTED_GLUE_DOMAINS = 4;": "private static final int EXPECTED_GLUE_DOMAINS = 5;",
              'assertInt("encoded glue domain count", EXPECTED_GLUE_DOMAINS, glueDomainsJson.size());': 'assertInt("encoded v0.11 glue domain count", EXPECTED_GLUE_DOMAINS - 1, glueDomainsJson.size());',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"expected exactly one runtime patch anchor: {old}")
              source = source.replace(old, new)

          schema_anchor = '        assertEquals("glue schema", "aircraft-glue-encoding-ir-0.11", string(glueEncoding, "schemaVersion"));\n'
          if source.count(schema_anchor) != 1:
              raise SystemExit("powertrain JSON anchor drifted")
          schema_injected = schema_anchor + '''        JsonObject powertrain;
          try {
              powertrain = readJson(requirePathProperty("skyforge.dev.aircraftCompilerPowertrain"));
          } catch (IOException failure) {
              throw new IllegalStateException("could not read v0.12 powertrain artifact", failure);
          }
          assertEquals("powertrain schema", "aircraft-powertrain-ir-0.12", string(powertrain, "schemaVersion"));
'''
          source = source.replace(schema_anchor, schema_injected)

          expected_anchor = '        assertInt("main-body expected block count", EXPECTED_MOVING_MAIN_BODY, mainExpected.size());\n'
          if source.count(expected_anchor) != 1:
              raise SystemExit("powertrain expected-map anchor drifted")
          expected_injected = '''        JsonArray powertrainPlacements = powertrain.getAsJsonArray("placements");
          for (JsonElement raw : powertrainPlacements) {
              JsonObject placement = raw.getAsJsonObject();
              BlockPos pos = blockPos(placement.getAsJsonArray("lattice"));
              ExpectedBlock expected = expectedBlock(placement);
              String mode = string(placement, "mode");
              if (mode.equals("replace")) {
                  assertTrue("v0.12 replacement targets existing main-body cell " + pos, mainExpected.containsKey(pos));
                  mainExpected.put(pos, expected);
              } else if (mode.equals("add")) {
                  assertTrue("v0.12 addition coordinate free " + pos,
                          !mainExpected.containsKey(pos) && !propellerPayloadExpected.containsKey(pos));
                  mainExpected.put(pos, expected);
                  mainCoordinates.add(pos);
              } else {
                  fail("unexpected v0.12 placement mode " + mode);
              }
          }
''' + expected_anchor
          source = source.replace(expected_anchor, expected_injected)

          place_anchor = '        level.setBlock(BASE.offset(assemblerRelative), materialize(assemblerExpected), 3);\n'
          if source.count(place_anchor) != 1:
              raise SystemExit("powertrain placement anchor drifted")
          place_injected = place_anchor + '''        for (JsonElement raw : powertrainPlacements) {
              JsonObject placement = raw.getAsJsonObject();
              level.setBlock(
                      BASE.offset(blockPos(placement.getAsJsonArray("lattice"))),
                      materialize(expectedBlock(placement)),
                      3);
          }
'''
          source = source.replace(place_anchor, place_injected)

          glue_anchor = '        assertInt("runtime SuperGlueEntity domain insertion count", EXPECTED_GLUE_DOMAINS, insertedGlue.size());\n'
          if source.count(glue_anchor) != 1:
              raise SystemExit("powertrain glue anchor drifted")
          glue_injected = '''        JsonObject powerplantGlue = powertrain.getAsJsonObject("powerplantGlueDomain");
          BlockPos powerplantFrom = blockPos(powerplantGlue.getAsJsonArray("from"));
          BlockPos powerplantTo = blockPos(powerplantGlue.getAsJsonArray("to"));
          assertSelectionWithinLimit("powerplant", powerplantFrom, powerplantTo);
          Entity powerplantGlueEntity = addGlueDomain(level, "powerplant", powerplantFrom, powerplantTo);
          for (BlockPos child : propellerPayloadCoordinates) {
              assertTrue("powerplant glue excludes propeller payload center " + child,
                      !powerplantGlueEntity.getBoundingBox().contains(Vec3.atCenterOf(BASE.offset(child))));
          }
          insertedGlue.add(powerplantGlueEntity);
''' + glue_anchor
          source = source.replace(glue_anchor, glue_injected)

          marker = '"AIRCRAFT_001_RUNTIME_ASSEMBLY PASS"'
          marker_index = source.find(marker)
          if marker_index < 0 or source.find(marker, marker_index + 1) >= 0:
              raise SystemExit("expected exactly one primary runtime PASS marker")
          insert_at = source.rfind("        LOGGER.log(", 0, marker_index)
          if insert_at < 0:
              raise SystemExit("could not locate primary runtime LOGGER.log call")
          injected = """        BlockPos movedBearingPos = null;
          for (Map.Entry<BlockPos, ExpectedBlock> entry : mainExpected.entrySet()) {
              if (entry.getValue().id().toString().equals("aeronautics:propeller_bearing")) {
                  assertTrue("single moved propeller bearing", movedBearingPos == null);
                  movedBearingPos = BASE.offset(entry.getKey()).offset(offset);
              }
          }
          assertTrue("moved propeller bearing located from compiler manifest", movedBearingPos != null);
          List<BlockPos> movedPropellerPayloadPositions = new ArrayList<>();
          for (BlockPos relative : propellerPayloadExpected.keySet()) {
              movedPropellerPayloadPositions.add(BASE.offset(relative).offset(offset));
          }
          SkyforgeAircraftCompilerPropellerRuntimeAcceptance.verify(
                  level, movedBearingPos, movedPropellerPayloadPositions);

          """
          path.write_text(source[:insert_at] + injected + source[insert_at:])
          PY

      - name: Resolve exact retained flight stack
        run: ./gradlew :skyforge-neoforge-1211:waveC11ResolvePinnedMods --no-configuration-cache

      - name: Execute genuine v0.12 Sable recapture and nested-propeller probes
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: >-
            -Dskyforge.dev.aircraftCompilerRuntime=true
            -Dskyforge.dev.aircraftCompilerManifest=${{ github.workspace }}/build/aircraft-compiler-runtime/probe_placement_manifest.json
            -Dskyforge.dev.aircraftCompilerAssemblyFixture=${{ github.workspace }}/build/aircraft-compiler-runtime/assembly_fixture.json
            -Dskyforge.dev.aircraftCompilerGlueEncoding=${{ github.workspace }}/build/aircraft-compiler-runtime/glue_encoding.json
            -Dskyforge.dev.aircraftCompilerPowertrain=${{ github.workspace }}/build/aircraft-compiler-runtime/powertrain_v0.12.json
        run: |
          set -euo pipefail
          log="aircraft-compiler-runtime.log"
          setsid ./gradlew :skyforge-neoforge-1211:runWaveC12BellancaB0AssemblyServer \
            --no-configuration-cache >"${log}" 2>&1 &
          pid=$!
          outcome=""

          for _ in $(seq 1 300); do
            if grep -Fq "AIRCRAFT_001_RUNTIME_PROPELLER PASS" "${log}" 2>/dev/null \
                && grep -Fq "AIRCRAFT_001_RUNTIME_ASSEMBLY PASS" "${log}" 2>/dev/null; then
              outcome="pass"
              break
            fi
            if grep -Fq "AIRCRAFT_001_RUNTIME_PROPELLER FAIL" "${log}" 2>/dev/null \
                || grep -Fq "AIRCRAFT_001_RUNTIME_ASSEMBLY FAIL" "${log}" 2>/dev/null; then
              outcome="fail"
              break
            fi
            if ! kill -0 "${pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [[ "${outcome}" == "pass" ]]; then
            grep -F "AIRCRAFT_001_RUNTIME_PROPELLER PASS" "${log}"
            grep -F "AIRCRAFT_001_RUNTIME_ASSEMBLY PASS" "${log}"
            kill -TERM -- "-${pid}" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-${pid}" 2>/dev/null || true
            wait "${pid}" 2>/dev/null || true
            exit 0
          fi

          echo "FAIL AIRCRAFT-001 exact-stack v0.12 recapture/nested-propeller runtime probe"
          grep -F "AIRCRAFT_001_RUNTIME_PROPELLER FAIL" "${log}" || true
          grep -F "AIRCRAFT_001_RUNTIME_ASSEMBLY FAIL" "${log}" || true
          tail -n 300 "${log}"
          kill -TERM -- "-${pid}" 2>/dev/null || true
          sleep 1
          kill -KILL -- "-${pid}" 2>/dev/null || true
          wait "${pid}" 2>/dev/null || true
          exit 1