name: Aircraft compiler exact-stack runtime

on:
  pull_request:
    paths:
      - "tools/aircraft_compiler/**"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeAircraftCompilerRuntimeAcceptance.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeAircraftCompilerPropellerRuntimeAcceptance.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeAircraftCompilerPowertrainRuntimeAcceptance.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeAircraftCompilerYawRuntimeAcceptance.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeAircraftCompilerYawActuationRuntimeAcceptance.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeNeoForge1211Mod.java"
      - "skyforge-neoforge-1211/build.gradle.kts"
      - "skyforge-neoforge-1211/wave-c1-mods.properties"
      - ".github/workflows/aircraft-compiler-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aircraft-compiler-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-stack-main-body-assembly:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Compile deterministic AIRCRAFT-001 runtime fixture through v0.14
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/aircraft_compiler/tests -v
          python tools/aircraft_compiler/compile.py \
            tools/aircraft_compiler/specimens/guild_utility_monoplane_v0.1.json \
            --blockspace-config tools/aircraft_compiler/specimens/guild_utility_monoplane_blockspace_v0.2.json \
            --target-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_target_v0.4.json \
            --propulsion-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_propulsion_v0.5.json \
            --surface-state-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_surface_state_v0.6.json \
            --tail-lowering-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_tail_lowering_v0.7.json \
            --pilot-station-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_pilot_station_v0.8.json \
            --probe-manifest-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_probe_manifest_v0.9.json \
            --out build/aircraft-compiler-runtime
          python tools/aircraft_compiler/assembly_fixture_cli.py \
            build/aircraft-compiler-runtime/probe_placement_manifest.json \
            tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_assembly_fixture_v0.10.json \
            --out build/aircraft-compiler-runtime
          python tools/aircraft_compiler/glue_encoding_cli.py \
            build/aircraft-compiler-runtime/assembly_fixture.json \
            tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_glue_encoding_v0.11.json \
            --out build/aircraft-compiler-runtime
          python tools/aircraft_compiler/powertrain_lowering_cli.py \
            build/aircraft-compiler-runtime/probe_placement_manifest.json \
            build/aircraft-compiler-runtime/glue_encoding.json \
            tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_powertrain_v0.12.json \
            --out build/aircraft-compiler-runtime
          python tools/aircraft_compiler/control_surface_lowering_cli.py \
            build/aircraft-compiler-runtime/probe_placement_manifest.json \
            build/aircraft-compiler-runtime/glue_encoding.json \
            build/aircraft-compiler-runtime/powertrain_v0.12.json \
            tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_yaw_control_v0.13.json \
            --out build/aircraft-compiler-runtime
          python tools/aircraft_compiler/control_surface_correction_cli.py \
            build/aircraft-compiler-runtime/probe_placement_manifest.json \
            build/aircraft-compiler-runtime/glue_encoding.json \
            build/aircraft-compiler-runtime/powertrain_v0.12.json \
            build/aircraft-compiler-runtime/yaw_control_v0.13.json \
            tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_yaw_control_v0.13.1.json \
            --out build/aircraft-compiler-runtime
          python tools/aircraft_compiler/yaw_actuation_cli.py \
            build/aircraft-compiler-runtime/probe_placement_manifest.json \
            build/aircraft-compiler-runtime/powertrain_v0.12.json \
            build/aircraft-compiler-runtime/yaw_control_v0.13.1.json \
            tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_yaw_actuation_v0.14.json \
            --out build/aircraft-compiler-runtime
          python - <<'PY'
          import json
          from pathlib import Path
          yaw = json.loads(Path("build/aircraft-compiler-runtime/yaw_control_v0.13.1.json").read_text())
          act = json.loads(Path("build/aircraft-compiler-runtime/yaw_actuation_v0.14.json").read_text())
          assert yaw["validation"]["passed"] is True
          assert yaw["metrics"]["v0131MovingParentMainBodyPlacementCount"] == 118
          assert yaw["metrics"]["nestedPropellerChildPlacementCount"] == 9
          assert yaw["metrics"]["yawControlChildPlacementCount"] == 4
          assert yaw["metrics"]["resultingManifestPlacementCount"] == 130
          assert yaw["metrics"]["expectedPrimarySableTransferCount"] == 131
          assert yaw["metrics"]["runtimeGlueDomainCount"] == 7
          assert yaw["readiness"]["rudderChildCaptureProbeReady"] is True
          assert yaw["readiness"]["controlActuationProbeReady"] is False
          assert act["validation"]["passed"] is True
          assert act["schemaVersion"] == "aircraft-yaw-actuation-ir-0.14"
          assert act["sourceYawControlDigestSha256"] == yaw["digestSha256"]
          assert act["swivelBearingCoordinate"] == [18, 3, 0]
          assert act["driveCogCoordinate"] == [18, 3, 1]
          assert act["creativeMotorCoordinate"] == [18, 2, 1]
          assert act["runtimeProbe"]["expectedCreativeMotorRpmMagnitude"] == 16
          assert act["readiness"]["actuationRuntimeProbeReady"] is True
          assert act["readiness"]["productionControlBindingReady"] is False
          assert act["readiness"]["yawForceQualified"] is False
          PY

      - name: Patch exact-stack runtime harness through v0.14 real-kinetic yaw actuation
        shell: bash
        run: |
          set -euo pipefail
          python tools/aircraft_compiler/runtime_v012_patch.py \
            skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeAircraftCompilerRuntimeAcceptance.java
          python tools/aircraft_compiler/runtime_v0131_patch.py \
            skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeAircraftCompilerRuntimeAcceptance.java
          python tools/aircraft_compiler/runtime_v014_patch.py \
            skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeAircraftCompilerRuntimeAcceptance.java
          grep -q "EXPECTED_PRIMARY_SABLE_PAYLOAD = 131" \
            skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeAircraftCompilerRuntimeAcceptance.java
          grep -q "EXPECTED_V0131_MOVING_PARENT_MAIN_BODY = 118" \
            skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeAircraftCompilerRuntimeAcceptance.java
          grep -q "SkyforgeAircraftCompilerYawRuntimeAcceptance.verify" \
            skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeAircraftCompilerRuntimeAcceptance.java
          grep -q "SkyforgeAircraftCompilerYawActuationRuntimeAcceptance.verify" \
            skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeAircraftCompilerRuntimeAcceptance.java

      - name: Resolve exact retained flight stack
        run: ./gradlew :skyforge-neoforge-1211:waveC11ResolvePinnedMods --no-configuration-cache

      - name: Execute genuine v0.14 131-cell Sable recapture, yaw child, real-kinetic actuation, propeller and governed ladder probes
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: >-
            -Dskyforge.dev.aircraftCompilerRuntime=true
            -Dskyforge.dev.aircraftCompilerManifest=${{ github.workspace }}/build/aircraft-compiler-runtime/probe_placement_manifest.json
            -Dskyforge.dev.aircraftCompilerAssemblyFixture=${{ github.workspace }}/build/aircraft-compiler-runtime/assembly_fixture.json
            -Dskyforge.dev.aircraftCompilerGlueEncoding=${{ github.workspace }}/build/aircraft-compiler-runtime/glue_encoding.json
            -Dskyforge.dev.aircraftCompilerPowertrain=${{ github.workspace }}/build/aircraft-compiler-runtime/powertrain_v0.12.json
            -Dskyforge.dev.aircraftCompilerYawControlCorrection=${{ github.workspace }}/build/aircraft-compiler-runtime/yaw_control_v0.13.1.json
            -Dskyforge.dev.aircraftCompilerYawActuation=${{ github.workspace }}/build/aircraft-compiler-runtime/yaw_actuation_v0.14.json
        run: |
          set -euo pipefail
          log="aircraft-compiler-runtime.log"
          setsid ./gradlew :skyforge-neoforge-1211:runWaveC12BellancaB0AssemblyServer \
            --no-configuration-cache >"${log}" 2>&1 &
          pid=$!
          outcome=""

          for _ in $(seq 1 360); do
            if grep -Fq "AIRCRAFT_001_RUNTIME_YAW_ACTUATION PASS" "${log}" 2>/dev/null \
                && grep -Fq "AIRCRAFT_001_RUNTIME_YAW_CHILD PASS" "${log}" 2>/dev/null \
                && grep -Fq "AIRCRAFT_001_RUNTIME_POWERTRAIN PASS" "${log}" 2>/dev/null \
                && grep -Fq "AIRCRAFT_001_RUNTIME_PROPELLER PASS" "${log}" 2>/dev/null \
                && grep -Fq "AIRCRAFT_001_RUNTIME_ASSEMBLY PASS" "${log}" 2>/dev/null; then
              outcome="pass"
              break
            fi
            if grep -Fq "AIRCRAFT_001_RUNTIME_YAW_ACTUATION FAIL" "${log}" 2>/dev/null \
                || grep -Fq "AIRCRAFT_001_RUNTIME_YAW_CHILD FAIL" "${log}" 2>/dev/null \
                || grep -Fq "AIRCRAFT_001_RUNTIME_POWERTRAIN FAIL" "${log}" 2>/dev/null \
                || grep -Fq "AIRCRAFT_001_RUNTIME_PROPELLER FAIL" "${log}" 2>/dev/null \
                || grep -Fq "AIRCRAFT_001_RUNTIME_ASSEMBLY FAIL" "${log}" 2>/dev/null; then
              outcome="fail"
              break
            fi
            if ! kill -0 "${pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [[ "${outcome}" == "pass" ]]; then
            grep -F "AIRCRAFT_001_RUNTIME_YAW_ACTUATION PASS" "${log}"
            grep -F "AIRCRAFT_001_RUNTIME_YAW_CHILD PASS" "${log}"
            grep -F "AIRCRAFT_001_RUNTIME_PROPELLER PASS" "${log}"
            grep -F "AIRCRAFT_001_RUNTIME_POWERTRAIN PASS" "${log}"
            grep -F "AIRCRAFT_001_RUNTIME_ASSEMBLY PASS" "${log}"
            kill -TERM -- "-${pid}" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-${pid}" 2>/dev/null || true
            wait "${pid}" 2>/dev/null || true
            exit 0
          fi

          echo "FAIL AIRCRAFT-001 exact-stack v0.14 yaw-actuation/runtime probe"
          grep -F "AIRCRAFT_001_RUNTIME_YAW_ACTUATION FAIL" "${log}" || true
          grep -F "AIRCRAFT_001_RUNTIME_YAW_CHILD FAIL" "${log}" || true
          grep -F "AIRCRAFT_001_RUNTIME_POWERTRAIN FAIL" "${log}" || true
          grep -F "AIRCRAFT_001_RUNTIME_PROPELLER FAIL" "${log}" || true
          grep -F "AIRCRAFT_001_RUNTIME_ASSEMBLY FAIL" "${log}" || true
          tail -n 420 "${log}"
          kill -TERM -- "-${pid}" 2>/dev/null || true
          sleep 1
          kill -KILL -- "-${pid}" 2>/dev/null || true
          wait "${pid}" 2>/dev/null || true
          exit 1
