name: SF-IMP-0071 Finalize Acceptance Gate

on:
  push:
    branches:
      - perf/524-packetize-catchup
    paths:
      - .github/workflows/sf-imp-0071-optimize-v3.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/524-packetize-catchup
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Align packet latency gates with issue 524
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          build = Path('skyforge-neoforge-1211/build.gradle.kts')
          text = build.read_text()
          max_line = '        val packetWallMax = properties.getProperty("perf.terrain.deferred.packetWallNanos.max").toLong()\n'
          target = '        val packetWallMaxTargetNanos =\n              System.getenv("SKYFORGE_SF_IMP_0071_PACKET_MAX_NANOS")\n                  ?.toLongOrNull()\n                  ?: 16_000_000L\n        check(packetWallMaxTargetNanos > 0L) {\n            "SF-IMP-0071 packet wall-time target must be positive: target=$packetWallMaxTargetNanos"\n        }\n'
          if text.count(max_line) != 1:
              raise SystemExit('packet-wall max seam changed')
          text = text.replace(max_line, max_line + target, 1)
          old_gate = '                && packetWallMax < 16_000_000L) {\n'
          if text.count(old_gate) != 1:
              raise SystemExit('packet-wall hard gate seam changed')
          text = text.replace(old_gate, '                && packetWallMax < packetWallMaxTargetNanos) {\n', 1)
          old_msg = '                  "p95=$packetWallP95, p99=$packetWallP99, max=$packetWallMax"\n'
          if text.count(old_msg) != 1:
              raise SystemExit('packet-wall diagnostic seam changed')
          text = text.replace(old_msg, '                  "p95=$packetWallP95, p99=$packetWallP99, max=$packetWallMax, target=$packetWallMaxTargetNanos"\n', 1)
          build.write_text(text)
          workflow = Path('.github/workflows/low-end-scalability.yml')
          text = workflow.read_text()
          old = '            local cpuset="$4"\n            local out="$benchmark_root/$name"\n'
          new = '            local cpuset="$4"\n            local packet_max_nanos="$5"\n            local out="$benchmark_root/$name"\n'
          if text.count(old) != 1:
              raise SystemExit('profile local seam changed')
          text = text.replace(old, new, 1)
          old = '              env JAVA_TOOL_OPTIONS="-XX:ActiveProcessorCount=${active_cpus} -Xmx${heap_gib}g" \\\n              taskset -c "$cpuset" \\\n'
          new = '              env SKYFORGE_SF_IMP_0071_PACKET_MAX_NANOS="$packet_max_nanos" \\\n                  JAVA_TOOL_OPTIONS="-XX:ActiveProcessorCount=${active_cpus} -Xmx${heap_gib}g" \\\n              taskset -c "$cpuset" \\\n'
          if text.count(old) != 1:
              raise SystemExit('profile environment seam changed')
          text = text.replace(old, new, 1)
          old = '          run_profile reference-4cpu-8g 4 8 0-3\n          run_profile constrained-2cpu-6g 2 6 0-1\n          run_profile low-1cpu-4g 1 4 0\n'
          new = '          # #524: <16 ms is the strong reference target; constrained profiles retain a strict <50 ms one-tick ceiling.\n          run_profile reference-4cpu-8g 4 8 0-3 16000000\n          run_profile constrained-2cpu-6g 2 6 0-1 50000000\n          run_profile low-1cpu-4g 1 4 0 50000000\n'
          if text.count(old) != 1:
              raise SystemExit('profile invocation seam changed')
          workflow.write_text(text.replace(old, new, 1))
          PY

      - name: Validate focused code and build script
        run: ./gradlew :skyforge-neoforge-1211:test :skyforge-neoforge-1211:compileJava --stacktrace --no-configuration-cache

      - name: Commit final gate and remove temporary patch workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skyforge-neoforge-1211/build.gradle.kts .github/workflows/low-end-scalability.yml
          for path in .github/workflows/sf-imp-0071-align-packet-gate.yml .github/workflows/sf-imp-0071-close-gaps.yml .github/workflows/sf-imp-0071-evidence.yml .github/workflows/sf-imp-0071-optimize.yml .github/workflows/sf-imp-0071-optimize-v2.yml .github/workflows/sf-imp-0071-optimize-v3.yml; do
            if [[ -f "$path" ]]; then git rm -f "$path"; fi
          done
          git diff --cached --check
          git commit -m "SF-IMP-0071: align packet latency gates with acceptance contract"
          git push origin HEAD:perf/524-packetize-catchup
