name: SF-IMP-0071 Finalize Build Gate

on:
  push:
    branches:
      - perf/524-packetize-catchup
    paths:
      - .github/workflows/sf-imp-0071-optimize-v3.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/524-packetize-catchup
          fetch-depth: 0

      - name: Select reference versus constrained packet target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('skyforge-neoforge-1211/build.gradle.kts')
          text = path.read_text()
          old = 'System.getenv("SKYFORGE_SF_IMP_0071_PACKET_MAX_NANOS")?.toLongOrNull() ?: 16_000_000L'
          new = 'System.getenv("SKYFORGE_SF_IMP_0071_PACKET_MAX_NANOS")?.toLongOrNull() ?: if (Runtime.getRuntime().availableProcessors() >= 4) 16_000_000L else 50_000_000L'
          if text.count(old) != 1:
              raise SystemExit('parameterized packet target seam changed')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate build script
        run: ./gradlew :skyforge-neoforge-1211:compileJava --stacktrace --no-configuration-cache

      - name: Commit verifier target selection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skyforge-neoforge-1211/build.gradle.kts
          git diff --cached --check
          git commit -m "SF-IMP-0071: distinguish reference and constrained packet gates"
          git push origin HEAD:perf/524-packetize-catchup
