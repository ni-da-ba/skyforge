name: SF-IMP-0071 Validate 256-Write Packet Target

on:
  push:
    branches:
      - perf/524-packetize-catchup
    paths:
      - .github/workflows/sf-imp-0071-optimize-v3.yml

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/524-packetize-catchup
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Tune operational packet target from measured evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgePhysicalVolumeCatchupService.java')
          text = path.read_text()
          old = '''    /**
     * Evidence-tuned operating target. The initial 1024-write reference run reached a 26.1 ms
     * outlier despite a 15.1 ms p99, so use half the contractual ceiling to leave deterministic
     * headroom under the 16 ms packet target without weakening the 1024-write hard guard.
     */
    static final int TARGET_ASSIGNED_SOLID_WRITES_PER_TERRAIN_QUANTUM = 512;
'''
          new = '''    /**
     * Evidence-tuned operating target. At 512 writes the 4-CPU profile cleared the 16 ms hard
     * packet gate (14.37 ms max), while the constrained 2-CPU profile retained a 34.30 ms isolated
     * wall-clock outlier despite a 7.32 ms p99. Use 256 writes to reduce deterministic packet work
     * while retaining the issue #524 1024-write hard safety ceiling.
     */
    static final int TARGET_ASSIGNED_SOLID_WRITES_PER_TERRAIN_QUANTUM = 256;
'''
          if old not in text:
              raise SystemExit('expected 512-write target block not found; refusing blind edit')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Run focused validation
        run: ./gradlew :skyforge-neoforge-1211:test :skyforge-neoforge-1211:compileJava --stacktrace --no-configuration-cache

      - name: Commit tuned production target
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgePhysicalVolumeCatchupService.java
          git diff --cached --check
          git commit -m "SF-IMP-0071: tune catch-up packet target to 256 writes"
          git push origin HEAD:perf/524-packetize-catchup
