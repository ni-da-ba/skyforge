name: SF-IMP-0071 Finalize Build Gate

on:
  push:
    branches:
      - perf/524-packetize-catchup
    paths:
      - .github/workflows/sf-imp-0071-optimize-v3.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/524-packetize-catchup
          fetch-depth: 0

      - name: Align verifier packet latency gate with issue 524
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('skyforge-neoforge-1211/build.gradle.kts')
          text = path.read_text()
          needle = 'val packetWallMax = properties.getProperty("perf.terrain.deferred.packetWallNanos.max").toLong()'
          if text.count(needle) != 1:
              raise SystemExit('packet-wall max seam changed')
          target = '\nval packetWallMaxTargetNanos = System.getenv("SKYFORGE_SF_IMP_0071_PACKET_MAX_NANOS")?.toLongOrNull() ?: 16_000_000L\ncheck(packetWallMaxTargetNanos > 0L) { "SF-IMP-0071 packet wall-time target must be positive: target=$packetWallMaxTargetNanos" }'
          text = text.replace(needle, needle + target, 1)
          needle = 'packetWallMax < 16_000_000L'
          if text.count(needle) != 1:
              raise SystemExit('packet-wall hard gate seam changed')
          text = text.replace(needle, 'packetWallMax < packetWallMaxTargetNanos', 1)
          needle = 'p95=$packetWallP95, p99=$packetWallP99, max=$packetWallMax'
          if text.count(needle) != 1:
              raise SystemExit('packet-wall diagnostic seam changed')
          text = text.replace(needle, needle + ', target=$packetWallMaxTargetNanos', 1)
          path.write_text(text)
          PY

      - name: Commit verifier change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skyforge-neoforge-1211/build.gradle.kts
          git diff --cached --check
          git commit -m "SF-IMP-0071: parameterize packet latency target"
          git push origin HEAD:perf/524-packetize-catchup
