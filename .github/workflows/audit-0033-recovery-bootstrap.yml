name: AUDIT-0033 Recovery Bootstrap

on:
  push:
    branches:
      - audit/audit-0033-live-authority-starvation-recovery

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply recovery patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/audit0033_recover.py
          python3 /tmp/audit0033_recover.py
      - name: Run orchestrator regression suite
        run: python3 -m unittest scripts/orchestrator/test_skyforge_orchestrator.py
      - name: Check patch hygiene
        run: git diff --check
      - name: Commit recovery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "AUDIT-0033: prevent restart authority starvation"
          git push origin HEAD:audit/audit-0033-live-authority-starvation-recovery
