name: Aircraft Rudder Actuation Runtime

on:
  pull_request:
    paths:
      - "docs/agent-state/AIRCRAFT_COMPILER_STATE.md"
      - "docs/agent-state/COMPILER_INTEGRATION_CAPABILITIES.json"
      - "scripts/compiler-integration/run-exact-stack-fixture.sh"
      - "skyforge-neoforge-1211/wave-c1-mods.properties"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeAircraft*.java"
      - "skyforge-neoforge-1211/src/test/java/io/github/nidaba/skyforge/neoforge1211/AircraftRudderActuationResourceTest.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aircraft-rudder-actuation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  l1-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Verify production yaw and runtime boundary contracts
        run: >-
          ./gradlew :skyforge-neoforge-1211:test
          --tests '*AircraftRudderActuationResourceTest'
          --tests '*SkyforgeAircraftYawControlLowererTest'
          --no-configuration-cache

  l2-exact-stack:
    needs: l1-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Resolve exact accepted Create/Sable/Aeronautics stack
        run: ./gradlew :skyforge-neoforge-1211:waveC11ResolvePinnedMods --no-configuration-cache
      - name: Qualify corrected production rudder actuation and commanded neutral return
        run: >-
          scripts/compiler-integration/run-exact-stack-fixture.sh
          :skyforge-neoforge-1211:runAircraftRudderActuationServer
          aircraft-rudder-actuation.log
          'AIRCRAFT_V0131_RUDDER_ACTUATION_RUNTIME START'
          'AIRCRAFT_V0131_RUDDER_ACTUATION_RUNTIME PASS'
          'AIRCRAFT_V0131_RUDDER_ACTUATION_RUNTIME FAIL'
          150
          300