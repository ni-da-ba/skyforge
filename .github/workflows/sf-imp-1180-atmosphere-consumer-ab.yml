name: SF-IMP-1180 Atmosphere Consumer A-B

on:
  pull_request:
    paths:
      - ".github/workflows/sf-imp-1180-atmosphere-consumer-ab.yml"
      - "third_party/patches/aerodynamics4mc/**"
      - "tools/analyze_atmosphere_consumer_ab.py"
      - "skyforge-neoforge-1211/build.gradle.kts"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeAtmosphereConsumerAbDiagnostic.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeWaveC6SoaringFaunaDevRuntime.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeGliderLiftCoupling.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeNeoForge1211Mod.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sf-imp-1180-atmosphere-consumer-ab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  machine-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Skyforge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact pinned A4MC source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MozillaFiredoge/Aerodynamics4MC-Core
          ref: 62a52a584e9c65246e50226b29a1f0449e43995e
          path: a4mc-source
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Apply and build exact public terrain-provider seam
        shell: bash
        run: |
          set -euo pipefail
          git -C a4mc-source apply --check ../third_party/patches/aerodynamics4mc/0001-public-terrain-provider-api.patch
          git -C a4mc-source apply ../third_party/patches/aerodynamics4mc/0001-public-terrain-provider-api.patch
          cd a4mc-source
          ./gradlew buildAndCollect --no-daemon
          patched_core=""
          while IFS= read -r candidate; do
            [[ "$(basename "$candidate")" == *'-neoforge+1.21.1-SNAPSHOT.jar' ]] || continue
            jar tf "$candidate" | grep -Fqx 'com/aerodynamics4mc/runtime/AeroServerRuntime.class' || continue
            if jar tf "$candidate" | grep -Fqx 'com/aerodynamics4mc/api/AeroTerrainApi.class'; then
              patched_core="$(realpath "$candidate")"
              break
            fi
            nested_api="$(jar tf "$candidate" | grep -E '^META-INF/jarjar/.*aerodynamics4mc-api.*[.]jar$' | head -n1 || true)"
            if [[ -n "$nested_api" ]]; then
              tmp_api="$(mktemp --suffix=.jar)"
              unzip -p "$candidate" "$nested_api" > "$tmp_api"
              if jar tf "$tmp_api" | grep -Fqx 'com/aerodynamics4mc/api/AeroTerrainApi.class'; then
                patched_core="$(realpath "$candidate")"
                rm -f "$tmp_api"
                break
              fi
              rm -f "$tmp_api"
            fi
          done < <(find build/libs -maxdepth 4 -type f -name '*.jar' -print | sort)
          test -n "$patched_core"
          echo "A4MC_PATCHED_CORE=$patched_core" >> "$GITHUB_ENV"

      - name: Compile diagnostic surfaces
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :skyforge-neoforge-1211:test             --tests '*SkyforgeGliderLiftCouplingTest'             --tests '*SkyforgeThermalSoaringDecisionTest'             -PskyforgeA4mcProbeCoreOverrideJar="$A4MC_PATCHED_CORE"             --no-configuration-cache
          ./gradlew :skyforge-neoforge-1211:waveC3ResolvePinnedMods             -PskyforgeA4mcProbeCoreOverrideJar="$A4MC_PATCHED_CORE"             --no-configuration-cache

      - name: Prepare pristine accepted DR-50 world and cloned hawk arms
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :skyforge-neoforge-1211:runDr50IntegratedRegionAcceptanceA --no-configuration-cache
          test -f skyforge-neoforge-1211/run-dr50-auto-a/saves/acceptance/level.dat
          rm -rf /tmp/skyforge-dr50-pristine
          cp -a skyforge-neoforge-1211/run-dr50-auto-a /tmp/skyforge-dr50-pristine
          rm -rf skyforge-neoforge-1211/run-sf-imp-1180-hawk-control
          rm -rf skyforge-neoforge-1211/run-sf-imp-1180-hawk-treatment
          cp -a /tmp/skyforge-dr50-pristine skyforge-neoforge-1211/run-sf-imp-1180-hawk-control
          cp -a /tmp/skyforge-dr50-pristine skyforge-neoforge-1211/run-sf-imp-1180-hawk-treatment
          rm -rf skyforge-neoforge-1211/build/acceptance/sf-imp-1180
          mkdir -p skyforge-neoforge-1211/build/acceptance/sf-imp-1180

      - name: Configure unattended atmosphere probe client
        shell: bash
        run: |
          set -euo pipefail
          run_dir="skyforge-neoforge-1211/run-wave-c3-skyforge-atmosphere-probe-client"
          mkdir -p "$run_dir"
          printf '%s\n' 'onboardAccessibility:false' 'pauseOnLostFocus:false' > "$run_dir/options.txt"

      - name: Acquire realized-terrain real-provider treatment field
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          server_log="sf-imp-1180-glider-probe-server.log"
          client_log="sf-imp-1180-glider-probe-client.log"
          result_dir="skyforge-neoforge-1211/build/acceptance/atmosphere-probe-skyforge"
          rm -rf "$result_dir"
          rm -rf skyforge-neoforge-1211/run-dr50-auto-a
          cp -a /tmp/skyforge-dr50-pristine skyforge-neoforge-1211/run-dr50-auto-a

          cleanup() {
            if [[ -n "${client_pid:-}" ]]; then kill -TERM -- "-${client_pid}" 2>/dev/null || true; fi
            if [[ -n "${server_pid:-}" ]]; then kill -TERM -- "-${server_pid}" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          setsid ./gradlew             :skyforge-neoforge-1211:runWaveC3SkyforgeAtmosphereProbeServer             -PskyforgeA4mcProbeCoreOverrideJar="$A4MC_PATCHED_CORE"             -PskyforgeA4mcTerrainProvider=true             --no-daemon --no-configuration-cache >"$server_log" 2>&1 &
          server_pid=$!

          ready=0
          for _ in $(seq 1 240); do
            grep -Fq "Done (" "$server_log" 2>/dev/null && ready=1 && break || true
            kill -0 "$server_pid" 2>/dev/null || break
            sleep 1
          done
          [[ "$ready" -eq 1 ]] || { cat "$server_log"; exit 1; }

          setsid xvfb-run -a ./gradlew             :skyforge-neoforge-1211:runWaveC3SkyforgeAtmosphereProbeClient             -PskyforgeA4mcProbeCoreOverrideJar="$A4MC_PATCHED_CORE"             --no-daemon --no-configuration-cache >"$client_log" 2>&1 &
          client_pid=$!

          outcome=""
          for _ in $(seq 1 360); do
            grep -Fq "SKYFORGE_ATMOSPHERE_PROBE_VOLUME PASS" "$server_log" 2>/dev/null && outcome="pass" && break || true
            grep -Fq "SKYFORGE AUTOMATED ACCEPTANCE FAIL" "$server_log" 2>/dev/null && outcome="fail" && break || true
            kill -0 "$server_pid" 2>/dev/null || break
            sleep 1
          done
          [[ "$outcome" == "pass" ]] || { cat "$server_log"; cat "$client_log"; exit 1; }
          test -f "$result_dir/probe-volume.json"
          cp "$result_dir/probe-volume.json" skyforge-neoforge-1211/build/acceptance/sf-imp-1180/glider-probe.json

      - name: Quantify exact C7 effect against real field
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/analyze_atmosphere_consumer_ab.py glider             skyforge-neoforge-1211/build/acceptance/sf-imp-1180/glider-probe.json             skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeGliderLiftCoupling.java             skyforge-neoforge-1211/build/acceptance/sf-imp-1180/glider-ab.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("skyforge-neoforge-1211/build/acceptance/sf-imp-1180/glider-ab.json").read_text())
          assert data["terrain_provider_enabled"] is True
          assert data["terrain_provider_registered"] is True
          assert data["machine_measurable"] is True
          PY

      - name: Run stock Fowl Play hawk control
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :skyforge-neoforge-1211:runSfImp1180HawkControlServer             -PskyforgeA4mcProbeCoreOverrideJar="$A4MC_PATCHED_CORE"             --no-daemon --no-configuration-cache | tee sf-imp-1180-hawk-control.log
          grep -F "SF_IMP_1180_HAWK_AB PASS arm=control" sf-imp-1180-hawk-control.log
          test -f skyforge-neoforge-1211/build/acceptance/sf-imp-1180/hawk-control.json

      - name: Run C6-adapted hawk treatment
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :skyforge-neoforge-1211:runSfImp1180HawkTreatmentServer             -PskyforgeA4mcProbeCoreOverrideJar="$A4MC_PATCHED_CORE"             --no-daemon --no-configuration-cache | tee sf-imp-1180-hawk-treatment.log
          grep -F "SF_IMP_1180_HAWK_AB PASS arm=treatment" sf-imp-1180-hawk-treatment.log
          test -f skyforge-neoforge-1211/build/acceptance/sf-imp-1180/hawk-treatment.json

      - name: Compare hawk behavior arms
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/analyze_atmosphere_consumer_ab.py hawks             skyforge-neoforge-1211/build/acceptance/sf-imp-1180/hawk-control.json             skyforge-neoforge-1211/build/acceptance/sf-imp-1180/hawk-treatment.json             skyforge-neoforge-1211/build/acceptance/sf-imp-1180/hawk-ab.json

      - name: Upload #1180 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sf-imp-1180-atmosphere-consumer-ab-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            skyforge-neoforge-1211/build/acceptance/sf-imp-1180/**
            sf-imp-1180-*.log
