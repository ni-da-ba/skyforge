name: Studio Pages Preview

on:
  workflow_dispatch:
  push:
    branches:
      - studio/hydrology-comparison
      - studio/local-world-brief
      - studio/provenance-inspector
      - studio/regional-comparison-package
      - studio/regional-comparison-library
      - studio/inspection-workspaces
      - studio/remember-inspector-session
      - studio/terrain-volume-comparison
      - studio/terrain-comparison-report
      - studio/terrain-comparison-walkthrough
      - studio/terrain-comparison-library
      - studio/saved-terrain-comparisons-empty-state
    paths:
      - "scripts/orchestrator/studio/**"
      - "scripts/ci/test_studio_terrain_comparison_report.js"
      - "scripts/ci/test_studio_terrain_comparison_demo.js"
      - "scripts/ci/test_studio_terrain_comparison_library.js"
      - "scripts/ci/stage_evidence_review_bundle.py"
      - ".github/workflows/studio-pages-preview.yml"

permissions:
  contents: read

concurrency:
  group: studio-pages-preview
  cancel-in-progress: true

jobs:
  build:
    name: Build exact S2 Studio preview
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Build, test, and generate the bound S2 specimen
        run: ./gradlew check :skyforge-reference:fixedSeedCorpus :skyforge-reference:suspendedVolumeEvidence :skyforge-reference:studioBoundHydrologySemanticCorpus

      - name: Verify evidence review entry points
        run: python3 scripts/ci/verify_evidence_entry_points.py --verify-files

      - name: Stage the exact Studio review bundle
        run: python3 scripts/ci/stage_evidence_review_bundle.py --stage

      - name: Disable Jekyll processing
        run: touch build/ci-evidence-review/studio-app/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/ci-evidence-review/studio-app

  deploy:
    name: Publish temporary Studio preview
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy Studio preview
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
