name: Evidence Contract Snapshot

on:
  pull_request:
    paths:
      - ".github/workflows/evidence-contract-snapshot.yml"
      - ".github/workflows/ci.yml"
      - "scripts/ci/verify_evidence_entry_points.py"

permissions:
  contents: read

concurrency:
  group: evidence-contract-snapshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Emit canonical evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_evidence_entry_points.py --emit-manifest > evidence-entry-points.json
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          payload = json.loads(Path("evidence-entry-points.json").read_text(encoding="utf-8"))
          paths = payload["required_paths"]
          digest = hashlib.sha256(("\n".join(paths) + "\n").encode()).hexdigest()
          print(f"required_paths={len(paths)}")
          print(f"contract_sha256={digest}")
          PY

      - name: Publish snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-entry-points-snapshot-${{ github.sha }}
          path: evidence-entry-points.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
