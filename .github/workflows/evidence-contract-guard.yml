name: Evidence Contract Guard

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/evidence-contract-guard.yml"
      - "config/ci/evidence-entry-points.json"
      - "scripts/ci/verify_evidence_entry_points.py"
      - "scripts/ci/test_verify_evidence_entry_points.py"
      - "scripts/ci/stage_evidence_review_bundle.py"
      - "scripts/ci/test_stage_evidence_review_bundle.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/evidence-contract-guard.yml"
      - "config/ci/evidence-entry-points.json"
      - "scripts/ci/verify_evidence_entry_points.py"
      - "scripts/ci/test_verify_evidence_entry_points.py"
      - "scripts/ci/stage_evidence_review_bundle.py"
      - "scripts/ci/test_stage_evidence_review_bundle.py"

permissions:
  contents: read

concurrency:
  group: evidence-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run CI helper unit tests
        working-directory: scripts/ci
        run: python3 -m unittest -v test_verify_evidence_entry_points.py test_stage_evidence_review_bundle.py

      - name: Validate canonical evidence manifest
        run: python3 scripts/ci/verify_evidence_entry_points.py --validate-manifest

      - name: Verify canonical CI consumes the manifest
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqx '        run: python3 scripts/ci/verify_evidence_entry_points.py --verify-files' .github/workflows/ci.yml
          if grep -Fq 'test -f skyforge-reference/build/evidence/' .github/workflows/ci.yml; then
            echo 'Inline evidence-path assertions remain in canonical CI.'
            exit 1
          fi

      - name: Validate evidence review bundle policy
        run: |
          python3 scripts/ci/stage_evidence_review_bundle.py
          grep -Fqx '        run: python3 scripts/ci/stage_evidence_review_bundle.py --stage' .github/workflows/ci.yml
          grep -Fqx '          path: build/ci-evidence-review/' .github/workflows/ci.yml
          if grep -Fq 'skyforge-reference/build/evidence/' .github/workflows/ci.yml; then
            echo 'Inline evidence paths remain in canonical CI.'
            exit 1
          fi
