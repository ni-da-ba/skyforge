name: DR-30 Native Structure Acceptance

on:
  pull_request:
    paths:
      - "skyforge-neoforge-1211/src/main/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dr30-native-structure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Qualify native placement, reload mutation, and stacked isolation
        timeout-minutes: 30
        run: ./gradlew :skyforge-neoforge-1211:dr30NativeStructureAcceptance --stacktrace --no-configuration-cache

      - name: Publish DR-30 runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dr30-native-structure-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            skyforge-neoforge-1211/build/acceptance/dr-30-native-structure/*.properties
            skyforge-neoforge-1211/run-dr30-native-structure/logs/*.log
            skyforge-neoforge-1211/run-dr30-native-structure/crash-reports/*.txt
            skyforge-neoforge-1211/run-dr30-native-structure-stacked/logs/*.log
            skyforge-neoforge-1211/run-dr30-native-structure-stacked/crash-reports/*.txt