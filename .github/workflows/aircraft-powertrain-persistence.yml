name: Aircraft Powertrain Persistence

on:
  pull_request:
    paths:
      - ".github/workflows/aircraft-powertrain-persistence.yml"
      - "docs/agent-state/AIRCRAFT_COMPILER_STATE.md"
      - "docs/agent-state/COMPILER_INTEGRATION_CAPABILITIES.json"
      - "scripts/compiler-integration/run-exact-stack-fixture.sh"
      - "skyforge-model/src/main/java/io/github/nidaba/skyforge/model/aircraft/**"
      - "skyforge-neoforge-1211/build.gradle.kts"
      - "skyforge-neoforge-1211/wave-c1-mods.properties"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeAircraft*.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeCompilerIntegration*.java"
      - "skyforge-neoforge-1211/src/test/java/io/github/nidaba/skyforge/neoforge1211/AircraftPowertrainPersistenceResourceTest.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aircraft-powertrain-persistence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  l1-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Verify aircraft persistence consumer contracts
        run: >-
          ./gradlew :skyforge-neoforge-1211:test
          --tests '*AircraftPowertrainPersistenceResourceTest'
          --tests '*AircraftPowertrainRuntimeResourceTest'
          --no-configuration-cache

  l3-exact-stack:
    needs: l1-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Resolve exact accepted Create/Sable/Aeronautics stack
        run: ./gradlew :skyforge-neoforge-1211:waveC11ResolvePinnedMods --no-configuration-cache
      - name: Boot A — operate production aircraft, normalize child, and save
        run: >-
          scripts/compiler-integration/run-exact-stack-fixture.sh
          :skyforge-neoforge-1211:runAircraftPowertrainPersistencePrepareServer
          aircraft-powertrain-persistence-prepare.log
          'AIRCRAFT_V012_PERSISTENCE_RUNTIME START'
          'AIRCRAFT_V012_PERSISTENCE_RUNTIME PREPARE PASS'
          'AIRCRAFT_V012_PERSISTENCE_RUNTIME FAIL'
          150
          240
      - name: Boot B — reopen and recover production aircraft at 128 RPM
        run: >-
          scripts/compiler-integration/run-exact-stack-fixture.sh
          :skyforge-neoforge-1211:runAircraftPowertrainPersistenceVerifyServer
          aircraft-powertrain-persistence-verify.log
          'AIRCRAFT_V012_PERSISTENCE_RUNTIME START'
          'AIRCRAFT_V012_PERSISTENCE_RUNTIME VERIFY PASS'
          'AIRCRAFT_V012_PERSISTENCE_RUNTIME FAIL'
          150
          240
