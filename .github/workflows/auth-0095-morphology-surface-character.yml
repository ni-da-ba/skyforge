name: AUTH-0095 Morphology Surface Character

on:
  pull_request:
    paths:
      - ".github/workflows/auth-0095-morphology-surface-character.yml"
      - "docs/authorship/AUTH-0095-morphology-surface-character-diagnostics.md"
      - "skyforge-reference/src/main/java/io/github/nidaba/skyforge/reference/ProductionMorphologyVisualReviewCorpusCli.java"
      - "skyforge-reference/src/main/java/io/github/nidaba/skyforge/reference/evidence/ProductionMorphologySurfaceCharacterDiagnostics.java"
      - "skyforge-reference/src/test/java/io/github/nidaba/skyforge/reference/evidence/ProductionMorphologySurfaceCharacterDiagnosticsTest.java"
      - "skyforge-reference/src/main/java/io/github/nidaba/skyforge/reference/volume/ProductionMorphologyVisualReviewCorpus.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-0095-morphology-surface-character-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify AUTH-0095 diagnostics
        run: |
          ./gradlew :skyforge-reference:test \
            --tests '*ProductionMorphologySurfaceCharacterDiagnosticsTest' \
            --tests '*ProductionMorphologyVisualReviewCorpusTest' \
            :skyforge-reference:productionMorphologyVisualReviewCorpus \
            --no-configuration-cache

      - name: Verify exact AUTH-0083 built-in surface-character output
        run: |
          DIR=skyforge-reference/build/evidence/production-morphology-visual-review-v1
          FILE="$DIR/surface-character.csv"
          HANDOFF="$DIR/minecraft-handoff.csv"
          test -f "$FILE"
          test -f "$HANDOFF"
          awk -F, 'NR > 1 && $2 == "BUILT_IN" { print $1 }' "$HANDOFF" | sort > /tmp/auth95-expected.txt
          tail -n +2 "$FILE" | cut -d, -f1 | sort > /tmp/auth95-actual.txt
          echo "surface rows including header: $(wc -l < "$FILE")"
          echo "expected built-in ids: $(wc -l < /tmp/auth95-expected.txt)"
          echo "actual surface ids: $(wc -l < /tmp/auth95-actual.txt)"
          test "$(wc -l < "$FILE")" -eq 26
          test "$(wc -l < /tmp/auth95-expected.txt)" -eq 25
          test "$(wc -l < /tmp/auth95-actual.txt)" -eq 25
          diff -u /tmp/auth95-expected.txt /tmp/auth95-actual.txt

      - name: Publish AUTH-0095 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auth-0095-morphology-surface-character-${{ github.sha }}
          path: |
            skyforge-reference/build/evidence/production-morphology-visual-review-v1/surface-character.csv
            skyforge-reference/build/evidence/production-morphology-visual-review-v1/summary.csv
            skyforge-reference/build/evidence/production-morphology-visual-review-v1/minecraft-handoff.csv
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
