name: Low-End Hardware Scalability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/low-end-scalability.yml"
      - "skyforge-neoforge-1211/src/main/java/**"
      - "skyforge-neoforge-1211/src/test/java/**"

permissions:
  contents: read

concurrency:
  group: low-end-scalability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  headless-scaling:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'perf/')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Record runner identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/low-end-benchmark
          {
            echo "uname=$(uname -a)"
            echo "nproc=$(nproc)"
            echo "memory_kib=$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
            echo "java=$(java -version 2>&1 | head -n 1)"
            echo "--- lscpu ---"
            lscpu
            echo "--- free ---"
            free -h
          } | tee build/low-end-benchmark/runner.txt

      - name: Compile benchmark code outside timed region
        timeout-minutes: 10
        run: ./gradlew :skyforge-neoforge-1211:compileJava :skyforge-neoforge-1211:testClasses --stacktrace --no-daemon --no-configuration-cache

      - name: Run controlled CPU and heap scaling profiles
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail

          benchmark_root="$PWD/build/low-end-benchmark"
          result_dir="$PWD/skyforge-neoforge-1211/build/acceptance/sf-imp-0070"
          run_dir="$PWD/skyforge-neoforge-1211/run-sf-imp-0070-performance-stacked"

          run_profile() {
            local name="$1"
            local active_cpus="$2"
            local heap_gib="$3"
            local cpuset="$4"
            local out="$benchmark_root/$name"

            rm -rf "$result_dir" "$run_dir"
            mkdir -p "$out"

            {
              echo "profile=$name"
              echo "active_cpus=$active_cpus"
              echo "heap_gib=$heap_gib"
              echo "cpuset=$cpuset"
            } > "$out/profile.properties"

            echo "=== $name: ${active_cpus} CPU(s), ${heap_gib} GiB max heap, cpuset ${cpuset} ==="
            /usr/bin/time -v -o "$out/time.txt" \
              env JAVA_TOOL_OPTIONS="-XX:ActiveProcessorCount=${active_cpus} -Xmx${heap_gib}g" \
              taskset -c "$cpuset" \
              ./gradlew :skyforge-neoforge-1211:sfImp0070PerformanceVerify \
                --stacktrace --no-daemon --no-configuration-cache \
              2>&1 | tee "$out/gradle.log"

            cp "$result_dir/stacked.properties" "$out/stacked.properties"
            if [[ -f "$run_dir/logs/latest.log" ]]; then
              cp "$run_dir/logs/latest.log" "$out/latest.log"
            fi
          }

          run_profile reference-4cpu-8g 4 8 0-3
          run_profile constrained-2cpu-6g 2 6 0-1
          run_profile low-1cpu-4g 1 4 0

      - name: Build comparison summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("build/low-end-benchmark")
          profiles = [
              ("reference-4cpu-8g", 4, 8),
              ("constrained-2cpu-6g", 2, 6),
              ("low-1cpu-4g", 1, 4),
          ]

          keys = {
              "process_s": "perf.processElapsedNanos",
              "warmup_s": "perf.acceptance.warmOriginFootprint.totalNanos",
              "admission_s": "perf.admission.nativeOccupancySurvey.totalNanos",
              "deferred_s": "perf.terrain.realizeDeferred.totalNanos",
              "materialize_s": "perf.terrain.deferred.materialize.totalNanos",
              "write_s": "perf.terrain.deferred.write.totalNanos",
              "surface_s": "perf.surfacePopulation.coordinator.totalNanos",
              "vegetation_s": "perf.surfacePopulation.phase.VEGETAL_DECORATION.totalNanos",
              "underground_decoration_s": "perf.interior.UNDERGROUND_DECORATION.totalNanos",
              "ores_s": "perf.interior.UNDERGROUND_ORES.totalNanos",
              "cave_pump_s": "perf.catchup.composedCavePump.totalNanos",
          }

          def read_props(path):
              data = {}
              if not path.exists():
                  return data
              for raw in path.read_text(errors="replace").splitlines():
                  if not raw or raw.startswith("#") or "=" not in raw:
                      continue
                  k, v = raw.split("=", 1)
                  data[k] = v
              return data

          def seconds(props, key):
              value = props.get(key)
              return None if value is None else int(value) / 1_000_000_000

          def time_metrics(path):
              if not path.exists():
                  return (None, None)
              text = path.read_text(errors="replace")
              rss = re.search(r"Maximum resident set size \(kbytes\):\s*(\d+)", text)
              cpu = re.search(r"Percent of CPU this job got:\s*([^\n]+)", text)
              return (
                  None if rss is None else int(rss.group(1)) / 1024,
                  None if cpu is None else cpu.group(1).strip(),
              )

          rows = []
          for name, cpus, heap in profiles:
              props = read_props(root / name / "stacked.properties")
              rss_mib, cpu_pct = time_metrics(root / name / "time.txt")
              row = {
                  "profile": name,
                  "cpus": cpus,
                  "heap_gib": heap,
                  "status": props.get("status", "MISSING"),
                  "rss_mib": rss_mib,
                  "cpu_pct": cpu_pct,
              }
              for out_key, prop_key in keys.items():
                  row[out_key] = seconds(props, prop_key)
              rows.append(row)

          ref = rows[0].get("process_s")
          for row in rows:
              p = row.get("process_s")
              row["slowdown"] = None if not ref or not p else p / ref

          csv_columns = ["profile", "cpus", "heap_gib", "status", "process_s", "slowdown", "rss_mib", "cpu_pct"] + list(keys.keys())[1:]
          with (root / "summary.csv").open("w", newline="") as f:
              import csv
              w = csv.DictWriter(f, fieldnames=csv_columns)
              w.writeheader()
              for row in rows:
                  w.writerow({k: row.get(k) for k in csv_columns})

          def fmt(v, digits=2):
              if v is None:
                  return "n/a"
              if isinstance(v, float):
                  return f"{v:.{digits}f}"
              return str(v)

          lines = [
              "# Low-End Hardware Scalability Summary",
              "",
              "Same accepted SF-IMP-0070 stacked production workload; CPU affinity and JVM-reported CPU count are constrained per profile. Compilation/setup is outside the timed production fixture.",
              "",
              "| Profile | CPU | Heap cap | PASS | Production elapsed (s) | Slowdown | Max RSS (MiB) | Job CPU | Admission (s) | Deferred terrain (s) | Surface population (s) | Underground decoration (s) |",
              "| --- | ---: | ---: | :---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |",
          ]
          for r in rows:
              lines.append(
                  f"| {r['profile']} | {r['cpus']} | {r['heap_gib']} GiB | {r['status']} | "
                  f"{fmt(r.get('process_s'))} | {fmt(r.get('slowdown'))}x | {fmt(r.get('rss_mib'), 0)} | "
                  f"{fmt(r.get('cpu_pct'))} | {fmt(r.get('admission_s'))} | {fmt(r.get('deferred_s'))} | "
                  f"{fmt(r.get('surface_s'))} | {fmt(r.get('underground_decoration_s'))} |"
              )

          (root / "summary.md").write_text("\n".join(lines) + "\n")
          print((root / "summary.md").read_text())
          PY

      - name: Publish benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: low-end-hardware-scalability-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: build/low-end-benchmark/
