name: Wave C7 Glider Shared Lift

on:
  pull_request:
    paths:
      - ".github/workflows/wave-c7-glider-shared-lift.yml"
      - "skyforge-neoforge-1211/build.gradle.kts"
      - "skyforge-neoforge-1211/wave-c2-mods.properties"
      - "skyforge-neoforge-1211/wave-c3-mods.properties"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeA4mcLiftBridge.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeReliableGlidersBridge.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeGliderLiftCoupling.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeWaveC7GliderLiftDevRuntime.java"
      - "skyforge-neoforge-1211/src/test/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeGliderLiftCouplingTest.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave-c7-glider-lift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile-smoke-accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Compile and unit-test shared-lift coupling
        run: ./gradlew :skyforge-neoforge-1211:test --tests '*SkyforgeGliderLiftCouplingTest' --no-configuration-cache

      - name: Resolve exact C7 run classpath
        run: ./gradlew :skyforge-neoforge-1211:waveC7ResolvePinnedMods --no-configuration-cache

      - name: Headless optional-API smoke
        shell: bash
        run: |
          set -euo pipefail
          log="wave-c7-glider-lift.log"
          setsid ./gradlew :skyforge-neoforge-1211:runWaveC7GliderLiftServer --no-configuration-cache >"${log}" 2>&1 &
          pid=$!
          ready=0
          bridge=0

          for _ in $(seq 1 120); do
            grep -Fq "Done (" "${log}" 2>/dev/null && ready=1 || true
            grep -Fq "Wave C7 Reliable Gliders/A4MC shared-lift compatibility enabled" "${log}" 2>/dev/null && bridge=1 || true
            if [[ "${ready}" -eq 1 && "${bridge}" -eq 1 ]]; then
              break
            fi
            if ! kill -0 "${pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [[ "${ready}" -eq 1 && "${bridge}" -eq 1 ]]; then
            echo "PASS Wave C7: optional glider/A4MC bridge initialized and server reached ready state"
            kill -TERM -- "-${pid}" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-${pid}" 2>/dev/null || true
            wait "${pid}" 2>/dev/null || true
            exit 0
          fi

          echo "FAIL Wave C7 headless bridge smoke"
          cat "${log}"
          kill -TERM -- "-${pid}" 2>/dev/null || true
          sleep 1
          kill -KILL -- "-${pid}" 2>/dev/null || true
          wait "${pid}" 2>/dev/null || true
          exit 1

      - name: Deterministic real-glider-state acceptance
        shell: bash
        run: |
          set -euo pipefail
          log="wave-c7-glider-acceptance.log"
          setsid ./gradlew :skyforge-neoforge-1211:runWaveC7GliderLiftAcceptanceServer --no-configuration-cache >"${log}" 2>&1 &
          pid=$!
          outcome=""

          for _ in $(seq 1 120); do
            if grep -Fq "WAVE_C7_ACCEPTANCE PASS" "${log}" 2>/dev/null; then
              outcome="pass"
              break
            fi
            if grep -Fq "WAVE_C7_ACCEPTANCE FAIL" "${log}" 2>/dev/null; then
              outcome="fail"
              break
            fi
            if ! kill -0 "${pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [[ "${outcome}" == "pass" ]]; then
            grep -F "WAVE_C7_ACCEPTANCE PASS" "${log}"
            kill -TERM -- "-${pid}" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-${pid}" 2>/dev/null || true
            wait "${pid}" 2>/dev/null || true
            exit 0
          fi

          echo "FAIL Wave C7 deterministic glider acceptance"
          cat "${log}"
          kill -TERM -- "-${pid}" 2>/dev/null || true
          sleep 1
          kill -KILL -- "-${pid}" 2>/dev/null || true
          wait "${pid}" 2>/dev/null || true
          exit 1
