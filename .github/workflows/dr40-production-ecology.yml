name: DR-40 Production Ecology Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "skyforge-world/**"
      - "skyforge-neoforge-1211/**"
      - "docs/agent-state/DR40_ECOLOGY_*.json"

permissions:
  contents: read

concurrency:
  group: dr40-production-ecology-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Qualify canonical production ecology and reload
        timeout-minutes: 48
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a ./gradlew :skyforge-neoforge-1211:dr40ProductionEcologyAcceptance --stacktrace --no-configuration-cache
      - name: Publish DR-40 runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dr40-production-ecology-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            skyforge-neoforge-1211/build/acceptance/dr-40/*.properties
            skyforge-neoforge-1211/run-dr40-auto-*/logs/*.log
            skyforge-neoforge-1211/run-dr40-auto-*/crash-reports/*.txt
