name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate shared Java and Gradle setup policy
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'uses: gradle/actions/(wrapper-validation|setup-gradle)@' -- .github/workflows; then
            echo 'Direct Gradle setup actions must live in .github/actions/setup-java-gradle/action.yml.'
            exit 1
          fi

      - name: Classify validation impact
        id: impact
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "full=true" >> "${GITHUB_OUTPUT}"
            echo "ordinary=true" >> "${GITHUB_OUTPUT}"
            echo "reference=true" >> "${GITHUB_OUTPUT}"
            echo "neoforge=true" >> "${GITHUB_OUTPUT}"
            echo "music=true" >> "${GITHUB_OUTPUT}"
            echo "scopes=ordinary,reference,neoforge,music" >> "${GITHUB_OUTPUT}"
            echo "reason=manual dispatch requests broad validation" >> "${GITHUB_OUTPUT}"
            echo "Manual dispatch requests full CI and music-source verification."
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${GITHUB_SHA}"
          else
            echo "full=true" >> "${GITHUB_OUTPUT}"
            echo "ordinary=true" >> "${GITHUB_OUTPUT}"
            echo "reference=true" >> "${GITHUB_OUTPUT}"
            echo "neoforge=true" >> "${GITHUB_OUTPUT}"
            echo "music=true" >> "${GITHUB_OUTPUT}"
            echo "scopes=ordinary,reference,neoforge,music" >> "${GITHUB_OUTPUT}"
            echo "reason=unknown event type fails safe to broad validation" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ -z "${base}" || "${base}" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "full=true" >> "${GITHUB_OUTPUT}"
            echo "ordinary=true" >> "${GITHUB_OUTPUT}"
            echo "reference=true" >> "${GITHUB_OUTPUT}"
            echo "neoforge=true" >> "${GITHUB_OUTPUT}"
            echo "music=true" >> "${GITHUB_OUTPUT}"
            echo "scopes=ordinary,reference,neoforge,music" >> "${GITHUB_OUTPUT}"
            echo "reason=unable to establish safe comparison base" >> "${GITHUB_OUTPUT}"
            echo "Unable to establish a safe comparison base; running full CI and music-source verification."
            exit 0
          fi

          mapfile -t changed_paths < <(git diff --name-only "${base}" "${head}")
          printf '%s\n' "${changed_paths[@]}"
          python3 scripts/ci/classify_validation_impact.py \
            --github-output "${GITHUB_OUTPUT}" \
            "${changed_paths[@]}"

      - name: Verify exact-stack fixture runner semantics
        if: steps.impact.outputs.full == 'true'
        run: python3 scripts/compiler-integration/test_run_exact_stack_fixture.py

      - name: Verify music source integrity
        if: steps.impact.outputs.music == 'true'
        run: python3 scripts/music/verify_music_sources.py

      - name: Validate lightweight repository integrity
        if: steps.impact.outputs.full != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/agent-state/PROGRAM_CHARTER.md
          test -f docs/agent-state/CROSS_LANE_CONTRACTS.md
          test -f docs/agent-state/VALIDATION_POLICY.md
          test -f docs/agent-state/HUMAN_STRATEGY_ROADMAP.md
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- AGENTS.md README.md docs scripts/orchestrator deploy/orchestrator scripts/ci config/ci .github/workflows; then
            echo "Merge-conflict marker found in lightweight validation surface."
            exit 1
          fi
          echo "PASS lightweight repository integrity gate"

      - name: Validate CI helper and retained workflow contracts
        working-directory: scripts/ci
        run: python3 -m unittest -v

      - name: Validate canonical evidence manifest without product build
        if: steps.impact.outputs.full != 'true'
        run: python3 scripts/ci/verify_evidence_entry_points.py --validate-manifest

      - name: Verify retained DR workflow contracts
        run: python3 scripts/ci/verify_validation_workflows.py

      - name: Set up Java and Gradle
        if: steps.impact.outputs.full == 'true'
        uses: ./.github/actions/setup-java-gradle

      - name: Run ordinary Gradle check
        if: steps.impact.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci-timing
          start=$(date +%s)
          ./gradlew check --profile
          echo "$(( $(date +%s) - start ))" > build/ci-timing/ordinary-check.seconds

      - name: Run reference qualification corpora
        if: steps.impact.outputs.reference == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci-timing
          start=$(date +%s)
          ./gradlew :skyforge-reference:fixedSeedCorpus :skyforge-reference:suspendedVolumeEvidence --profile
          echo "$(( $(date +%s) - start ))" > build/ci-timing/reference-corpora.seconds

      - name: Verify evidence review entry points
        if: steps.impact.outputs.reference == 'true'
        run: python3 scripts/ci/verify_evidence_entry_points.py --verify-files

      - name: Stage compact evidence review bundle
        if: steps.impact.outputs.reference == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: python3 scripts/ci/stage_evidence_review_bundle.py --stage

      - name: Publish compact evidence review bundle
        if: steps.impact.outputs.reference == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skyforge-evidence-review-${{ github.sha }}
          path: build/ci-evidence-review/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Summarize CI timing
        if: always() && steps.impact.outputs.full == 'true'
        run: python3 scripts/ci/summarize_ci_timings.py --timing-dir build/ci-timing --summary "${GITHUB_STEP_SUMMARY}"

      - name: Publish Gradle timing profiles
        if: always() && steps.impact.outputs.full == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skyforge-ci-timing-${{ github.sha }}
          path: |
            build/ci-timing/
            build/reports/profile/
            **/build/test-results/test/TEST-*.xml
          if-no-files-found: warn
          retention-days: 7