name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify validation impact
        id: impact
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "full=true" >> "${GITHUB_OUTPUT}"
            echo "music=true" >> "${GITHUB_OUTPUT}"
            echo "Manual dispatch requests full CI and music-source verification."
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${GITHUB_SHA}"
          else
            echo "full=true" >> "${GITHUB_OUTPUT}"
            echo "music=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ -z "${base}" || "${base}" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "full=true" >> "${GITHUB_OUTPUT}"
            echo "music=true" >> "${GITHUB_OUTPUT}"
            echo "Unable to establish a safe comparison base; running full CI and music-source verification."
            exit 0
          fi

          changed="$(git diff --name-only "${base}" "${head}")"
          printf '%s\n' "${changed}"

          if printf '%s\n' "${changed}" | grep -Eq '^(assets/music/|scripts/music/verify_music_sources\.py$|\.github/workflows/ci\.yml$)'; then
            echo "music=true" >> "${GITHUB_OUTPUT}"
            echo "Music source/verifier impact detected: enabling music-source verification."
          else
            echo "music=false" >> "${GITHUB_OUTPUT}"
          fi

          if [[ -n "${changed}" ]] && ! printf '%s\n' "${changed}" | grep -Ev '^(docs/|AGENTS\.md$|README\.md$|CONTRIBUTING\.md$|SECURITY\.md$|CODE_OF_CONDUCT\.md$)' >/dev/null; then
            echo "full=false" >> "${GITHUB_OUTPUT}"
            echo "Lightweight docs/orchestration-only change: skipping Gradle/evidence generation."
          else
            echo "full=true" >> "${GITHUB_OUTPUT}"
            echo "Product code, asset, build, or general workflow impact detected: running full CI."
          fi

      - name: Verify music source integrity
        if: steps.impact.outputs.music == 'true'
        run: python3 scripts/music/verify_music_sources.py

      - name: Validate lightweight repository integrity
        if: steps.impact.outputs.full != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/agent-state/PROGRAM_CHARTER.md
          test -f docs/agent-state/CROSS_LANE_CONTRACTS.md
          test -f docs/agent-state/VALIDATION_POLICY.md
          test -f docs/agent-state/HUMAN_STRATEGY_ROADMAP.md
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- AGENTS.md README.md docs scripts/orchestrator; then
            echo "Merge-conflict marker found in documentation/state."
            exit 1
          fi
          echo "PASS lightweight repository integrity gate"

      - name: Set up Java 25
        if: steps.impact.outputs.full == 'true'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle wrapper
        if: steps.impact.outputs.full == 'true'
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        if: steps.impact.outputs.full == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build, test, and generate evidence
        if: steps.impact.outputs.full == 'true'
        run: ./gradlew check :skyforge-reference:fixedSeedCorpus :skyforge-reference:suspendedVolumeEvidence

      - name: Verify evidence review entry points
        if: steps.impact.outputs.full == 'true'
        run: python3 scripts/ci/verify_evidence_entry_points.py --verify-files

      - name: Stage compact evidence review bundle
        if: steps.impact.outputs.full == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: python3 scripts/ci/stage_evidence_review_bundle.py --stage

      - name: Publish compact evidence review bundle
        if: steps.impact.outputs.full == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skyforge-evidence-review-${{ github.sha }}
          path: build/ci-evidence-review/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
