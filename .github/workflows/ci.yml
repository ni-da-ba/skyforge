name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build, test, and generate evidence
        run: ./gradlew check :skyforge-reference:fixedSeedCorpus :skyforge-reference:suspendedVolumeEvidence

      - name: Verify evidence review entry points
        run: |
          test -f skyforge-reference/build/evidence/fixed-seed-island-v1/index.html
          test -f skyforge-reference/build/evidence/signal-free-suspended-volume-v1/index.html

      - name: Publish compact evidence review bundle
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: skyforge-evidence-review-${{ github.sha }}
          path: |
            skyforge-reference/build/evidence/fixed-seed-island-v1/**/*.png
            skyforge-reference/build/evidence/fixed-seed-island-v1/**/*.html
            skyforge-reference/build/evidence/fixed-seed-island-v1/**/*.json
            skyforge-reference/build/evidence/fixed-seed-island-v1/**/*.csv
            skyforge-reference/build/evidence/fixed-seed-island-v1/**/*.sha256
            skyforge-reference/build/evidence/signal-free-suspended-volume-v1/**/*.png
            skyforge-reference/build/evidence/signal-free-suspended-volume-v1/**/*.html
            skyforge-reference/build/evidence/signal-free-suspended-volume-v1/**/*.json
            skyforge-reference/build/evidence/signal-free-suspended-volume-v1/**/*.csv
            skyforge-reference/build/evidence/signal-free-suspended-volume-v1/**/*.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
