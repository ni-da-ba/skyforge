name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate shared Java and Gradle setup policy
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'uses: gradle/actions/(wrapper-validation|setup-gradle)@' -- .github/workflows; then
            echo 'Direct Gradle setup actions must live in .github/actions/setup-java-gradle/action.yml.'
            exit 1
          fi

      - name: Classify validation impact
        id: impact
        shell: bash
        run: |
          set -euo pipefail

          write_all_scopes() {
            local reason="$1"
            for output in full ordinary reference neoforge dr30 dr40 dr50 compiler aircraft music unknown; do
              echo "${output}=true" >> "${GITHUB_OUTPUT}"
            done
            echo "scopes=ordinary,reference,neoforge,dr30,dr40,dr50,compiler,aircraft,music,unknown" >> "${GITHUB_OUTPUT}"
            echo "reason=${reason}" >> "${GITHUB_OUTPUT}"
          }

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            write_all_scopes "manual dispatch requests all validation scopes"
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${GITHUB_SHA}"
          else
            write_all_scopes "unknown event type fails safe to all validation scopes"
            exit 0
          fi

          if [[ -z "${base}" || "${base}" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            write_all_scopes "unable to establish safe comparison base"
            exit 0
          fi

          mapfile -t changed_paths < <(git diff --name-only "${base}" "${head}")
          printf '%s\n' "${changed_paths[@]}"
          python3 scripts/ci/classify_validation_impact.py             --github-output "${GITHUB_OUTPUT}"             "${changed_paths[@]}"

      - name: Report validation routing
        shell: bash
        run: |
          {
            echo "### Validation routing"
            echo
            echo "- Scopes: `${{ steps.impact.outputs.scopes }}`"
            echo "- Reason: ${{ steps.impact.outputs.reason }}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify exact-stack fixture runner semantics
        if: steps.impact.outputs.compiler == 'true'
        run: python3 scripts/compiler-integration/test_run_exact_stack_fixture.py

      - name: Verify music source integrity
        if: steps.impact.outputs.music == 'true'
        run: python3 scripts/music/verify_music_sources.py

      - name: Validate lightweight repository integrity
        if: steps.impact.outputs.ordinary != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/agent-state/PROGRAM_CHARTER.md
          test -f docs/agent-state/CROSS_LANE_CONTRACTS.md
          test -f docs/agent-state/VALIDATION_POLICY.md
          test -f docs/agent-state/HUMAN_STRATEGY_ROADMAP.md
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- AGENTS.md README.md docs scripts/orchestrator deploy/orchestrator scripts/ci config/ci .github/workflows; then
            echo "Merge-conflict marker found in lightweight validation surface."
            exit 1
          fi
          echo "PASS lightweight repository integrity gate"

      - name: Validate CI helper and retained workflow contracts
        if: steps.impact.outputs.ordinary != 'true'
        working-directory: scripts/ci
        run: python3 -m unittest -v

      - name: Validate canonical evidence manifest
        run: python3 scripts/ci/verify_evidence_entry_points.py --validate-manifest

      - name: Verify retained DR workflow contracts
        if: steps.impact.outputs.ordinary != 'true'
        run: python3 scripts/ci/verify_validation_workflows.py

      - name: Set up Java and Gradle
        if: steps.impact.outputs.ordinary == 'true'
        uses: ./.github/actions/setup-java-gradle

      - name: Ordinary check
        if: steps.impact.outputs.ordinary == 'true'
        id: ordinary
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s)
          ./gradlew check --profile
          elapsed=$(( $(date +%s) - started ))
          echo "wall_seconds=${elapsed}" >> "${GITHUB_OUTPUT}"

      - name: Summarize ordinary-check timing
        if: always() && steps.impact.outputs.ordinary == 'true' && steps.ordinary.outputs.wall_seconds != ''
        run: |
          python3 scripts/ci/summarize_validation_timings.py             --label "ordinary check"             --wall-seconds "${{ steps.ordinary.outputs.wall_seconds }}"             --warn-over-seconds 600

      - name: Publish Gradle timing profile
        if: always() && steps.impact.outputs.ordinary == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skyforge-gradle-profile-${{ github.sha }}
          path: build/reports/profile/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
