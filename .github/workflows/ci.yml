name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build, test, and generate evidence
        run: ./gradlew check :skyforge-reference:fixedSeedCorpus :skyforge-reference:suspendedVolumeEvidence

      - name: Publish fixed-seed evidence and visual atlas
        uses: actions/upload-artifact@v4
        with:
          name: skyforge-fixed-seed-v0.1-${{ github.sha }}
          path: skyforge-reference/build/evidence/fixed-seed-island-v1
          if-no-files-found: error

      - name: Publish suspended-volume evidence and visual atlas
        uses: actions/upload-artifact@v4
        with:
          name: skyforge-suspended-volume-v0.2-${{ github.sha }}
          path: skyforge-reference/build/evidence/signal-free-suspended-volume-v1
          if-no-files-found: error
