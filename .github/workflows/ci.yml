name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build, test, and generate evidence
        run: ./gradlew check :skyforge-reference:fixedSeedCorpus :skyforge-reference:suspendedVolumeEvidence

      - name: Verify evidence review entry points
        run: |
          test -f skyforge-reference/build/evidence/fixed-seed-island-v1/index.html
          test -f skyforge-reference/build/evidence/signal-free-suspended-volume-v1/index.html
          test -f skyforge-reference/build/evidence/authorship-semantic-fields-v1/index.html
          test -f skyforge-reference/build/evidence/authorship-semantic-fields-v1/overview.png
          test -f skyforge-reference/build/evidence/authorship-ecology-v1/index.html
          test -f skyforge-reference/build/evidence/authorship-ecology-v1/atlas.png
          test -f skyforge-reference/build/evidence/authorship-ecology-v1/manifest.csv
          test -f skyforge-reference/build/evidence/authorship-hydrology-v1/index.html
          test -f skyforge-reference/build/evidence/authorship-hydrology-v1/atlas.png
          test -f skyforge-reference/build/evidence/authorship-hydrology-v1/manifest.csv
          test -f skyforge-reference/build/evidence/authorship-watersheds-v1/index.html
          test -f skyforge-reference/build/evidence/authorship-watersheds-v1/atlas.png
          test -f skyforge-reference/build/evidence/authorship-watersheds-v1/manifest.csv
          test -f skyforge-reference/build/evidence/authorship-hydrologic-features-v1/index.html
          test -f skyforge-reference/build/evidence/authorship-hydrologic-features-v1/atlas.png
