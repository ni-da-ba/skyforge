name: SF-IMP 1180 Consumer Behavior A-B

on:
  pull_request:
    paths:
      - ".github/workflows/sf-imp-1180-consumer-behavior-ab.yml"
      - "skyforge-neoforge-1211/build.gradle.kts"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeConsumerBehaviorDiagnostic.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeWaveC6SoaringFaunaDevRuntime.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeGliderLiftCoupling.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeNeoForge1211Mod.java"
      - "third_party/patches/aerodynamics4mc/0001-public-terrain-provider-api.patch"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sf-imp-1180-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  consumer-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out Skyforge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Build exact patched A4MC core
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/sf-imp-1180-a4mc
          git clone -q https://github.com/MozillaFiredoge/Aerodynamics4MC-Core.git build/sf-imp-1180-a4mc
          git -C build/sf-imp-1180-a4mc checkout -q 62a52a584e9c65246e50226b29a1f0449e43995e
          git -C build/sf-imp-1180-a4mc apply "$GITHUB_WORKSPACE/third_party/patches/aerodynamics4mc/0001-public-terrain-provider-api.patch"
          (cd build/sf-imp-1180-a4mc && ./gradlew buildAndCollect --no-daemon)
          core="$(find build/sf-imp-1180-a4mc/build/libs/0.2.1-SNAPSHOT -maxdepth 1 -type f -name 'aerodynamics4mc-0.2.1-neoforge+1.21.1-SNAPSHOT.jar' -print -quit)"
          test -n "$core"
          echo "A4MC_CORE=$GITHUB_WORKSPACE/$core" >> "$GITHUB_ENV"

      - name: Resolve diagnostic classpath
        run: ./gradlew :skyforge-neoforge-1211:waveC3ResolvePinnedMods -PskyforgeA4mcProbeCoreOverrideJar="$A4MC_CORE" --no-configuration-cache

      - name: Prepare accepted DR-50 A
        run: ./gradlew :skyforge-neoforge-1211:runDr50IntegratedRegionAcceptanceA --no-configuration-cache

      - name: Clone identical control and treatment worlds
        shell: bash
        run: |
          set -euo pipefail
          rm -rf skyforge-neoforge-1211/run-sf-imp-1180-control skyforge-neoforge-1211/run-sf-imp-1180-treatment
          cp -a skyforge-neoforge-1211/run-dr50-auto-a skyforge-neoforge-1211/run-sf-imp-1180-control
          cp -a skyforge-neoforge-1211/run-dr50-auto-a skyforge-neoforge-1211/run-sf-imp-1180-treatment

      - name: Run control and treatment
        shell: bash
        run: |
          set -euo pipefail
          run_arm() {
            arm="$1"
            task="$2"
            log="sf-imp-1180-${arm}.log"
            client_log="sf-imp-1180-${arm}-client.log"
            setsid ./gradlew ":skyforge-neoforge-1211:${task}"               -PskyforgeA4mcProbeCoreOverrideJar="$A4MC_CORE"               --no-configuration-cache >"$log" 2>&1 &
            server_pid=$!

            ready=0
            for _ in $(seq 1 120); do
              grep -Fq "Done (" "$log" 2>/dev/null && ready=1 && break || true
              ! kill -0 "$server_pid" 2>/dev/null && break
              sleep 1
            done
            if [[ "$ready" -ne 1 ]]; then
              cat "$log"
              exit 1
            fi

            setsid ./gradlew :skyforge-neoforge-1211:runWaveC3AtmosphereEvidenceClient               -PskyforgeA4mcProbeCoreOverrideJar="$A4MC_CORE"               --no-configuration-cache >"$client_log" 2>&1 &
            client_pid=$!

            outcome=""
            for _ in $(seq 1 360); do
              if grep -Fq "SF_IMP_1180_DIAGNOSTIC PASS arm=${arm}" "$log" 2>/dev/null; then
                outcome=pass
                break
              fi
              if grep -Fq "SF_IMP_1180_DIAGNOSTIC FAIL arm=${arm}" "$log" 2>/dev/null; then
                outcome=fail
                break
              fi
              ! kill -0 "$server_pid" 2>/dev/null && break
              sleep 1
            done

            grep -F "SF_IMP_1180_DIAGNOSTIC" "$log" || true
            kill -TERM -- "-$client_pid" 2>/dev/null || true
            kill -TERM -- "-$server_pid" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-$client_pid" 2>/dev/null || true
            kill -KILL -- "-$server_pid" 2>/dev/null || true
            wait "$client_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true

            if [[ "$outcome" != pass ]]; then
              cat "$log"
              cat "$client_log"
              exit 1
            fi
          }

          run_arm control runSfImp1180ConsumerControlServer
          run_arm treatment runSfImp1180ConsumerTreatmentServer

      - name: Verify A-B evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("skyforge-neoforge-1211/build/acceptance/sf-imp-1180")
          control = json.loads((root / "control.json").read_text())
          treatment = json.loads((root / "treatment.json").read_text())

          assert control["hawk_count"] == 8, control
          assert treatment["hawk_count"] == 8, treatment
          assert control["glider_trusted_samples"] >= 500, control
          assert treatment["glider_trusted_samples"] >= 500, treatment
          assert treatment["c6_adapted"] == 8, treatment

          # If the real sampled field never reaches C6 admission, treatment must not steer.
          if treatment["glider_max_updraft_mps"] < 1.5:
              assert treatment["c6_transitions"] == 0, treatment
              assert treatment["c6_steering_commands"] == 0, treatment

          # The C7 projection must be internally causal: no positive air means no positive delta.
          for arm in (control, treatment):
              if arm["glider_mean_updraft_center_mps"] <= 0:
                  assert arm["glider_cumulative_vertical_delta_center_blocks"] == 0, arm

          summary = {
              "control": control,
              "treatment": treatment,
              "classification": {
                  "c6_inert_below_threshold": (
                      treatment["glider_max_updraft_mps"] < 1.5
                      and treatment["c6_transitions"] == 0
                      and treatment["c6_steering_commands"] == 0
                  ),
                  "control_edge_departures": control["hawk_edge_departures"],
                  "treatment_edge_departures": treatment["hawk_edge_departures"],
                  "control_below_island": control["hawk_below_island"],
                  "treatment_below_island": treatment["hawk_below_island"],
              },
          }
          (root / "comparison.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary["classification"], indent=2))
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: sf-imp-1180-consumer-ab-${{ github.sha }}
          path: |
            skyforge-neoforge-1211/build/acceptance/sf-imp-1180/*.json
            sf-imp-1180-*.log
          if-no-files-found: error
