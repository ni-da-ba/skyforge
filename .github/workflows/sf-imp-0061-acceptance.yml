name: SF-IMP-0061 Automated Acceptance

on:
  pull_request:
    paths:
      - "skyforge-neoforge-1211/**"
      - ".github/workflows/sf-imp-0061-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sf-imp-0061-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 106
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Carver run A
        timeout-minutes: 7
        run: ./gradlew :skyforge-neoforge-1211:runNativeCarverAcceptanceA --stacktrace

      - name: Carver run B deterministic repeat
        timeout-minutes: 7
        run: ./gradlew :skyforge-neoforge-1211:runNativeCarverAcceptanceB --stacktrace

      - name: Save-reload logical client verification
        timeout-minutes: 8
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a ./gradlew :skyforge-neoforge-1211:runNativeCarverAcceptanceReloadClient --stacktrace

      - name: Stacked-volume carver isolation
        timeout-minutes: 5
        run: ./gradlew :skyforge-neoforge-1211:runNativeCarverAcceptanceStacked --stacktrace

      - name: SF-IMP-0059 ore regression
        timeout-minutes: 7
        run: ./gradlew :skyforge-neoforge-1211:runNativeCarverAcceptanceOreRegression --stacktrace

      - name: SF-IMP-0060 local-modification regression
        timeout-minutes: 7
        run: ./gradlew :skyforge-neoforge-1211:runNativeCarverAcceptanceLocalModificationRegression --stacktrace

      - name: Verify aggregate acceptance evidence
        run: ./gradlew :skyforge-neoforge-1211:sfImp0061AcceptanceVerify --stacktrace

      - name: Publish acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sf-imp-0061-acceptance-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            skyforge-neoforge-1211/build/acceptance/sf-imp-0061/*.properties
            skyforge-neoforge-1211/run-sf-imp-0061-auto-*/logs/*.log
