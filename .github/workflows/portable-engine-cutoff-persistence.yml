name: Portable Engine Cutoff Persistence

on:
  pull_request:
    paths:
      - ".github/workflows/portable-engine-cutoff-persistence.yml"
      - "skyforge-neoforge-1211/build.gradle.kts"
      - "skyforge-neoforge-1211/wave-c1-mods.properties"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgePortableEngineCutoffPersistenceAcceptance.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgePortableEngineCutoffAccess.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeNeoForge1211Mod.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/mixin/SkyforgePortableEngineBlockEntityMixin.java"
      - "skyforge-neoforge-1211/src/test/java/io/github/nidaba/skyforge/neoforge1211/PortableEngineCutoffPersistenceResourceTest.java"
      - "docs/design-audit/portable-engine-cutoff-runtime.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-engine-cutoff-persistence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Verify persistence scope and wiring
        run: ./gradlew :skyforge-neoforge-1211:test --tests '*PortableEngineCutoffPersistenceResourceTest' --no-configuration-cache

      - name: Resolve accepted C11 flight-only runtime
        run: ./gradlew :skyforge-neoforge-1211:waveC11ResolvePinnedMods --no-configuration-cache

      - name: Prepare persisted CUT engine
        shell: bash
        run: |
          set -euo pipefail
          log="portable-engine-cutoff-persistence-prepare.log"
          setsid ./gradlew :skyforge-neoforge-1211:runPortableEngineCutoffPersistencePrepareServer             --no-configuration-cache >"${log}" 2>&1 &
          pid=$!
          outcome=""
          for _ in $(seq 1 180); do
            if grep -Fq "PORTABLE_ENGINE_CUTOFF_PERSISTENCE PREPARE PASS" "${log}" 2>/dev/null; then outcome="pass"; break; fi
            if grep -Fq "PORTABLE_ENGINE_CUTOFF_PERSISTENCE FAIL" "${log}" 2>/dev/null; then outcome="fail"; break; fi
            if ! kill -0 "${pid}" 2>/dev/null; then break; fi
            sleep 1
          done
          if [[ "${outcome}" != "pass" ]]; then
            echo "FAIL Portable Engine cutoff CUT prepare"; cat "${log}"
            kill -TERM -- "-${pid}" 2>/dev/null || true; sleep 1
            kill -KILL -- "-${pid}" 2>/dev/null || true; wait "${pid}" 2>/dev/null || true
            exit 1
          fi
          grep -F "PORTABLE_ENGINE_CUTOFF_PERSISTENCE PREPARE PASS" "${log}"
          kill -TERM -- "-${pid}" 2>/dev/null || true
          sleep 2
          kill -KILL -- "-${pid}" 2>/dev/null || true
          wait "${pid}" 2>/dev/null || true

      - name: Reopen CUT state and save configured RUN state
        shell: bash
        run: |
          set -euo pipefail
          log="portable-engine-cutoff-persistence-verify-cut.log"
          setsid ./gradlew :skyforge-neoforge-1211:runPortableEngineCutoffPersistenceVerifyCutServer             --no-configuration-cache >"${log}" 2>&1 &
          pid=$!
          outcome=""
          for _ in $(seq 1 180); do
            if grep -Fq "PORTABLE_ENGINE_CUTOFF_PERSISTENCE CUT VERIFY PASS" "${log}" 2>/dev/null; then outcome="pass"; break; fi
            if grep -Fq "PORTABLE_ENGINE_CUTOFF_PERSISTENCE FAIL" "${log}" 2>/dev/null; then outcome="fail"; break; fi
            if ! kill -0 "${pid}" 2>/dev/null; then break; fi
            sleep 1
          done
          if [[ "${outcome}" != "pass" ]]; then
            echo "FAIL Portable Engine cutoff CUT reopen/RUN save"; cat "${log}"
            kill -TERM -- "-${pid}" 2>/dev/null || true; sleep 1
            kill -KILL -- "-${pid}" 2>/dev/null || true; wait "${pid}" 2>/dev/null || true
            exit 1
          fi
          grep -F "PORTABLE_ENGINE_CUTOFF_PERSISTENCE CUT VERIFY PASS" "${log}"
          kill -TERM -- "-${pid}" 2>/dev/null || true
          sleep 2
          kill -KILL -- "-${pid}" 2>/dev/null || true
          wait "${pid}" 2>/dev/null || true

      - name: Reopen and verify configured RUN state
        shell: bash
        run: |
          set -euo pipefail
          log="portable-engine-cutoff-persistence-verify-run.log"
          setsid ./gradlew :skyforge-neoforge-1211:runPortableEngineCutoffPersistenceVerifyRunServer             --no-configuration-cache >"${log}" 2>&1 &
          pid=$!
          outcome=""
          for _ in $(seq 1 180); do
            if grep -Fq "PORTABLE_ENGINE_CUTOFF_PERSISTENCE RUN VERIFY PASS" "${log}" 2>/dev/null; then outcome="pass"; break; fi
            if grep -Fq "PORTABLE_ENGINE_CUTOFF_PERSISTENCE FAIL" "${log}" 2>/dev/null; then outcome="fail"; break; fi
            if ! kill -0 "${pid}" 2>/dev/null; then break; fi
            sleep 1
          done
          if [[ "${outcome}" == "pass" ]]; then
            grep -F "PORTABLE_ENGINE_CUTOFF_PERSISTENCE RUN VERIFY PASS" "${log}"
            kill -TERM -- "-${pid}" 2>/dev/null || true; sleep 2
            kill -KILL -- "-${pid}" 2>/dev/null || true; wait "${pid}" 2>/dev/null || true
            exit 0
          fi
          echo "FAIL Portable Engine cutoff RUN reopen"; cat "${log}"
          kill -TERM -- "-${pid}" 2>/dev/null || true; sleep 1
          kill -KILL -- "-${pid}" 2>/dev/null || true; wait "${pid}" 2>/dev/null || true
          exit 1
