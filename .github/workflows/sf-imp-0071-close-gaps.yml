name: SF-IMP-0071 Close Evidence Gaps

on:
  push:
    branches:
      - perf/524-packetize-catchup
    paths:
      - .github/workflows/sf-imp-0071-close-gaps.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/524-packetize-catchup
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Add packet percentile instrumentation and save-load-resume proof
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          surface = Path('skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeNeoForge1211SurfaceStage.java')
          text = surface.read_text()
          old = '''        SkyforgeRuntimePerformanceMetrics.recordSince("terrain.deferred.writePacket", writeStart);'''
          new = '''        long writeElapsedNanos = SkyforgeRuntimePerformanceMetrics.elapsedSince(writeStart);
          SkyforgeRuntimePerformanceMetrics.recordElapsed("terrain.deferred.writePacket", writeElapsedNanos);
          SkyforgeRuntimePerformanceMetrics.recordDistributionSample(
                  "terrain.deferred.packetWallNanos", writeElapsedNanos);
          SkyforgeRuntimePerformanceMetrics.recordDistributionSample(
                  "terrain.deferred.packetAssignedSolidWrites", advance.assignedSolidWrites());'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one packet timing seam, found {text.count(old)}')
          surface.write_text(text.replace(old, new, 1))
          PY

          cat > skyforge-neoforge-1211/src/test/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeRuntimePerformanceMetricsTest.java <<'JAVA'
          package io.github.nidaba.skyforge.neoforge1211;

          import static org.junit.jupiter.api.Assertions.assertEquals;
          import static org.junit.jupiter.api.Assertions.assertThrows;

          import java.util.List;
          import org.junit.jupiter.api.Test;

          final class SkyforgeRuntimePerformanceMetricsTest {
              @Test
              void nearestRankPercentilesAreDeterministicAtAcceptanceBoundaries() {
                  List<Long> ordered = List.of(1L, 2L, 3L, 4L, 5L, 6L, 7L, 8L, 9L, 10L,
                          11L, 12L, 13L, 14L, 15L, 16L, 17L, 18L, 19L, 20L);

                  assertEquals(10L, SkyforgeRuntimePerformanceMetrics.nearestRankPercentile(ordered, 50));
                  assertEquals(19L, SkyforgeRuntimePerformanceMetrics.nearestRankPercentile(ordered, 95));
                  assertEquals(20L, SkyforgeRuntimePerformanceMetrics.nearestRankPercentile(ordered, 99));
                  assertEquals(0L, SkyforgeRuntimePerformanceMetrics.nearestRankPercentile(List.of(), 50));
                  assertThrows(
                          IllegalArgumentException.class,
                          () -> SkyforgeRuntimePerformanceMetrics.nearestRankPercentile(ordered, 0));
              }
          }
          JAVA

          cat > skyforge-neoforge-1211/src/test/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeDeferredTerrainWriteResumeTest.java <<'JAVA'
          package io.github.nidaba.skyforge.neoforge1211;

          import static org.junit.jupiter.api.Assertions.assertEquals;
          import static org.junit.jupiter.api.Assertions.assertFalse;
          import static org.junit.jupiter.api.Assertions.assertTrue;

          import io.github.nidaba.skyforge.world.SkyIslandWorldVolumeId;
          import java.util.Arrays;
          import net.minecraft.core.BlockPos;
          import net.minecraft.nbt.CompoundTag;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.world.level.ChunkPos;
          import net.minecraft.world.level.chunk.ProtoChunk;
          import org.junit.jupiter.api.Test;

          final class SkyforgeDeferredTerrainWriteResumeTest {
              @Test
              void saveLoadMidObligationResumesWithoutSkipsDuplicatesOrPrematureTerminalState() {
                  ChunkPos chunkPos = new ChunkPos(0, 0);
                  ResourceLocation[] keys = new ResourceLocation[16 * 16 * 2];
                  Arrays.fill(keys, SkyforgeMinecraftBlockPalette.AIR);
                  int[] solidLinearIndices = {1, 5, 260, 300, 500};
                  for (int index : solidLinearIndices) {
                      keys[index] = SkyforgeMinecraftBlockPalette.STONE;
                  }
                  MinecraftChunkMaterialization materialization =
                          new MinecraftChunkMaterialization(chunkPos, 0, 2, keys, 1);
                  ProtoChunk packetized = MinecraftTestChunkFactory.protoChunk(chunkPos);
                  ProtoChunk monolithic = MinecraftTestChunkFactory.protoChunk(chunkPos);
                  SkyforgeNeoForge1211ChunkWriter writer =
                          new SkyforgeNeoForge1211ChunkWriter(new MinecraftBlockStateResolver());
                  SkyIslandWorldVolumeId volumeId = new SkyIslandWorldVolumeId(17L, "resume", 0, 0, 23L);

                  var data = new SkyforgeDeferredTerrainWriteProgressData();
                  var progress = data.getOrCreate(volumeId, chunkPos.toLong(), 5);
                  var first = writer.writeDeferredSolidOverlayPacket(
                          packetized, materialization, progress.cursor(), 2, false);
                  assertEquals(2, first.assignedSolidWrites());
                  assertFalse(first.complete());
                  data.store(progress.advance(first, false));

                  CompoundTag saved = data.save(new CompoundTag(), null);
                  var reloaded = SkyforgeDeferredTerrainWriteProgressData.load(saved, null);
                  var resumed = reloaded.find(volumeId, chunkPos.toLong()).orElseThrow();
                  assertEquals(first.cursor(), resumed.cursor());
                  assertFalse(resumed.terminal());

                  var second = writer.writeDeferredSolidOverlayPacket(
                          packetized, materialization, resumed.cursor(), 2, false);
                  assertEquals(2, second.assignedSolidWrites());
                  assertFalse(second.complete());
                  reloaded.store(resumed.advance(second, false));

                  var afterSecond = reloaded.find(volumeId, chunkPos.toLong()).orElseThrow();
                  var third = writer.writeDeferredSolidOverlayPacket(
                          packetized, materialization, afterSecond.cursor(), 2, false);
                  assertEquals(1, third.assignedSolidWrites());
                  assertTrue(third.complete());
                  var terminal = afterSecond.advance(third, true);
                  reloaded.store(terminal);
                  assertTrue(terminal.terminal());
                  assertEquals(5, terminal.cumulativeAssignedSolidWrites());
                  assertEquals(5, terminal.expectedSolidBlocks());

                  writer.writeSolidOverlay(monolithic, materialization);
                  for (int worldY = 0; worldY < 2; worldY++) {
                      for (int localZ = 0; localZ < 16; localZ++) {
                          for (int localX = 0; localX < 16; localX++) {
                              BlockPos pos = new BlockPos(localX, worldY, localZ);
                              assertEquals(
                                      monolithic.getBlockState(pos),
                                      packetized.getBlockState(pos),
                                      "save/load resumed packet stream diverged at " + pos);
                          }
                      }
                  }
              }
          }
          JAVA

      - name: Run focused NeoForge tests
        run: ./gradlew :skyforge-neoforge-1211:test --stacktrace --no-configuration-cache

      - name: Commit evidence-gap closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeNeoForge1211SurfaceStage.java \
                  skyforge-neoforge-1211/src/test/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeRuntimePerformanceMetricsTest.java \
                  skyforge-neoforge-1211/src/test/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeDeferredTerrainWriteResumeTest.java
          git diff --cached --check
          git commit -m "SF-IMP-0071: prove resume and packet percentiles"
          git push origin HEAD:perf/524-packetize-catchup
