name: Music Source Integrity

on:
  push:
    branches: [main]
    paths:
      - "assets/music/source/**"
      - "tools/verify_music_sources.py"
      - ".github/workflows/music-source-integrity.yml"
  pull_request:
    paths:
      - "assets/music/source/**"
      - "tools/verify_music_sources.py"
      - ".github/workflows/music-source-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: music-source-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify canonical music sources
        run: python3 tools/verify_music_sources.py
