name: DR-70 Exact-Head Merge Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "skyforge-neoforge-1211/**"
      - ".github/workflows/dr70-exact-head-merge-gate.yml"
      - ".github/workflows/dr70-hydrology-review.yml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: dr70-exact-head-merge-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Compile affected NeoForge source and tests
        run: |
          ./gradlew \
            :skyforge-neoforge-1211:compileJava \
            :skyforge-neoforge-1211:compileTestJava \
            --stacktrace --no-configuration-cache

  contract:
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        test_class:
          - io.github.nidaba.skyforge.neoforge1211.SkyforgeAuthoredVisibleHydrologyAdapterTest
          - io.github.nidaba.skyforge.neoforge1211.SkyforgeCarverReadVirtualizationSourceTest
          - io.github.nidaba.skyforge.neoforge1211.SkyforgeCarverVerticalFrameTest
          - io.github.nidaba.skyforge.neoforge1211.SkyforgeComposedCaveStageTest
          - io.github.nidaba.skyforge.neoforge1211.SkyforgeDr50IntegratedRegionEvidenceTest
          - io.github.nidaba.skyforge.neoforge1211.SkyforgeDr70ReviewRepairTest
          - io.github.nidaba.skyforge.neoforge1211.SkyforgeGeneratedFluidPropagationSourceTest
          - io.github.nidaba.skyforge.neoforge1211.SkyforgeLevelChunkPopulationReadMixinSourceTest
          - io.github.nidaba.skyforge.neoforge1211.SkyforgeNativeCarverCursorSourceTest
          - io.github.nidaba.skyforge.neoforge1211.SkyforgeProductionComposedCaveIntegratedTopologySourceTest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      # VALIDATION_POLICY: cheap exact-head Tier-0 coverage for one DR-70 dependency-surface
      # contract per job. Expensive runtime characterization remains DR-30/40/50/70 authority.
      - name: Run contract regression
        run: |
          ./gradlew \
            :skyforge-neoforge-1211:test \
            --tests '${{ matrix.test_class }}' \
            --stacktrace --no-configuration-cache
