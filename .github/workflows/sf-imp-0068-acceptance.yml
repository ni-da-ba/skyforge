name: SF-IMP-0068 Automated Acceptance

on:
  pull_request:
    paths:
      - "skyforge-neoforge-1211/**"
      - ".github/workflows/sf-imp-0068-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sf-imp-0068-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 137
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Compile and unit-test production composed cave slice
        timeout-minutes: 8
        run: ./gradlew :skyforge-neoforge-1211:compileJava :skyforge-neoforge-1211:test --stacktrace --no-configuration-cache

      - name: Production composed cave run A
        timeout-minutes: 30
        run: ./gradlew :skyforge-neoforge-1211:runProductionComposedCaveAcceptanceA --stacktrace --no-configuration-cache

      - name: Production composed cave run B deterministic repeat
        timeout-minutes: 30
        run: ./gradlew :skyforge-neoforge-1211:runProductionComposedCaveAcceptanceB --stacktrace --no-configuration-cache

      - name: Full-stop reload and actual ClientLevel verification
        timeout-minutes: 10
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          result="skyforge-neoforge-1211/build/acceptance/sf-imp-0068/reload.properties"
          rm -f "$result"

          setsid xvfb-run -a ./gradlew :skyforge-neoforge-1211:runProductionComposedCaveAcceptanceReloadClient --stacktrace --no-configuration-cache &
          client_pid=$!

          cleanup() {
            if kill -0 "$client_pid" 2>/dev/null; then
              kill -TERM -- "-$client_pid" 2>/dev/null || true
              sleep 2
              kill -KILL -- "-$client_pid" 2>/dev/null || true
            fi
            wait "$client_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 180); do
            if [[ -f "$result" ]] \
                && grep -q '^status=PASS
      - name: Stacked-volume production lifecycle isolation
        timeout-minutes: 30
        run: ./gradlew :skyforge-neoforge-1211:runProductionComposedCaveAcceptanceStacked --stacktrace --no-configuration-cache

      - name: SF-IMP-0067 standalone composed-cave regression
        timeout-minutes: 14
        run: ./gradlew :skyforge-neoforge-1211:runComposedCaveAcceptanceA --stacktrace --no-configuration-cache

      - name: Verify aggregate production lifecycle evidence
        run: ./gradlew :skyforge-neoforge-1211:sfImp0068AcceptanceVerify --stacktrace --no-configuration-cache

      - name: Publish acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sf-imp-0068-acceptance-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            skyforge-neoforge-1211/build/acceptance/sf-imp-0068/*.properties
            skyforge-neoforge-1211/build/acceptance/sf-imp-0067/*.properties
            skyforge-neoforge-1211/run-sf-imp-0068-auto-*/logs/*.log
            skyforge-neoforge-1211/run-sf-imp-0067-auto-a/logs/*.log
 "$result" \
                && grep -q '^reloadClientPass=true
      - name: Stacked-volume production lifecycle isolation
        timeout-minutes: 30
        run: ./gradlew :skyforge-neoforge-1211:runProductionComposedCaveAcceptanceStacked --stacktrace --no-configuration-cache

      - name: SF-IMP-0067 standalone composed-cave regression
        timeout-minutes: 14
        run: ./gradlew :skyforge-neoforge-1211:runComposedCaveAcceptanceA --stacktrace --no-configuration-cache

      - name: Verify aggregate production lifecycle evidence
        run: ./gradlew :skyforge-neoforge-1211:sfImp0068AcceptanceVerify --stacktrace --no-configuration-cache

      - name: Publish acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sf-imp-0068-acceptance-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            skyforge-neoforge-1211/build/acceptance/sf-imp-0068/*.properties
            skyforge-neoforge-1211/build/acceptance/sf-imp-0067/*.properties
            skyforge-neoforge-1211/run-sf-imp-0068-auto-*/logs/*.log
            skyforge-neoforge-1211/run-sf-imp-0067-auto-a/logs/*.log
 "$result"; then
              echo "SF-IMP-0068 durable reload/ClientLevel PASS observed."
              for _ in $(seq 1 5); do
                if ! kill -0 "$client_pid" 2>/dev/null; then
                  wait "$client_pid"
                  trap - EXIT
                  exit 0
                fi
                sleep 1
              done

              echo "Acceptance client remained alive after PASS; terminating development-only process group."
              kill -TERM -- "-$client_pid" 2>/dev/null || true
              sleep 2
              kill -KILL -- "-$client_pid" 2>/dev/null || true
              wait "$client_pid" 2>/dev/null || true
              trap - EXIT
              exit 0
            fi

            if ! kill -0 "$client_pid" 2>/dev/null; then
              set +e
              wait "$client_pid"
              code=$?
              set -e
              trap - EXIT
              echo "Acceptance client exited before durable PASS with code $code."
              exit "$code"
            fi
            sleep 1
          done

          echo "Acceptance client did not write durable PASS within 180 seconds."
          exit 1

      - name: Stacked-volume production lifecycle isolation
        timeout-minutes: 30
        run: ./gradlew :skyforge-neoforge-1211:runProductionComposedCaveAcceptanceStacked --stacktrace --no-configuration-cache

      - name: SF-IMP-0067 standalone composed-cave regression
        timeout-minutes: 14
        run: ./gradlew :skyforge-neoforge-1211:runComposedCaveAcceptanceA --stacktrace --no-configuration-cache

      - name: Verify aggregate production lifecycle evidence
        run: ./gradlew :skyforge-neoforge-1211:sfImp0068AcceptanceVerify --stacktrace --no-configuration-cache

      - name: Publish acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sf-imp-0068-acceptance-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            skyforge-neoforge-1211/build/acceptance/sf-imp-0068/*.properties
            skyforge-neoforge-1211/build/acceptance/sf-imp-0067/*.properties
            skyforge-neoforge-1211/run-sf-imp-0068-auto-*/logs/*.log
            skyforge-neoforge-1211/run-sf-imp-0067-auto-a/logs/*.log
