name: Aircraft compiler proof

on:
  pull_request:
    paths:
      - "tools/aircraft_compiler/**"
      - "docs/design-audit/aircraft-compiler-*.md"
      - ".github/workflows/aircraft-compiler-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run aircraft compiler tests
        run: python -m unittest discover -s tools/aircraft_compiler/tests -v
      - name: Compile AIRCRAFT-001 through v0.9 probe placement manifest
        run: >-
          python tools/aircraft_compiler/compile.py
          tools/aircraft_compiler/specimens/guild_utility_monoplane_v0.1.json
          --blockspace-config tools/aircraft_compiler/specimens/guild_utility_monoplane_blockspace_v0.2.json
          --target-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_target_v0.4.json
          --propulsion-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_propulsion_v0.5.json
          --surface-state-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_surface_state_v0.6.json
          --tail-lowering-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_tail_lowering_v0.7.json
          --pilot-station-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_pilot_station_v0.8.json
          --probe-manifest-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_probe_manifest_v0.9.json
          --out build/aircraft-compiler-v131
      - name: Plan v0.10 Physics Assembler fixture and adhesion intent
        run: >-
          python tools/aircraft_compiler/assembly_fixture_cli.py
          build/aircraft-compiler-v131/probe_placement_manifest.json
          tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_assembly_fixture_v0.10.json
          --out build/aircraft-compiler-v131
      - name: Encode v0.11 bounded Create Super Glue domain cover
        run: >-
          python tools/aircraft_compiler/glue_encoding_cli.py
          build/aircraft-compiler-v131/assembly_fixture.json
          tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_glue_encoding_v0.11.json
          --out build/aircraft-compiler-v131
      - name: Lower v0.12 governed powertrain
        run: >-
          python tools/aircraft_compiler/powertrain_lowering_cli.py
          build/aircraft-compiler-v131/probe_placement_manifest.json
          build/aircraft-compiler-v131/glue_encoding.json
          tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_powertrain_v0.12.json
          --out build/aircraft-compiler-v131
      - name: Lower superseded v0.13 one-axis yaw experiment
        run: >-
          python tools/aircraft_compiler/control_surface_lowering_cli.py
          build/aircraft-compiler-v131/probe_placement_manifest.json
          build/aircraft-compiler-v131/glue_encoding.json
          build/aircraft-compiler-v131/powertrain_v0.12.json
          tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_yaw_control_v0.13.json
          --out build/aircraft-compiler-v131
      - name: Lower v0.13.1 runtime-corrected air-gap yaw topology
        run: >-
          python tools/aircraft_compiler/control_surface_correction_cli.py
          build/aircraft-compiler-v131/probe_placement_manifest.json
          build/aircraft-compiler-v131/glue_encoding.json
          build/aircraft-compiler-v131/powertrain_v0.12.json
          build/aircraft-compiler-v131/yaw_control_v0.13.json
          tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_yaw_control_v0.13.1.json
          --out build/aircraft-compiler-v131
      - name: Lower v0.14 source-backed real-kinetic yaw actuation fixture
        run: >-
          python tools/aircraft_compiler/yaw_actuation_cli.py
          build/aircraft-compiler-v131/probe_placement_manifest.json
          build/aircraft-compiler-v131/powertrain_v0.12.json
          build/aircraft-compiler-v131/yaw_control_v0.13.1.json
          tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_yaw_actuation_v0.14.json
          --out build/aircraft-compiler-v131
      - name: Lower v0.15 exact-stack yaw-authority probe contract
        run: >-
          python tools/aircraft_compiler/yaw_authority_cli.py
          build/aircraft-compiler-v131/yaw_actuation_v0.14.json
          tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_yaw_authority_v0.15.json
          --out build/aircraft-compiler-v131
      - name: Lower v0.16 commanded neutral-return probe contract
        run: >-
          python tools/aircraft_compiler/yaw_neutral_return_cli.py
          build/aircraft-compiler-v131/yaw_actuation_v0.14.json
          build/aircraft-compiler-v131/yaw_authority_v0.15.json
          tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_yaw_neutral_return_v0.16.json
          --out build/aircraft-compiler-v131
      - name: Lower v0.17 real Simulated Steering Wheel source contract
        run: >-
          python tools/aircraft_compiler/steering_control_cli.py
          build/aircraft-compiler-v131/yaw_actuation_v0.14.json
          build/aircraft-compiler-v131/yaw_neutral_return_v0.16.json
          tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_steering_control_v0.17.json
          --out build/aircraft-compiler-v131
      - name: Assert v0.10-v0.11 assembly closure remains accepted
        run: |
          grep -q "mainBodyPlacementCount=114" build/aircraft-compiler-v131/assembly_fixture_validation.txt
          grep -q "nestedChildPlacementCount=9" build/aircraft-compiler-v131/assembly_fixture_validation.txt
          grep -q "adhesionIntentEdgeCount=113" build/aircraft-compiler-v131/assembly_fixture_validation.txt
          grep -q "mainBodyUnreachableCount=0" build/aircraft-compiler-v131/assembly_fixture_validation.txt
          grep -q "coveredAdhesionIntentEdgeCount=113" build/aircraft-compiler-v131/glue_encoding_validation.txt
          grep -q "glueDomainCount=4" build/aircraft-compiler-v131/glue_encoding_validation.txt
          grep -q "adhesionApplicationEncodingReady=True" build/aircraft-compiler-v131/glue_encoding_validation.txt
      - name: Assert v0.12 powered specimen remains exact
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('build/aircraft-compiler-v131/powertrain_v0.12.json').read_text())
          assert p['validation']['passed'] is True
          assert p['metrics']['resultingManifestPlacementCount'] == 126
          assert p['metrics']['resultingMovingMainBodyPlacementCount'] == 118
          assert p['metrics']['nestedPropellerChildPlacementCount'] == 9
          assert p['metrics']['expectedPrimarySableTransferCount'] == 127
          assert p['governor']['firstAcceptedTargetRpm'] == 128
          assert p['governor']['higherRpmPoints'] == [160, 192, 224, 256]
          PY
      - name: Preserve v0.13 superseded experiment identity
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('build/aircraft-compiler-v131/yaw_control_v0.13.json').read_text())
          assert p['validation']['passed'] is True
          assert p['digestSha256'] == '59f451bb7bb71433016af249f5ded7a87aed47b69b2a26215b4f573322f2d951'
          assert p['metrics']['v013MovingParentMainBodyPlacementCount'] == 117
          assert p['metrics']['yawControlChildPlacementCount'] == 4
          assert p['metrics']['expectedPrimarySableTransferCount'] == 130
          assert p['swivelBearingCoordinate'] == [17, 3, 0]
          assert p['rudderSeedCoordinate'] == [17, 4, 0]
          PY
      - name: Assert v0.13.1 corrected parent-child yaw topology and partition
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('build/aircraft-compiler-v131/yaw_control_v0.13.1.json').read_text())
          assert p['validation']['passed'] is True
          assert p['digestSha256'] == 'b2045fca7232343b114a834d43273f783f3fd8b41a753eccf0f730e525858eae'
          assert p['readiness']['yawControlStaticTopologyPassed'] is True
          assert p['readiness']['rudderChildCaptureProbeReady'] is True
          assert p['readiness']['controlActuationProbeReady'] is False
          assert p['metrics']['v012MovingMainBodyPlacementCount'] == 118
          assert p['metrics']['v0131MovingParentMainBodyPlacementCount'] == 118
          assert p['metrics']['nestedPropellerChildPlacementCount'] == 9
          assert p['metrics']['yawControlChildPlacementCount'] == 4
          assert p['metrics']['resultingManifestPlacementCount'] == 130
          assert p['metrics']['expectedPrimarySableTransferCount'] == 131
          assert p['metrics']['parentMainAdditionCount'] == 1
          assert p['metrics']['parentMainRemovalCount'] == 1
          assert p['metrics']['runtimeGlueDomainCount'] == 7
          assert p['swivelBearingCoordinate'] == [18, 3, 0]
          assert p['rudderSeedCoordinate'] == [18, 4, 0]
          assert p['rudderChildCoordinates'] == [[18,4,0],[18,5,0],[18,6,0],[18,7,0]]
          assert p['airGapCoordinates'] == [[17,4,0],[17,5,0],[17,6,0],[17,7,0]]
          assert p['aerodynamicAccounting']['fixedVerticalTailRegularSailCells'] == 7
          assert p['aerodynamicAccounting']['horizontalTailRegularSailCells'] == 19
          assert p['aerodynamicAccounting']['rudderSymmetricSailCells'] == 4
          assert p['aerodynamicAccounting']['airGapCells'] == 4
          assert '34764106343' in p['correctionReason']
          assert '[16,4,0]' in p['correctionReason']
          assert p['glueChecks']['noGlueDomainContainsAnyAirGapCell'] is True
          assert p['glueChecks']['noParentGlueDomainContainsRudderChild'] is True
          assert p['glueChecks']['childGlueExcludesBearing'] is True
          PY
      - name: Assert v0.13.1 static artifact does not overclaim runtime authority
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('build/aircraft-compiler-v131/yaw_control_v0.13.1.json').read_text())
          assert p['readiness']['runtimeQualificationReady'] is False
          assert p['readiness']['flightQualified'] is False
          blockers = set(p['readiness']['runtimeBlockers'])
          assert 'v0131_primary_sable_recapture_unverified' in blockers
          assert 'rudder_swivel_child_capture_unverified' in blockers
          assert 'rudder_actuation_unverified' in blockers
          assert 'pilot_control_binding_unverified' in blockers
          PY
      - name: Assert v0.14 actuation fixture identity and conservative readiness
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          yaw = json.loads(Path('build/aircraft-compiler-v131/yaw_control_v0.13.1.json').read_text())
          p = json.loads(Path('build/aircraft-compiler-v131/yaw_actuation_v0.14.json').read_text())
          assert p['validation']['passed'] is True
          assert p['schemaVersion'] == 'aircraft-yaw-actuation-ir-0.14'
          assert p['digestSha256'] == '26f32701664ae261d744508381d53729167d87fff5c4f2ac40881958862c0bdb'
          assert p['sourceYawControlDigestSha256'] == yaw['digestSha256']
          assert p['swivelBearingCoordinate'] == [18,3,0]
          assert p['driveCogCoordinate'] == [18,3,1]
          assert p['creativeMotorCoordinate'] == [18,2,1]
          assert p['runtimeProbe']['expectedCreativeMotorRpmMagnitude'] == 16
          assert p['runtimeProbe']['networkSettleTicks'] == 8
          assert p['runtimeProbe']['commandTicks'] == 5
          assert p['runtimeProbe']['stopSettleTicks'] == 8
          assert p['runtimeProbe']['holdTicks'] == 4
          assert p['runtimeProbe']['expectedCreateAngularDegreesPerTickPerRpm'] == 0.3
          assert p['readiness']['yawActuationStaticTopologyPassed'] is True
          assert p['readiness']['actuationRuntimeProbeReady'] is True
          assert p['readiness']['productionControlBindingReady'] is False
          assert p['readiness']['neutralReturnQualified'] is False
          assert p['readiness']['yawForceQualified'] is False
          assert p['readiness']['runtimeQualificationReady'] is False
          assert p['readiness']['flightQualified'] is False
          PY
      - name: Assert v0.15 yaw-authority contract identity and conservative readiness
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          act = json.loads(Path('build/aircraft-compiler-v131/yaw_actuation_v0.14.json').read_text())
          p = json.loads(Path('build/aircraft-compiler-v131/yaw_authority_v0.15.json').read_text())
          assert p['validation']['passed'] is True
          assert p['schemaVersion'] == 'aircraft-yaw-authority-ir-0.15'
          assert p['digestSha256'] == 'de046d04c2c20aea1158f861432093298e0f184c8148b06d1f055749e3c6296b'
          assert p['sourceYawActuationDigestSha256'] == act['digestSha256']
          assert p['runtimeProbe']['forwardSpeedMps'] == 10.0
          assert p['runtimeProbe']['servoSettlePhysicsTicks'] == 80
          assert p['readiness']['yawAuthorityProbeReady'] is True
          assert p['readiness']['yawAuthorityQualified'] is False
          assert p['readiness']['neutralReturnQualified'] is False
          assert p['readiness']['flightQualified'] is False
          PY
      - name: Assert v0.16 commanded-neutral-return contract identity and conservative readiness
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          act = json.loads(Path('build/aircraft-compiler-v131/yaw_actuation_v0.14.json').read_text())
          auth = json.loads(Path('build/aircraft-compiler-v131/yaw_authority_v0.15.json').read_text())
          p = json.loads(Path('build/aircraft-compiler-v131/yaw_neutral_return_v0.16.json').read_text())
          assert p['validation']['passed'] is True
          assert p['schemaVersion'] == 'aircraft-yaw-neutral-return-ir-0.16'
          assert p['digestSha256'] == '687e8878d92f42f11315b924e8d59b11929b93ebbb5f59682d2a0b16356909ff'
          assert p['sourceYawActuationDigestSha256'] == act['digestSha256']
          assert p['sourceYawAuthorityDigestSha256'] == auth['digestSha256']
          assert p['runtimeProbe']['reverseMotorSign'] == -1
          assert p['runtimeProbe']['inverseDriveTicks'] == 13
          assert p['readiness']['neutralReturnProbeReady'] is True
          assert p['readiness']['commandedNeutralReturnQualified'] is False
          assert p['readiness']['passiveSelfCenteringQualified'] is False
          assert p['readiness']['flightQualified'] is False
          PY
      - name: Assert v0.17 Steering Wheel source contract identity and conservative readiness
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          neutral = json.loads(Path('build/aircraft-compiler-v131/yaw_neutral_return_v0.16.json').read_text())
          p = json.loads(Path('build/aircraft-compiler-v131/steering_control_v0.17.json').read_text())
          assert p['validation']['passed'] is True
          assert p['schemaVersion'] == 'aircraft-steering-control-ir-0.17'
          assert p['digestSha256'] == 'dedcf826848a9828b72b42b78a935797f13ff26594f18c5a31a4ce0dfcdbf403'
          assert p['sourceYawNeutralReturnDigestSha256'] == neutral['digestSha256']
          assert p['steeringWheelCoordinate'] == [18,2,1]
          assert p['driveCogCoordinate'] == [18,3,1]
          assert p['steeringWheelResource'] == 'simulated:steering_wheel'
          assert p['steeringWheelBlockState'] == {'facing':'north','on_floor':'false','waterlogged':'false'}
          assert p['runtimeProbe']['expectedSteeringWheelRpmMagnitude'] == 16
          assert p['runtimeProbe']['wheelCommandDegrees'] == 48.0
          assert p['readiness']['steeringWheelSourceStaticTopologyPassed'] is True
          assert p['readiness']['steeringWheelSourceRuntimeProbeReady'] is True
          assert p['readiness']['productionCockpitRoutingReady'] is False
          assert p['readiness']['pilotInteractionBindingReady'] is False
          assert p['readiness']['flightQualified'] is False
          PY
      - name: Upload analytical through Steering Wheel control QA
        uses: actions/upload-artifact@v4
        with:
          name: aircraft-compiler-guild-utility-v017-qa
          path: build/aircraft-compiler-v131
          if-no-files-found: error
          retention-days: 14
