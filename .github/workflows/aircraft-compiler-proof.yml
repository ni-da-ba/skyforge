name: Aircraft compiler proof

on:
  pull_request:
    paths:
      - "tools/aircraft_compiler/**"
      - "docs/design-audit/aircraft-compiler-*.md"
      - ".github/workflows/aircraft-compiler-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run aircraft compiler tests
        run: python -m unittest discover -s tools/aircraft_compiler/tests -v
      - name: Compile AIRCRAFT-001 through v0.4 target-realizer preflight
        run: >-
          python tools/aircraft_compiler/compile.py
          tools/aircraft_compiler/specimens/guild_utility_monoplane_v0.1.json
          --blockspace-config tools/aircraft_compiler/specimens/guild_utility_monoplane_blockspace_v0.2.json
          --target-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_target_v0.4.json
          --out build/aircraft-compiler-v04
      - name: Assert realizer blocks premature schematic emission
        run: >-
          grep -q "schematicEmissionReady=False" build/aircraft-compiler-v04/target_validation.txt
      - name: Upload analytical, block-space, assembly, target, and mobile QA
        uses: actions/upload-artifact@v4
        with:
          name: aircraft-compiler-guild-utility-v04-qa
          path: build/aircraft-compiler-v04
          if-no-files-found: error
          retention-days: 14
