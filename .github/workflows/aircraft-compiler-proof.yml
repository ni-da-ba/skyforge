name: Aircraft compiler proof

on:
  pull_request:
    paths:
      - "tools/aircraft_compiler/**"
      - "docs/design-audit/aircraft-compiler-*.md"
      - ".github/workflows/aircraft-compiler-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run aircraft compiler tests
        run: python -m unittest discover -s tools/aircraft_compiler/tests -v
      - name: Compile AIRCRAFT-001 through v0.9 probe placement manifest
        run: >-
          python tools/aircraft_compiler/compile.py
          tools/aircraft_compiler/specimens/guild_utility_monoplane_v0.1.json
          --blockspace-config tools/aircraft_compiler/specimens/guild_utility_monoplane_blockspace_v0.2.json
          --target-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_target_v0.4.json
          --propulsion-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_propulsion_v0.5.json
          --surface-state-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_surface_state_v0.6.json
          --tail-lowering-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_tail_lowering_v0.7.json
          --pilot-station-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_pilot_station_v0.8.json
          --probe-manifest-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_probe_manifest_v0.9.json
          --out build/aircraft-compiler-v10
      - name: Plan v0.10 Physics Assembler fixture and adhesion intent
        run: >-
          python tools/aircraft_compiler/assembly_fixture_cli.py
          build/aircraft-compiler-v10/probe_placement_manifest.json
          tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_assembly_fixture_v0.10.json
          --out build/aircraft-compiler-v10
      - name: Assert v0.9 exact placement manifest remains accepted
        run: |
          grep -q "probePlacementManifestReady=True" build/aircraft-compiler-v10/probe_manifest_validation.txt
          grep -q "allPlacementsCoordinateUnique=True" build/aircraft-compiler-v10/probe_manifest_validation.txt
          grep -q "kindCount.airframe_aerodynamic_surface=91" build/aircraft-compiler-v10/probe_manifest_validation.txt
          grep -q "kindCount.propeller_sail=8" build/aircraft-compiler-v10/probe_manifest_validation.txt
      - name: Assert v0.10 main-body and nested-propeller topology
        run: |
          grep -q "physicsAssemblerLattice=\[0, 1, 0\]" build/aircraft-compiler-v10/assembly_fixture_validation.txt
          grep -q "physicsAssemblerResource=simulated:physics_assembler" build/aircraft-compiler-v10/assembly_fixture_validation.txt
          grep -q 'physicsAssemblerState={"face":"ceiling","facing":"north"}' build/aircraft-compiler-v10/assembly_fixture_validation.txt
          grep -q "assemblySeedLattice=\[0, 2, 0\]" build/aircraft-compiler-v10/assembly_fixture_validation.txt
          grep -q "mainBodyPlacementCount=113" build/aircraft-compiler-v10/assembly_fixture_validation.txt
          grep -q "nestedChildPlacementCount=9" build/aircraft-compiler-v10/assembly_fixture_validation.txt
          grep -q "adhesionIntentEdgeCount=112" build/aircraft-compiler-v10/assembly_fixture_validation.txt
          grep -q "mainBodyUnreachableCount=0" build/aircraft-compiler-v10/assembly_fixture_validation.txt
          grep -q "assemblyFixtureTopologyPassed=True" build/aircraft-compiler-v10/assembly_fixture_validation.txt
          grep -q "nestedChildExcludedFromMainAdhesionGraph=True" build/aircraft-compiler-v10/assembly_fixture_validation.txt
          grep -q "bearingFaceAdjacentToChildHub=True" build/aircraft-compiler-v10/assembly_fixture_validation.txt
      - name: Assert runtime claims remain blocked at glue encoding boundary
        run: |
          grep -q "physicsAssemblerPlacementResolved=True" build/aircraft-compiler-v10/assembly_fixture_validation.txt
          grep -q "mainBodyAdhesionGraphResolved=True" build/aircraft-compiler-v10/assembly_fixture_validation.txt
          grep -q "adhesionApplicationEncodingReady=False" build/aircraft-compiler-v10/assembly_fixture_validation.txt
          grep -q "physicsAssemblyProbeReady=False" build/aircraft-compiler-v10/assembly_fixture_validation.txt
          grep -q "adhesion_application_encoding_unresolved" build/aircraft-compiler-v10/assembly_fixture_validation.txt
          grep -q "flightQualified=False" build/aircraft-compiler-v10/assembly_fixture_validation.txt
      - name: Upload analytical through assembly-fixture QA
        uses: actions/upload-artifact@v4
        with:
          name: aircraft-compiler-guild-utility-v10-qa
          path: build/aircraft-compiler-v10
          if-no-files-found: error
          retention-days: 14
