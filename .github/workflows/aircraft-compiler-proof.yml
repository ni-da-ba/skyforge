name: Aircraft compiler proof

on:
  pull_request:
    paths:
      - "tools/aircraft_compiler/**"
      - "docs/design-audit/aircraft-compiler-*.md"
      - ".github/workflows/aircraft-compiler-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run aircraft compiler tests
        run: python -m unittest discover -s tools/aircraft_compiler/tests -v
      - name: Compile AIRCRAFT-001 through v0.7 tail-junction lowering
        run: >-
          python tools/aircraft_compiler/compile.py
          tools/aircraft_compiler/specimens/guild_utility_monoplane_v0.1.json
          --blockspace-config tools/aircraft_compiler/specimens/guild_utility_monoplane_blockspace_v0.2.json
          --target-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_target_v0.4.json
          --propulsion-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_propulsion_v0.5.json
          --surface-state-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_surface_state_v0.6.json
          --tail-lowering-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_tail_lowering_v0.7.json
          --out build/aircraft-compiler-v07
      - name: Assert corrected lifting primitive and v0.6 conflict boundary
        run: |
          grep -q 'create:white_sail' build/aircraft-compiler-v07/target_preflight.json
          grep -q "providerPlacementCount=88" build/aircraft-compiler-v07/surface_state_validation.txt
          grep -q "stateResolvedCount=85" build/aircraft-compiler-v07/surface_state_validation.txt
          grep -q "stateConflictCount=3" build/aircraft-compiler-v07/surface_state_validation.txt
      - name: Assert v0.7 tail translation closes the state conflict without semantic loss
        run: |
          grep -q "v06AerodynamicPlacementCount=88" build/aircraft-compiler-v07/tail_lowering_validation.txt
          grep -q "v07AerodynamicPlacementCount=91" build/aircraft-compiler-v07/tail_lowering_validation.txt
          grep -q "verticalTailCellCount=8" build/aircraft-compiler-v07/tail_lowering_validation.txt
          grep -q "horizontalTailCellCount=19" build/aircraft-compiler-v07/tail_lowering_validation.txt
          grep -q "resolvedFormerConflictCount=3" build/aircraft-compiler-v07/tail_lowering_validation.txt
          grep -q "verticalLongitudinalFirstMomentPreserved=True" build/aircraft-compiler-v07/tail_lowering_validation.txt
          grep -q "verticalRelativeShapePreserved=True" build/aircraft-compiler-v07/tail_lowering_validation.txt
          grep -q "verticalRootFaceAttachedToHorizontalTail=True" build/aircraft-compiler-v07/tail_lowering_validation.txt
          grep -q "surfaceStateResolutionComplete=True" build/aircraft-compiler-v07/tail_lowering_validation.txt
      - name: Assert pilot/runtime gates still block probe qualification
        run: |
          grep -q "probeSchematicEmissionReady=False" build/aircraft-compiler-v07/tail_lowering_validation.txt
          grep -q "staticBlockers=unresolved_required_station_providers" build/aircraft-compiler-v07/tail_lowering_validation.txt
      - name: Upload analytical through tail-lowering QA
        uses: actions/upload-artifact@v4
        with:
          name: aircraft-compiler-guild-utility-v07-qa
          path: build/aircraft-compiler-v07
          if-no-files-found: error
          retention-days: 14
