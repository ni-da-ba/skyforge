name: Aircraft compiler proof

on:
  pull_request:
    paths:
      - "tools/aircraft_compiler/**"
      - "docs/design-audit/aircraft-compiler-*.md"
      - ".github/workflows/aircraft-compiler-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run aircraft compiler tests
        run: python -m unittest discover -s tools/aircraft_compiler/tests -v
      - name: Compile AIRCRAFT-001 through v0.8 pilot-station decomposition
        run: >-
          python tools/aircraft_compiler/compile.py
          tools/aircraft_compiler/specimens/guild_utility_monoplane_v0.1.json
          --blockspace-config tools/aircraft_compiler/specimens/guild_utility_monoplane_blockspace_v0.2.json
          --target-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_target_v0.4.json
          --propulsion-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_propulsion_v0.5.json
          --surface-state-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_surface_state_v0.6.json
          --tail-lowering-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_tail_lowering_v0.7.json
          --pilot-station-profile tools/aircraft_compiler/specimens/create_aeronautics_1.3.2_pilot_station_v0.8.json
          --out build/aircraft-compiler-v08
      - name: Assert v0.7 tail lowering remains accepted
        run: |
          grep -q "v07AerodynamicPlacementCount=91" build/aircraft-compiler-v08/tail_lowering_validation.txt
          grep -q "surfaceStateResolutionComplete=True" build/aircraft-compiler-v08/tail_lowering_validation.txt
      - name: Assert pilot occupancy is statically placeable without faking control authority
        run: |
          grep -q "pilotAnchorLattice=\[5, 2, 0\]" build/aircraft-compiler-v08/pilot_station_validation.txt
          grep -q "pilotSeatLattice=\[5, 3, 0\]" build/aircraft-compiler-v08/pilot_station_validation.txt
          grep -q "pilotSeatResource=create:brown_seat" build/aircraft-compiler-v08/pilot_station_validation.txt
          grep -q "pilotStationStaticPlacementPassed=True" build/aircraft-compiler-v08/pilot_station_validation.txt
          grep -q "seatCoordinateFree=True" build/aircraft-compiler-v08/pilot_station_validation.txt
          grep -q "seatSupportedByPilotAnchor=True" build/aircraft-compiler-v08/pilot_station_validation.txt
          grep -q "probeSchematicEmissionReady=True" build/aircraft-compiler-v08/pilot_station_validation.txt
      - name: Assert runtime and flight gates remain explicit
        run: |
          grep -q "runtimeQualificationReady=False" build/aircraft-compiler-v08/pilot_station_validation.txt
          grep -q "flightQualified=False" build/aircraft-compiler-v08/pilot_station_validation.txt
          grep -q "control_binding_runtime_unverified" build/aircraft-compiler-v08/pilot_station_validation.txt
          grep -q "pilot_occupancy_runtime_unverified" build/aircraft-compiler-v08/pilot_station_validation.txt
      - name: Upload analytical through pilot-station QA
        uses: actions/upload-artifact@v4
        with:
          name: aircraft-compiler-guild-utility-v08-qa
          path: build/aircraft-compiler-v08
          if-no-files-found: error
          retention-days: 14
