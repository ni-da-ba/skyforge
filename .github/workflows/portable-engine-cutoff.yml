name: Portable Engine Cutoff

on:
  pull_request:
    paths:
      - ".github/workflows/portable-engine-cutoff.yml"
      - "skyforge-neoforge-1211/build.gradle.kts"
      - "skyforge-neoforge-1211/wave-c1-mods.properties"
      - "skyforge-neoforge-1211/wave-c9-mods.properties"
      - "skyforge-neoforge-1211/src/main/resources/skyforge.mixins.json"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgePortableEngineCutoffAccess.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgePortableEngineCutoffAcceptance.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/mixin/SkyforgePortableEngineBlockEntityMixin.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/mixin/SkyforgePortableEngineBlockMixin.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-engine-cutoff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-cutoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Resolve retained flight/computing stack
        run: ./gradlew :skyforge-neoforge-1211:waveC9ResolvePinnedMods --no-configuration-cache

      - name: Live Portable Engine cutoff acceptance
        shell: bash
        run: |
          set -euo pipefail
          log="portable-engine-cutoff.log"

          setsid ./gradlew :skyforge-neoforge-1211:runPortableEngineCutoffAcceptanceServer             --no-configuration-cache >"${log}" 2>&1 &
          pid=$!
          pass=0

          for _ in $(seq 1 120); do
            if grep -Fq "PORTABLE_ENGINE_CUTOFF_ACCEPTANCE PASS" "${log}" 2>/dev/null; then
              pass=1
              break
            fi

            if grep -Fq "PORTABLE_ENGINE_CUTOFF_ACCEPTANCE FAIL" "${log}" 2>/dev/null; then
              break
            fi

            if ! kill -0 "${pid}" 2>/dev/null; then
              break
            fi

            sleep 1
          done

          if [[ "${pass}" -eq 1 ]]; then
            grep -F "PORTABLE_ENGINE_CUTOFF_ACCEPTANCE PASS" "${log}"
            kill -TERM -- "-${pid}" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-${pid}" 2>/dev/null || true
            wait "${pid}" 2>/dev/null || true
            exit 0
          fi

          echo "FAIL Portable Engine cutoff live acceptance"
          cat "${log}"
          kill -TERM -- "-${pid}" 2>/dev/null || true
          sleep 1
          kill -KILL -- "-${pid}" 2>/dev/null || true
          wait "${pid}" 2>/dev/null || true
          exit 1
