name: Orchestrator Pilot

on:
  pull_request:
    paths:
      - 'tools/orchestrator/**'
      - '.github/workflows/orchestrator-pilot.yml'
      - 'AGENTS.md'
      - 'docs/agent-state/ORCHESTRATION_PROTOCOL.md'
  push:
    branches: [main]
    paths:
      - 'tools/orchestrator/**'
      - '.github/workflows/orchestrator-pilot.yml'
      - 'AGENTS.md'
      - 'docs/agent-state/ORCHESTRATION_PROTOCOL.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run orchestrator unit tests
        run: python -m unittest discover -s tools/orchestrator -p 'test_*.py' -v
