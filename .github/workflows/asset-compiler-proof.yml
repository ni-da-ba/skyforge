name: Asset compiler proof

on:
  pull_request:
    paths:
      - 'tools/asset_compiler/**'
      - 'skyforge-neoforge-1211/build.gradle.kts'
      - 'skyforge-neoforge-1211/wave-c1-mods.properties'
      - 'skyforge-neoforge-1211/wave-c9-mods.properties'
      - 'skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeWaveC21CreateResourceAuthorityAcceptance.java'
      - 'skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeWbyC1StructureRegistryProbe.java'
      - '.github/workflows/asset-compiler-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run asset compiler tests
        run: python -m unittest discover -s tools/asset_compiler/tests -v

      - name: Compile v0.12 optimized Guild branch
        run: >-
          python tools/asset_compiler/compile.py
          tools/asset_compiler/specimens/bootstrap_guild_branch_v0.12.json
          --out build/asset-compiler-v012
          --minecraft-structure

      - name: Compile v0.13 first-principles Guild branch
        run: >-
          python tools/asset_compiler/compile.py
          tools/asset_compiler/specimens/bootstrap_guild_branch_v0.13_first_principles.json
          --out build/asset-compiler-v013-first-principles
          --minecraft-structure

      - name: Compile v0.14 first-principles detail Guild branch
        run: >-
          python tools/asset_compiler/compile.py
          tools/asset_compiler/specimens/bootstrap_guild_branch_v0.14_first_principles_detail.json
          --out build/asset-compiler-v014-first-principles-detail
          --minecraft-structure

      - name: Compile v0.14 through WBY target profile
        run: >-
          python tools/asset_compiler/compile_wby.py
          tools/asset_compiler/specimens/bootstrap_guild_branch_v0.14_first_principles_detail.json
          --out build/asset-compiler-v014-wby

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve exact WBY C1 Create artifact
        run: ./gradlew :skyforge-neoforge-1211:waveC9ResolvePinnedMods --no-configuration-cache

      - name: Probe exact WBY C1 Create structure registry
        shell: bash
        run: |
          set -euo pipefail
          result="${GITHUB_WORKSPACE}/build/wby-c1-runtime-proof/registry.properties"
          mkdir -p "$(dirname "${result}")"
          JAVA_TOOL_OPTIONS="-Dskyforge.dev.wbyC1StructureRegistryProbe=true -Dskyforge.dev.wbyC1StructureRegistryResultFile=${result}" \
            ./gradlew :skyforge-neoforge-1211:runWaveC21CreateResourceBaselineServer --no-daemon --no-configuration-cache
          test -f "${result}"
          grep -Fxq 'status=PASS' "${result}"
          grep -Fxq 'catalogBlocksValidated=17' "${result}"
          grep -Fxq 'paneContractsValidated=3' "${result}"
          grep -Fxq 'barsContractsValidated=3' "${result}"
          grep -Fxq 'ladderContractsValidated=3' "${result}"
          grep -Fxq 'scaffoldingContractsValidated=3' "${result}"
          grep -Fxq 'deferredStructuralContractsObserved=1' "${result}"
          cat "${result}"

      - name: Upload v0.12 QA and structure artifact
        uses: actions/upload-artifact@v4
        with:
          name: guild-branch-v012-qa
          path: build/asset-compiler-v012
          if-no-files-found: error
          retention-days: 14

      - name: Upload v0.13 first-principles QA and structure artifact
        uses: actions/upload-artifact@v4
        with:
          name: guild-branch-v013-first-principles-qa
          path: build/asset-compiler-v013-first-principles
          if-no-files-found: error
          retention-days: 14

      - name: Upload v0.14 first-principles detail QA and structure artifact
        uses: actions/upload-artifact@v4
        with:
          name: guild-branch-v014-first-principles-detail-qa
          path: build/asset-compiler-v014-first-principles-detail
          if-no-files-found: error
          retention-days: 14
