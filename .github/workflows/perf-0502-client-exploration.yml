name: PERF 0502 Client Exploration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-0502-client-exploration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-exploration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Compile and unit test benchmark seam
        timeout-minutes: 10
        run: ./gradlew :skyforge-neoforge-1211:compileJava :skyforge-neoforge-1211:test --stacktrace --no-configuration-cache

      - name: Prepare deterministic persisted Skyforge world
        timeout-minutes: 35
        run: ./gradlew :skyforge-neoforge-1211:showcasePrepareVerify --stacktrace --no-configuration-cache

      - name: Measure run-directory bytes before client
        run: |
          du -sb skyforge-neoforge-1211/run-skyforge-showcase | awk '{print $1}' > perf-0502-disk-before.txt

      - name: Run actual-client exploration characterization
        timeout-minutes: 12
        env:
          SKYFORGE_CLIENT_EXPLORATION_BENCHMARK: "true"
          LIBGL_ALWAYS_SOFTWARE: "1"
          JAVA_TOOL_OPTIONS: "-Xlog:gc*,safepoint:file=${{ github.workspace }}/perf-0502-gc-%p.log:time,uptime,level,tags"
        run: |
          rm -f skyforge-neoforge-1211/build/acceptance/showcase/viewer.properties
          /usr/bin/time -v -o perf-0502-time.txt \
            xvfb-run -a ./gradlew :skyforge-neoforge-1211:runShowcaseViewerAcceptanceClient \
              --stacktrace --no-configuration-cache --no-daemon

      - name: Verify client benchmark evidence
        run: |
          python3 .github/scripts/verify-perf-0502-client-benchmark.py \
            skyforge-neoforge-1211/build/acceptance/showcase/viewer.properties \
            | tee perf-0502-summary.txt

      - name: Measure run-directory bytes after client
        if: always()
        run: |
          du -sb skyforge-neoforge-1211/run-skyforge-showcase | awk '{print $1}' > perf-0502-disk-after.txt || true
          {
            echo "benchmarkSourceSha=${GITHUB_SHA}"
            echo "runnerOs=${RUNNER_OS}"
            echo "runnerArch=${RUNNER_ARCH}"
            echo "javaVersion=$(java -version 2>&1 | head -n 1)"
            echo "softwareRenderer=true"
            echo "benchmarkInterpretation=relative-characterization-not-hardware-fps-gate"
          } > perf-0502-environment.properties

      - name: Publish PERF-0502 characterization evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-0502-client-exploration-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            skyforge-neoforge-1211/build/acceptance/showcase/viewer.properties
            skyforge-neoforge-1211/build/acceptance/showcase/prepare.properties
            skyforge-neoforge-1211/run-skyforge-showcase/logs/*.log
            skyforge-neoforge-1211/run-skyforge-showcase/crash-reports/*.txt
            perf-0502-summary.txt
            perf-0502-time.txt
            perf-0502-gc-*.log
            perf-0502-disk-before.txt
            perf-0502-disk-after.txt
            perf-0502-environment.properties
