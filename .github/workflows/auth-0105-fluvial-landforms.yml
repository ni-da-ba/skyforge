name: AUTH-0105 Fluvial Landforms
# H2 validation pulse: drainage-surface / flow-direction separation

on:
  pull_request:
    paths:
      - ".github/workflows/auth-0105-fluvial-landforms.yml"
      - ".github/actions/run-authorship-evidence/action.yml"
      - "docs/authorship/AUTH-0105-fluvial-landform-realization.md"
      - "docs/authorship/HYDROLOGY_OVERHAUL_REFERENCE.md"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandFluvialReachGeometry.java"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandNaturalizedChannelPlanner.java"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandFluvialTerrainField.java"
      - "skyforge-world/src/test/java/io/github/nidaba/skyforge/world/SkyIslandFluvialTerrainFieldTest.java"
      - "skyforge-reference/src/main/java/io/github/nidaba/skyforge/reference/AuthorshipFluvialLandformCorpusCli.java"
      - "skyforge-reference/src/test/java/io/github/nidaba/skyforge/reference/AuthorshipFluvialLandformCorpusTest.java"
      - "skyforge-reference/src/main/java/io/github/nidaba/skyforge/reference/AuthorshipFluvialSpecimenSearchCli.java"
      - "skyforge-reference/src/test/java/io/github/nidaba/skyforge/reference/AuthorshipFluvialSpecimenSearchTest.java"
      - "skyforge-reference/src/main/java/io/github/nidaba/skyforge/reference/HydrologyReferenceIslandCli.java"
      - "skyforge-reference/src/test/java/io/github/nidaba/skyforge/reference/HydrologyReferenceIslandCliTest.java"
      - "skyforge-reference/build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-0105-fluvial-landforms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Authorship evidence contract
        uses: ./.github/actions/run-authorship-evidence
        with:
          gradle_command: |
            ./gradlew \
              :skyforge-world:test --tests '*SkyIslandWatershedPlannerTest' \
              :skyforge-reference:hydrologyReferenceIsland \
              --no-configuration-cache
          verify_command: |
            REF=skyforge-reference/build/evidence/hydrology-reference-island-v1
            test -f "$REF/diagnostics.csv"
            test -f "$REF/summary.txt"
            test "$(wc -l < "$REF/diagnostics.csv")" -eq 3
            grep -q '^primary,287,' "$REF/diagnostics.csv"
            grep -q '^confluence-control,649,' "$REF/diagnostics.csv"
          artifact_name: auth-0105-fluvial-landforms
          artifact_path: |
            skyforge-reference/build/evidence/hydrology-reference-island-v1/diagnostics.csv
            skyforge-reference/build/evidence/hydrology-reference-island-v1/summary.txt
