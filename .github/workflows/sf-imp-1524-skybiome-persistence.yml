name: SF-IMP-1524 SkyBiome Zone Persistence Acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/sf-imp-1524-skybiome-persistence.yml"
      - "scripts/sf-imp-1524-skybiome-persistence-acceptance.sh"
      - "skyforge-neoforge-1211/build.gradle.kts"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeSkyBiomeZoneSavedData.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeSkyBiomeZonePersistenceAcceptance.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeAutomatedAcceptanceHarness.java"
      - "skyforge-neoforge-1211/src/test/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeSkyBiomeZoneSavedDataTest.java"
      - "skyforge-model/src/main/java/io/github/nidaba/skyforge/model/skyisland/SkyBiome*.java"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sf-imp-1524-skybiome-persistence.yml"
      - "scripts/sf-imp-1524-skybiome-persistence-acceptance.sh"
      - "skyforge-neoforge-1211/build.gradle.kts"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeSkyBiomeZoneSavedData.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeSkyBiomeZonePersistenceAcceptance.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeAutomatedAcceptanceHarness.java"
      - "skyforge-neoforge-1211/src/test/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeSkyBiomeZoneSavedDataTest.java"
      - "skyforge-model/src/main/java/io/github/nidaba/skyforge/model/skyisland/SkyBiome*.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sf-imp-1524-skybiome-persistence-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  skybiome-persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Write, stop, and reopen the same Overworld save
        shell: bash
        run: bash scripts/sf-imp-1524-skybiome-persistence-acceptance.sh

      - name: Preserve SkyBiome persistence evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sf-imp-1524-skybiome-zone-persistence
          path: |
            sf-imp-1524-skybiome-task.log
            skyforge-neoforge-1211/build/acceptance/sf-imp-1524-skybiome/
            skyforge-neoforge-1211/run-sf-imp-1524-skybiome/logs/
          if-no-files-found: warn
          retention-days: 14
