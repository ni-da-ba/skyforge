name: Wave C17 GPS Infrastructure

on:
  pull_request:
    paths:
      - ".github/workflows/wave-c17-gps-infrastructure.yml"
      - "skyforge-neoforge-1211/wave-c9-mods.properties"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeWaveC17GpsInfrastructureAcceptance.java"
      - "skyforge-neoforge-1211/src/test/java/io/github/nidaba/skyforge/neoforge1211/WaveC17GpsInfrastructureResourceTest.java"
  push:
    branches: [main]
    paths:
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeNeoForge1211Mod.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave-c17-gps-infrastructure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gps:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Verify C17 wiring and retained computing pins
        run: |
          ./gradlew :skyforge-neoforge-1211:test --tests '*WaveC9ComputingResourceTest' --tests '*WaveC17GpsInfrastructureResourceTest' --no-configuration-cache
          ./gradlew :skyforge-neoforge-1211:waveC9ResolvePinnedMods --no-configuration-cache

      - name: Prove stock GPS infrastructure topology
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Dskyforge.dev.waveC17GpsInfrastructure=true
        run: |
          set -euo pipefail
          log="wave-c17-gps-infrastructure.log"
          setsid ./gradlew :skyforge-neoforge-1211:runWaveC9ComputingAvionicsServer --no-configuration-cache >"${log}" 2>&1 &
          pid=$!
          outcome=""

          for _ in $(seq 1 180); do
            if grep -Fq "WAVE_C17 PASS" "${log}" 2>/dev/null; then
              outcome="pass"
              break
            fi
            if grep -Fq "WAVE_C17 FAIL" "${log}" 2>/dev/null; then
              outcome="fail"
              break
            fi
            if ! kill -0 "${pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [[ "${outcome}" == "pass" ]]; then
            grep -F "WAVE_C17 PASS" "${log}"
            kill -TERM -- "-${pid}" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-${pid}" 2>/dev/null || true
            wait "${pid}" 2>/dev/null || true
            exit 0
          fi

          echo "FAIL Wave C17 GPS-infrastructure acceptance"
          cat "${log}"
          kill -TERM -- "-${pid}" 2>/dev/null || true
          sleep 1
          kill -KILL -- "-${pid}" 2>/dev/null || true
          wait "${pid}" 2>/dev/null || true
          exit 1
