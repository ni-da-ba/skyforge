name: Wave C23 Petroleum Province Feasibility

on:
  pull_request:
    paths:
      - ".github/workflows/wave-c23-petroleum-province-feasibility.yml"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/content/SkyIslandPetroleumProvincePlanner.java"
      - "skyforge-world/src/test/java/io/github/nidaba/skyforge/world/content/SkyIslandPetroleumProvincePlannerTest.java"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandRegionalPetroleumSystemOpportunityEntry.java"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandRegionalPetroleumSystemOpportunityProfile.java"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandRegionalPetroleumSystemOpportunityProfiler.java"
      - "docs/design-audit/wave-c23-petroleum-province-feasibility.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave-c23-petroleum-province-feasibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify C23 petroleum province feasibility
        run: ./gradlew :skyforge-world:test --tests '*SkyIslandPetroleumProvincePlannerTest' --no-configuration-cache
