name: MECH-003 Sequenced Workshop

on:
  pull_request:
    paths:
      - ".github/workflows/mech-003-sequenced-workshop.yml"
      - "docs/agent-state/COMPILER_INTEGRATION_CAPABILITIES.json"
      - "docs/agent-state/STRUCTURE_COMPILER_STATE.md"
      - "scripts/compiler-integration/run-exact-stack-fixture.sh"
      - "tools/asset_compiler/functional_mechanism.py"
      - "tools/asset_compiler/functional_mechanism_structure.py"
      - "tools/asset_compiler/compile_mechanism.py"
      - "tools/asset_compiler/specimens/mech_003_portable_engine_workshop.json"
      - "tools/asset_compiler/tests/test_functional_mechanism.py"
      - "skyforge-neoforge-1211/build.gradle.kts"
      - "skyforge-neoforge-1211/wave-c1-mods.properties"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeMech003SequencedWorkshopAcceptance.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeNeoForge1211Mod.java"
      - "skyforge-neoforge-1211/src/main/resources/data/skyforge/mechanisms/mech_003_portable_engine_workshop.json"
      - "skyforge-neoforge-1211/src/development/resources/data/skyforge/structure/mech_003_portable_engine_workshop.nbt"
      - "skyforge-neoforge-1211/src/test/java/io/github/nidaba/skyforge/neoforge1211/Mech003SequencedWorkshopResourceTest.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mech-003-sequenced-workshop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  l1-static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify deterministic functional compiler
        run: >-
          PYTHONPATH=tools/asset_compiler
          python3 -m unittest discover
          -s tools/asset_compiler/tests
          -p 'test_functional_mechanism.py'
      - name: Compile canonical MECH-003 plan
        run: >-
          python3 tools/asset_compiler/compile_mechanism.py
          tools/asset_compiler/specimens/mech_003_portable_engine_workshop.json
          --out build/mech-003
      - name: Verify runtime consumes exact compiler plan
        run: >-
          cmp build/mech-003/resolved.json
          skyforge-neoforge-1211/src/main/resources/data/skyforge/mechanisms/mech_003_portable_engine_workshop.json
      - name: Verify human-gate structure is exact compiler output
        run: >-
          cmp build/mech-003/mech_003_portable_engine_workshop.nbt
          skyforge-neoforge-1211/src/development/resources/data/skyforge/structure/mech_003_portable_engine_workshop.nbt
      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Verify runtime resource contract
        run: >-
          ./gradlew :skyforge-neoforge-1211:test
          --tests '*Mech003SequencedWorkshopResourceTest'
          --no-configuration-cache

  l3-exact-stack:
    needs: l1-static-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Recompile exact MECH-003 plan
        run: >-
          python3 tools/asset_compiler/compile_mechanism.py
          tools/asset_compiler/specimens/mech_003_portable_engine_workshop.json
          --out build/mech-003
      - name: Verify exact plan identity
        run: >-
          cmp build/mech-003/resolved.json
          skyforge-neoforge-1211/src/main/resources/data/skyforge/mechanisms/mech_003_portable_engine_workshop.json
      - name: Verify exact structure identity
        run: >-
          cmp build/mech-003/mech_003_portable_engine_workshop.nbt
          skyforge-neoforge-1211/src/development/resources/data/skyforge/structure/mech_003_portable_engine_workshop.nbt
      - name: Resolve exact accepted Create/Simulated stack
        run: ./gradlew :skyforge-neoforge-1211:waveC11ResolvePinnedMods --no-configuration-cache
      - name: Prove compiled beltless Portable Engine sequenced lifecycle
        run: >-
          scripts/compiler-integration/run-exact-stack-fixture.sh
          :skyforge-neoforge-1211:runMech003SequencedWorkshopServer
          mech-003-sequenced-workshop.log
          'MECH_003_SEQUENCED_WORKSHOP START'
          'MECH_003_SEQUENCED_WORKSHOP PASS'
          'MECH_003_SEQUENCED_WORKSHOP FAIL'
          120
          240
