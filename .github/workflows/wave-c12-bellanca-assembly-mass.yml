name: Wave C12 Bellanca Assembly Mass

on:
  pull_request:
    paths:
      - ".github/workflows/wave-c12-bellanca-assembly-mass.yml"
      - "skyforge-neoforge-1211/build.gradle.kts"
      - "skyforge-neoforge-1211/wave-c1-mods.properties"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeWaveC12BellancaAssemblyAcceptance.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeNeoForge1211Mod.java"
      - "skyforge-neoforge-1211/src/test/java/io/github/nidaba/skyforge/neoforge1211/WaveC12BellancaAssemblyResourceTest.java"
      - "docs/design-audit/giuseppe-bellanca-b0a-assembly-manifest-v0.1.json"
      - "docs/design-audit/giuseppe-bellanca-b0a-assembly-topology-v0.1.md"
      - "docs/design-audit/giuseppe-bellanca-b0a-mass-and-balance-v0.1.md"
      - "docs/design-audit/wave-c12-b0a-assembly-mass-runtime.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave-c12-bellanca-assembly-mass-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  b0a-assembly-mass:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify B0-A1/A2 scope and wiring
        run: ./gradlew :skyforge-neoforge-1211:test --tests '*WaveC12BellancaAssemblyResourceTest' --no-configuration-cache

      - name: Resolve accepted C11 flight-only runtime
        run: ./gradlew :skyforge-neoforge-1211:waveC11ResolvePinnedMods --no-configuration-cache

      - name: Assemble B0-A MAIN_BODY and measure live Sable mass
        shell: bash
        run: |
          set -euo pipefail
          log="wave-c12-b0a-assembly-mass.log"
          setsid ./gradlew :skyforge-neoforge-1211:runWaveC12BellancaAssemblyMassServer             --no-configuration-cache >"${log}" 2>&1 &
          pid=$!
          outcome=""

          for _ in $(seq 1 240); do
            if grep -Fq "WAVE_C12_B0A_ACCEPTANCE PASS" "${log}" 2>/dev/null; then
              outcome="pass"
              break
            fi
            if grep -Fq "WAVE_C12_B0A_ACCEPTANCE FAIL" "${log}" 2>/dev/null; then
              outcome="fail"
              break
            fi
            if ! kill -0 "${pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [[ "${outcome}" == "pass" ]]; then
            grep -F "WAVE_C12_B0A_ACCEPTANCE PASS" "${log}"
            kill -TERM -- "-${pid}" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-${pid}" 2>/dev/null || true
            wait "${pid}" 2>/dev/null || true
            exit 0
          fi

          echo "FAIL Wave C12 B0-A1/A2 live assembly/mass acceptance"
          cat "${log}"
          kill -TERM -- "-${pid}" 2>/dev/null || true
          sleep 1
          kill -KILL -- "-${pid}" 2>/dev/null || true
          wait "${pid}" 2>/dev/null || true
          exit 1
