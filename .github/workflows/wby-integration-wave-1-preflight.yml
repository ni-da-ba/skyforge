name: WBY Integration Wave 1 Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/wby-integration-wave-1-preflight.yml"
      - "skyforge-neoforge-1211/build.gradle.kts"
      - "skyforge-neoforge-1211/wave-c1-mods.properties"
      - "skyforge-neoforge-1211/wby-wave1-mods.properties"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wby-wave1-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-and-server-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Resolve exact WBY Wave 1 candidates
        run: ./gradlew :skyforge-neoforge-1211:wbyWave1ResolvePinnedMods --no-configuration-cache

      - name: Prove server-side SSRD dependency boundary boots
        shell: bash
        run: |
          set -euo pipefail
          run_dir="skyforge-neoforge-1211/run-wby-wave1-visibility-server"
          mkdir -p "$run_dir"
          printf 'eula=true\n' > "$run_dir/eula.txt"
          cat > "$run_dir/server.properties" <<'EOF'
          level-name=wby-wave1-preflight
          online-mode=false
          spawn-protection=0
          gamemode=creative
          difficulty=peaceful
          view-distance=4
          simulation-distance=4
          max-tick-time=0
          server-port=0
          EOF

          log="wby-wave1-server-boot.log"
          setsid ./gradlew :skyforge-neoforge-1211:runWbyWave1VisibilityServer --no-configuration-cache >"$log" 2>&1 &
          pid=$!
          ready=0
          for _ in $(seq 1 150); do
            if grep -Fq "Done (" "$log" 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [[ "$ready" -ne 1 ]]; then
            echo "FAIL WBY Wave 1 server boot"
            cat "$log"
            kill -TERM -- "-$pid" 2>/dev/null || true
            sleep 1
            kill -KILL -- "-$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            exit 1
          fi

          echo "WBY WAVE 1 SERVER BOOT PASS"
          kill -TERM -- "-$pid" 2>/dev/null || true
          sleep 2
          kill -KILL -- "-$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

      - name: Upload preflight diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wby-wave1-preflight
          path: |
            wby-wave1-server-boot.log
          if-no-files-found: warn
