name: DR-70 Hydrology Review Qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "skyforge-world/**"
      - "skyforge-neoforge-1211/**"
      - "docs/authorship/AUTH-0105-fluvial-landform-realization.md"
      - "docs/agent-state/CROSS_LANE_CONTRACTS.md"
      - ".github/workflows/dr70-hydrology-review.yml"

permissions:
  contents: read

concurrency:
  group: dr70-hydrology-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      # Select from the already-ranked AUTH-0105 finalists before paying for a Minecraft runtime.
      # This is a focused physical-admissibility preflight, not a second exhaustive unit-test pass.
      - name: Verify DR-70 physical review specimen
        timeout-minutes: 10
        run: |
          ./gradlew \
            :skyforge-neoforge-1211:test \
            --tests 'io.github.nidaba.skyforge.neoforge1211.SkyforgeDr70SpecimenSearchTest' \
            -Dskyforge.test.dr70SpecimenSearch=true \
            --stacktrace --no-configuration-cache

      # Required CI owns exhaustive unit tests. DR-70 owns only the bounded production-world
      # and reload characterization needed before the human visual gate.
      - name: Qualify bounded DR-70 review world and reload
        timeout-minutes: 38
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a ./gradlew \
            :skyforge-neoforge-1211:dr70HydrologyReviewAcceptance \
            --stacktrace --no-configuration-cache

      - name: Publish DR-70 review qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dr70-hydrology-review-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            skyforge-neoforge-1211/build/acceptance/dr70-hydrology-review/*.properties
            skyforge-neoforge-1211/run-dr70-hydrology-review/logs/*.log
            skyforge-neoforge-1211/run-dr70-hydrology-review/crash-reports/*.txt

  contract:
    name: contract / ${{ matrix.short_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - short_name: hydrology-adapter
            test_class: io.github.nidaba.skyforge.neoforge1211.SkyforgeAuthoredVisibleHydrologyAdapterTest
          - short_name: carver-read
            test_class: io.github.nidaba.skyforge.neoforge1211.SkyforgeCarverReadVirtualizationSourceTest
          - short_name: carver-frame
            test_class: io.github.nidaba.skyforge.neoforge1211.SkyforgeCarverVerticalFrameTest
          - short_name: cave-stage
            test_class: io.github.nidaba.skyforge.neoforge1211.SkyforgeComposedCaveStageTest
          - short_name: dr50-evidence
            test_class: io.github.nidaba.skyforge.neoforge1211.SkyforgeDr50IntegratedRegionEvidenceTest
          - short_name: dr70-repair
            test_class: io.github.nidaba.skyforge.neoforge1211.SkyforgeDr70ReviewRepairTest
          - short_name: fluid-propagation
            test_class: io.github.nidaba.skyforge.neoforge1211.SkyforgeGeneratedFluidPropagationSourceTest
          - short_name: stable-chunk-read
            test_class: io.github.nidaba.skyforge.neoforge1211.SkyforgeLevelChunkPopulationReadMixinSourceTest
          - short_name: native-carver-cursor
            test_class: io.github.nidaba.skyforge.neoforge1211.SkyforgeNativeCarverCursorSourceTest
          - short_name: cave-topology
            test_class: io.github.nidaba.skyforge.neoforge1211.SkyforgeProductionComposedCaveIntegratedTopologySourceTest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      # VALIDATION_POLICY Tier-0 exact-head contract coverage. One class per job prevents a slow
      # regression from hiding the rest; runtime characterization remains the qualification job.
      - name: Run exact-head contract regression
        run: |
          ./gradlew \
            :skyforge-neoforge-1211:test \
            --tests '${{ matrix.test_class }}' \
            --stacktrace --no-configuration-cache

