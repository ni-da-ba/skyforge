name: Wave C22 Petroleum Content Policy

on:
  pull_request:
    paths:
      - ".github/workflows/wave-c22-petroleum-content-policy.yml"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/content/SkyIslandPetroleumContentPolicy.java"
      - "skyforge-world/src/test/java/io/github/nidaba/skyforge/world/content/SkyIslandPetroleumContentPolicyTest.java"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandPetroleumSystemOpportunityProfile.java"
      - "skyforge-world/src/main/java/io/github/nidaba/skyforge/world/SkyIslandPetroleumSystemOpportunityProfiler.java"
      - "docs/design-audit/wave-c22-petroleum-strategic-node-policy.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave-c22-petroleum-content-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Verify C22 neutral petroleum policy
        run: ./gradlew :skyforge-world:test --tests '*SkyIslandPetroleumContentPolicyTest' --no-configuration-cache
