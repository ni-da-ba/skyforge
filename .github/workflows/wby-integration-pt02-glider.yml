name: WBY Integration PT-02 Glider Admission

on:
  pull_request:
    paths:
      - ".github/workflows/wby-integration-pt02-glider.yml"
      - "skyforge-neoforge-1211/build.gradle.kts"
      - "skyforge-neoforge-1211/wave-c2-mods.properties"
      - "skyforge-neoforge-1211/wave-c3-mods.properties"
      - "skyforge-neoforge-1211/wby-wave1-mods.properties"
      - "skyforge-neoforge-1211/wby-wave1b-optimizer-mods.properties"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeWaveC7GliderLiftDevRuntime.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeReliableGlidersBridge.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeA4mcAtmosphereBridge.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeWbyWave1VisibilityClientAcceptance.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeWbyWave1VisibilityLifecycleAcceptance.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wby-pt02-glider-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pt02-glider-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ORG_GRADLE_PROJECT_wbyWave1BOptimizer: dynamicfps
      ORG_GRADLE_PROJECT_wbyPt02Glider: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Resolve accepted W1-B plus PT-02 glider overlay
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :skyforge-neoforge-1211:wbyWave1ResolvePinnedMods --no-configuration-cache | tee wby-pt02-resolve.log
          grep -q 'WBY Wave 1B optimizer=dynamicfps' wby-pt02-resolve.log
          grep -q 'WBY PT-02 glider overlay=enabled' wby-pt02-resolve.log
          grep -q 'pVIWsXir-HFLhMfNC' wby-pt02-resolve.log
          grep -q 'UnshaaiE-6Z0Z1pfP' wby-pt02-resolve.log

      - name: Prepare disposable W1 actual-client world
        shell: bash
        run: |
          set -euo pipefail
          run_dir="skyforge-neoforge-1211/run-wby-wave1-visibility-client"
          rm -rf "$run_dir"
          timeout 180 ./gradlew :skyforge-neoforge-1211:runWbyWave1VisibilityClientWorldPrepareServer --no-configuration-cache

          result="skyforge-neoforge-1211/build/acceptance/wby-wave1-visibility/prepare.properties"
          test -f "$result"
          grep -q '^status=PASS$' "$result"
          grep -q '^wbyWave1VisibilityWorldPrepared=true$' "$result"

          mapfile -t level_files < <(find "$run_dir" -maxdepth 4 -type f -name level.dat -print)
          test "${#level_files[@]}" -eq 1
          source_world="$(dirname "${level_files[0]}")"
          client_world="$run_dir/saves/wby-wave1-visibility-client"
          if [[ "$source_world" != "$client_world" ]]; then
            rm -rf "$client_world"
            mkdir -p "$run_dir/saves"
            cp -a "$source_world" "$client_world"
          fi

          cat > "$run_dir/options.txt" <<'EOF'
          onboardAccessibility:false
          pauseOnLostFocus:false
          renderDistance:4
          simulationDistance:5
          entityDistanceScaling:1.0
          particles:0
          narrator:0
          EOF

      - name: Stage exact PT-02 client stack
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :skyforge-neoforge-1211:wbyWave1StageClientMods --no-configuration-cache
          mods="skyforge-neoforge-1211/run-wby-wave1-visibility-client/mods"
          find "$mods" -maxdepth 1 -type f -name '*.jar' -printf '%f\n' | sort | tee wby-pt02-client-jars.txt
          test "$(wc -l < wby-pt02-client-jars.txt)" -eq 12
          grep -q 'pVIWsXir-HFLhMfNC' wby-pt02-client-jars.txt
          grep -q 'UnshaaiE-6Z0Z1pfP' wby-pt02-client-jars.txt
          if grep -q 'uNWWxAv9-G9hL7wPy' wby-pt02-client-jars.txt; then
            echo "PT-02A unexpectedly admitted No More Elytra Boosting"
            exit 1
          fi

      - name: Requalify distant Sable actual-client visibility with PT-02
        shell: bash
        run: |
          set -euo pipefail
          log="wby-pt02-actual-client.log"
          timeout 300 xvfb-run -a ./gradlew :skyforge-neoforge-1211:runWbyWave1VisibilityClientAcceptance --no-configuration-cache 2>&1 | tee "$log"

          result="skyforge-neoforge-1211/build/acceptance/wby-wave1-visibility/client.properties"
          test -f "$result"
          grep -q '^status=PASS$' "$result"
          grep -q '^actualClient=true$' "$result"
          grep -q '^clientSubLevelFinalized=true$' "$result"
          grep -q '^renderTransformMatchesExpected=true$' "$result"
          grep -q '^beyondVanillaRenderDistance=true$' "$result"
          grep -q '^ssrdSublevelRenderObserved=true$' "$result"
          grep -q '^distantHorizonsLoaded=true$' "$result"
          grep -q '^sodiumLoaded=true$' "$result"

          for mod in lithium ferritecore immediatelyfast dynamic_fps reliable_gliders aerodynamics4mc; do
            grep -Eq "\\($mod\\)" "$log"
          done

      - name: Configure PT-02 combined-stack server
        shell: bash
        run: |
          set -euo pipefail
          run_dir="skyforge-neoforge-1211/run-wby-wave1-visibility-server"
          rm -rf "$run_dir"
          mkdir -p "$run_dir"
          printf 'eula=true\n' > "$run_dir/eula.txt"
          cat > "$run_dir/server.properties" <<'EOF'
          level-name=wby-pt02-glider
          online-mode=false
          enforce-secure-profile=false
          spawn-protection=0
          gamemode=creative
          difficulty=peaceful
          view-distance=4
          simulation-distance=5
          max-tick-time=0
          max-players=1
          server-port=25571
          EOF

      - name: Run C7 shared-lift acceptance inside accepted W1 server stack
        shell: bash
        run: |
          set -euo pipefail
          log="wby-pt02-glider-server.log"
          export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:-} -Dskyforge.dev.waveC7GliderLift=true -Dskyforge.dev.waveC7Acceptance=true"

          timeout 240 ./gradlew :skyforge-neoforge-1211:runWbyWave1VisibilityServer --no-configuration-cache 2>&1 | tee "$log" || status=$?
          status=${status:-0}

          # The acceptance may complete before the dedicated server's external timeout. A timeout is
          # acceptable only after durable PASS evidence has been emitted.
          grep -Fq 'Skyforge Wave C7 Reliable Gliders/A4MC shared-lift compatibility enabled.' "$log"
          grep -Fq 'WAVE_C7_ACCEPTANCE PASS' "$log"
          for mod in create sable aeronautics ssrd lithium ferritecore reliable_gliders aerodynamics4mc; do
            grep -Eq "\\($mod\\)" "$log"
          done
          if grep -Eq '\\(sodium\\)|\\(distanthorizons\\)|\\(immediatelyfast\\)|\\(dynamic_fps\\)' "$log"; then
            echo "PT-02 dedicated server leaked a client-only renderer/optimizer mod"
            exit 1
          fi
          if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
            echo "PT-02 server failed with status $status"
            exit "$status"
          fi

      - name: Upload PT-02 admission evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wby-pt02-glider-admission
          path: |
            wby-pt02-*.log
            wby-pt02-client-jars.txt
            skyforge-neoforge-1211/build/acceptance/wby-wave1-visibility/*.properties
            skyforge-neoforge-1211/run-wby-wave1-visibility-client/logs/latest.log
            skyforge-neoforge-1211/run-wby-wave1-visibility-server/logs/latest.log
          if-no-files-found: warn
