name: SF-IMP-0069 Automated Acceptance

on:
  pull_request:
    paths:
      - "skyforge-neoforge-1211/**"
      - ".github/workflows/sf-imp-0069-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sf-imp-0069-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 165
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Compile and unit-test production interior slice
        timeout-minutes: 8
        run: ./gradlew :skyforge-neoforge-1211:compileJava :skyforge-neoforge-1211:test --stacktrace --no-configuration-cache

      - name: Production native interior run A
        timeout-minutes: 35
        run: ./gradlew :skyforge-neoforge-1211:runProductionInteriorPopulationAcceptanceA --stacktrace --no-configuration-cache

      - name: Production native interior run B deterministic repeat
        timeout-minutes: 35
        run: ./gradlew :skyforge-neoforge-1211:runProductionInteriorPopulationAcceptanceB --stacktrace --no-configuration-cache

      - name: Full-stop reload and actual ClientLevel verification
        timeout-minutes: 10
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a ./gradlew :skyforge-neoforge-1211:runProductionInteriorPopulationAcceptanceReloadClient --stacktrace --no-configuration-cache

      - name: Stacked-volume production interior isolation
        timeout-minutes: 30
        run: ./gradlew :skyforge-neoforge-1211:runProductionInteriorPopulationAcceptanceStacked --stacktrace --no-configuration-cache

      - name: SF-IMP-0068 production composed-cave regression
        timeout-minutes: 12
        run: ./gradlew :skyforge-neoforge-1211:runProductionComposedCaveAcceptanceA --stacktrace --no-configuration-cache

      - name: SF-IMP-0062 underground-decoration regression
        timeout-minutes: 12
        run: ./gradlew :skyforge-neoforge-1211:runUndergroundDecorationAcceptanceA --stacktrace --no-configuration-cache

      - name: SF-IMP-0063 generated-fluid regression
        timeout-minutes: 12
        run: ./gradlew :skyforge-neoforge-1211:runFluidSpringsAcceptanceA --stacktrace --no-configuration-cache

      - name: SF-IMP-0064 native-lake regression
        timeout-minutes: 12
        run: ./gradlew :skyforge-neoforge-1211:runNativeLakesAcceptanceA --stacktrace --no-configuration-cache

      - name: Verify aggregate production interior evidence
        run: ./gradlew :skyforge-neoforge-1211:sfImp0069AcceptanceVerify --stacktrace --no-configuration-cache

      - name: Publish acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sf-imp-0069-acceptance-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            skyforge-neoforge-1211/build/acceptance/sf-imp-0069/*.properties
            skyforge-neoforge-1211/run-sf-imp-0069-auto-*/logs/*.log
