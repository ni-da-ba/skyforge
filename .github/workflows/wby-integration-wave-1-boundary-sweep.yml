name: WBY Integration Wave 1 Boundary Sweep

on:
  pull_request:
    paths:
      - ".github/workflows/wby-integration-wave-1-boundary-sweep.yml"
      - "skyforge-neoforge-1211/build.gradle.kts"
      - "skyforge-neoforge-1211/wby-wave1-mods.properties"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeWbyWave1VisibilityLifecycleAcceptance.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeWbyWave1BoundarySweepClientAcceptance.java"

permissions:
  contents: read

concurrency:
  group: wby-wave1-boundary-sweep-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  boundary-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Resolve exact Wave 1 renderer pins
        run: ./gradlew :skyforge-neoforge-1211:wbyWave1ResolvePinnedMods --no-configuration-cache

      - name: Prepare disposable quick-play world
        shell: bash
        run: |
          set -euo pipefail
          run_dir="skyforge-neoforge-1211/run-wby-wave1-visibility-client"
          rm -rf "$run_dir"
          timeout 180 ./gradlew :skyforge-neoforge-1211:runWbyWave1VisibilityClientWorldPrepareServer --no-configuration-cache

          result="skyforge-neoforge-1211/build/acceptance/wby-wave1-visibility/prepare.properties"
          test -f "$result"
          grep -q '^status=PASS$' "$result"
          grep -q '^wbyWave1VisibilityWorldPrepared=true$' "$result"
          grep -q '^preassembledDistantSableBodyPersisted=false$' "$result"

          mapfile -t level_files < <(find "$run_dir" -maxdepth 4 -type f -name level.dat -print)
          if [[ "${#level_files[@]}" -ne 1 ]]; then
            echo "expected exactly one prepared level.dat, found ${#level_files[@]}"
            printf '  %s\n' "${level_files[@]}"
            find "$run_dir" -maxdepth 4 -mindepth 1 -print | sort
            exit 1
          fi

          source_world="$(dirname "${level_files[0]}")"
          client_world="$run_dir/saves/wby-wave1-visibility-client"
          if [[ "$source_world" != "$client_world" ]]; then
            rm -rf "$client_world"
            mkdir -p "$run_dir/saves"
            cp -a "$source_world" "$client_world"
          fi
          test -f "$client_world/level.dat"

      - name: Configure bounded unattended client
        shell: bash
        run: |
          set -euo pipefail
          run_dir="skyforge-neoforge-1211/run-wby-wave1-visibility-client"
          cat > "$run_dir/options.txt" <<'EOF'
          onboardAccessibility:false
          pauseOnLostFocus:false
          renderDistance:4
          simulationDistance:5
          entityDistanceScaling:1.0
          particles:0
          narrator:0
          EOF

      - name: Stage exact Wave 1 jars like a real modpack client
        run: ./gradlew :skyforge-neoforge-1211:wbyWave1StageClientMods --no-configuration-cache

      - name: Sweep the same Sable body across the vanilla-to-SSRD boundary
        shell: bash
        run: |
          set -euo pipefail
          log="wby-wave1-boundary-sweep.log"
          result="skyforge-neoforge-1211/build/acceptance/wby-wave1-boundary-sweep/client.properties"
          rm -f "$result"

          # Acceptance evidence is authoritative. DH can keep shutdown/database threads alive
          # after Minecraft.stop(), so terminate this disposable process group once PASS/FAIL
          # is durable instead of making semantic success depend on shutdown latency.
          setsid xvfb-run -a ./gradlew :skyforge-neoforge-1211:runWbyWave1BoundarySweepClientAcceptance --no-configuration-cache >"$log" 2>&1 &
          runner_pid=$!

          terminal=""
          for _ in $(seq 1 240); do
            if [[ -f "$result" ]]; then
              if grep -q '^status=PASS$' "$result"; then
                terminal="PASS"
                break
              fi
              if grep -q '^status=FAIL$' "$result"; then
                terminal="FAIL"
                break
              fi
            fi

            if ! kill -0 "$runner_pid" 2>/dev/null; then
              set +e
              wait "$runner_pid"
              rc=$?
              set -e
              echo "boundary-sweep client exited before terminal evidence (rc=$rc)"
              cat "$log"
              exit 1
            fi
            sleep 1
          done

          if [[ -z "$terminal" ]]; then
            echo "boundary-sweep client produced no terminal evidence within 240 seconds"
            cat "$log"
            kill -TERM -- "-$runner_pid" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-$runner_pid" 2>/dev/null || true
            exit 1
          fi

          kill -TERM -- "-$runner_pid" 2>/dev/null || true
          for _ in $(seq 1 10); do
            if ! kill -0 "$runner_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill -KILL -- "-$runner_pid" 2>/dev/null || true
          wait "$runner_pid" 2>/dev/null || true
          cat "$log"

          if [[ "$terminal" != "PASS" ]]; then
            echo "boundary-sweep acceptance reported FAIL"
            cat "$result"
            exit 1
          fi

          grep -q '^status=PASS$' "$result"
          grep -q '^actualClient=true$' "$result"
          grep -q '^insideVanillaObserved=true$' "$result"
          grep -q '^outboundBoundaryCrossed=true$' "$result"
          grep -q '^inboundBoundaryCrossed=true$' "$result"
          grep -q '^outboundSsrdRenderObserved=true$' "$result"
          grep -q '^inboundSsrdRenderObserved=true$' "$result"
          grep -q '^ssrdDistanceSource=Distant Horizons$' "$result"
          grep -q '^distantHorizonsLoaded=true$' "$result"
          grep -q '^sodiumLoaded=true$' "$result"

          python3 - <<'PY'
          from pathlib import Path
          p = {}
          for line in Path("skyforge-neoforge-1211/build/acceptance/wby-wave1-boundary-sweep/client.properties").read_text().splitlines():
              if "=" in line and not line.startswith("#"):
                  k, v = line.split("=", 1)
                  p[k] = v
          assert float(p["maxRenderTransformErrorBlocks"]) <= 8.0, p
          assert float(p["minDistanceBlocks"]) <= 64.0, p
          assert float(p["maxDistanceBlocks"]) > 96.0, p
          assert int(p["initialNearSamples"]) >= 5, p
          assert int(p["farHoldSamples"]) >= 5, p
          assert int(p["finalNearSamples"]) >= 5, p
          print("WBY WAVE 1 BOUNDARY SWEEP PASS", p)
          PY

      - name: Upload Wave 1 boundary-sweep evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wby-wave1-boundary-sweep
          path: |
            wby-wave1-boundary-sweep.log
            skyforge-neoforge-1211/build/acceptance/wby-wave1-boundary-sweep/*.properties
            skyforge-neoforge-1211/run-wby-wave1-visibility-client/logs/latest.log
          if-no-files-found: warn
