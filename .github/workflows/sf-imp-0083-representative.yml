name: SF-IMP-0083 Representative Morphology Characterization

on:
  pull_request:
    types: [opened, synchronize, edited, reopened]
  workflow_dispatch:
    inputs:
      family:
        description: "Representative family"
        required: true
        default: "tableland"
        type: choice
        options:
          - massif
          - tableland
          - spine
          - basin
          - lobed
      variant:
        description: "Exact AUTH-0083 member variant"
        required: true
        default: "medium-seed-skyforge"
        type: choice
        options:
          - medium-seed-min
          - medium-seed-zero
          - medium-seed-skyforge
          - large-seed-skyforge

permissions:
  contents: read

concurrency:
  group: sf-imp-0083-representative-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      should_run: ${{ steps.select.outputs.should_run }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select one risk representative
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          INPUT_FAMILY: ${{ inputs.family }}
          INPUT_VARIANT: ${{ inputs.variant }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            family="$INPUT_FAMILY"
            variant="$INPUT_VARIANT"
          else
            marker="$(printf '%s\n' "${PR_BODY:-}" | grep -oE '<!-- SF-IMP-0083-RUN:[a-z0-9-]+ -->' | tail -1 || true)"
            if [[ -z "$marker" ]]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            value="${marker#<!-- SF-IMP-0083-RUN:}"
            value="${value% -->}"
            if [[ "$value" == "representative-set" ]]; then
              matrix='{"include":[{"family":"massif","variant":"medium-seed-skyforge","task":"Massif"},{"family":"tableland","variant":"medium-seed-skyforge","task":"Tableland"},{"family":"spine","variant":"medium-seed-min","task":"Spine"},{"family":"basin","variant":"medium-seed-zero","task":"Basin"},{"family":"lobed","variant":"medium-seed-skyforge","task":"Lobed"},{"family":"massif","variant":"large-seed-skyforge","task":"Massif"},{"family":"spine","variant":"large-seed-skyforge","task":"Spine"}]}'
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            family="${value%%-*}"
            variant="${value#*-}"
          fi

          representative="$family-$variant"
          case "$representative" in
            massif-medium-seed-skyforge|\
            tableland-medium-seed-skyforge|\
            spine-medium-seed-min|\
            basin-medium-seed-zero|\
            lobed-medium-seed-skyforge|\
            massif-large-seed-skyforge|\
            spine-large-seed-skyforge)
              ;;
            *)
              echo "::error::Not an approved SF-IMP-0083 representative: $representative"
              exit 1
              ;;
          esac

          task="${family^}"
          matrix="$(printf '{"include":[{"family":"%s","variant":"%s","task":"%s"}]}' "$family" "$variant" "$task")"
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  characterize:
    needs: select
    if: needs.select.outputs.should_run == 'true'
    name: characterize (${{ matrix.family }} / ${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Prepare one exact AUTH-0083 representative
        timeout-minutes: 20
        run: >
          ./gradlew
          :skyforge-neoforge-1211:productionMorphologySeedScale${{ matrix.task }}PrepareVerify
          -PskyforgeProductionMorphologyVariant=${{ matrix.variant }}
          --stacktrace --no-configuration-cache

      - name: Reopen persisted representative in actual client
        timeout-minutes: 12
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >
          xvfb-run -a ./gradlew
          :skyforge-neoforge-1211:productionMorphologySeedScale${{ matrix.task }}ViewerVerify
          -PskyforgeProductionMorphologyVariant=${{ matrix.variant }}
          --stacktrace --no-configuration-cache

      - name: Publish representative morphology evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sf-imp-0083-${{ matrix.family }}-${{ matrix.variant }}-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            skyforge-neoforge-1211/build/acceptance/production-morphology-seed-scale/${{ matrix.family }}/${{ matrix.variant }}/*.properties
            skyforge-neoforge-1211/run-skyforge-production-morphology-seed-scale-${{ matrix.family }}-${{ matrix.variant }}/logs/*.log
            skyforge-neoforge-1211/run-skyforge-production-morphology-seed-scale-${{ matrix.family }}-${{ matrix.variant }}/crash-reports/*.txt
