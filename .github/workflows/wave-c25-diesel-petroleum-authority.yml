name: Wave C25 Diesel Petroleum Authority

on:
  pull_request:
    paths:
      - "skyforge-neoforge-1211/wave-c25-mods.properties"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeWaveC25PetroleumAuthorityAcceptance.java"
      - "skyforge-neoforge-1211/src/test/java/io/github/nidaba/skyforge/neoforge1211/WaveC25PetroleumAuthorityResourceTest.java"
      - "docs/design-audit/wave-c25-diesel-petroleum-authority.md"
  push:
    branches: [main]
    paths:
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeNeoForge1211Mod.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave-c25-diesel-petroleum-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Verify C25 wiring and immutable pins
        run: |
          ./gradlew :skyforge-neoforge-1211:test --tests '*WaveC25PetroleumAuthorityResourceTest' --no-configuration-cache
          ./gradlew :skyforge-neoforge-1211:waveC25ResolvePinnedMods --no-configuration-cache

      - name: Run Diesel Generators petroleum-authority A/B
        shell: bash
        run: |
          set -euo pipefail

          run_case() {
            local task="$1"
            local marker="$2"
            local log="$3"

            setsid ./gradlew ":skyforge-neoforge-1211:${task}" --no-configuration-cache >"${log}" 2>&1 &
            local pid=$!
            local outcome=""

            for _ in $(seq 1 420); do
              if grep -Fq "${marker}" "${log}" 2>/dev/null; then
                outcome="pass"
                break
              fi
              if grep -Fq "WAVE_C25 FAIL" "${log}" 2>/dev/null; then
                outcome="fail"
                break
              fi
              if ! kill -0 "${pid}" 2>/dev/null; then
                break
              fi
              sleep 1
            done

            if [[ "${outcome}" == "pass" ]]; then
              grep -F "${marker}" "${log}"
              kill -TERM -- "-${pid}" 2>/dev/null || true
              sleep 2
              kill -KILL -- "-${pid}" 2>/dev/null || true
              wait "${pid}" 2>/dev/null || true
              return 0
            fi

            echo "FAIL ${marker}"
            cat "${log}"
            kill -TERM -- "-${pid}" 2>/dev/null || true
            sleep 1
            kill -KILL -- "-${pid}" 2>/dev/null || true
            wait "${pid}" 2>/dev/null || true
            return 1
          }

          run_case "runWaveC25PetroleumAuthorityBaselineServer" "WAVE_C25 PASS mode=BASELINE" "wave-c25-baseline.log"
          run_case "runWaveC25PetroleumAuthoritySuppressedServer" "WAVE_C25 PASS mode=SUPPRESSED" "wave-c25-suppressed.log"