name: Compiler Platform World Item CUT PRESS Lifecycle

on:
  pull_request:
    paths:
      - ".github/workflows/compiler-platform-world-item-cut-press-lifecycle.yml"
      - "docs/agent-state/COMPILER_INTEGRATION_CAPABILITIES.json"
      - "scripts/compiler-integration/run-exact-stack-fixture.sh"
      - "skyforge-neoforge-1211/build.gradle.kts"
      - "skyforge-neoforge-1211/wave-c1-mods.properties"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeCompilerIntegrationDiagnostic.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeCompilerIntegrationFailure.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeCompilerIntegrationPhase.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeWorldItemCutPressLifecycleAcceptance.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeNeoForge1211Mod.java"
      - "skyforge-neoforge-1211/src/main/resources/data/skyforge/recipe/sequenced_assembly/platform_015_cut_press.json"
      - "skyforge-neoforge-1211/src/test/java/io/github/nidaba/skyforge/neoforge1211/WorldItemCutPressLifecycleResourceTest.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-platform-world-item-cut-press-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  l1-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Verify bounded world-item processing contracts
        run: >-
          ./gradlew :skyforge-neoforge-1211:test
          --tests '*CompilerIntegrationDiagnosticTest'
          --tests '*WorldItemCutPressLifecycleResourceTest'
          --no-configuration-cache

  l2-exact-stack:
    needs: l1-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Resolve exact accepted Create/Sable/Aeronautics stack
        run: ./gradlew :skyforge-neoforge-1211:waveC11ResolvePinnedMods --no-configuration-cache
      - name: Qualify beltless world-item CUT PRESS lifecycle
        run: >-
          scripts/compiler-integration/run-exact-stack-fixture.sh
          :skyforge-neoforge-1211:runCompilerPlatformWorldItemCutPressLifecycleServer
          compiler-platform-world-item-cut-press-lifecycle.log
          'COMPILER_PLATFORM_WORLD_ITEM_CUT_PRESS_LIFECYCLE START'
          'COMPILER_PLATFORM_WORLD_ITEM_CUT_PRESS_LIFECYCLE PASS'
          'COMPILER_PLATFORM_WORLD_ITEM_CUT_PRESS_LIFECYCLE FAIL'
          120
          180
