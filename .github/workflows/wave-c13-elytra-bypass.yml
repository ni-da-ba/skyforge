name: Wave C13 Elytra Bypass

on:
  pull_request:
    paths:
      - "skyforge-neoforge-1211/wave-c2-mods.properties"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeWaveC13ElytraBypassAcceptance.java"
  push:
    branches: [main]
    paths:
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeNeoForge1211Mod.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave-c13-elytra-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline-vs-suppressed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Resolve exact suppression artifact
        run: ./gradlew :skyforge-neoforge-1211:waveC13ResolvePinnedMods --no-configuration-cache

      - name: Prove vanilla baseline
        shell: bash
        run: |
          set -euo pipefail
          log="wave-c13-baseline.log"
          setsid ./gradlew :skyforge-neoforge-1211:runWaveC13VanillaElytraAcceptanceServer --no-configuration-cache >"${log}" 2>&1 &
          pid=$!
          outcome=""

          for _ in $(seq 1 120); do
            grep -Fq "WAVE_C13_BASELINE PASS" "${log}" 2>/dev/null && { outcome="pass"; break; }
            grep -Fq "WAVE_C13_BASELINE FAIL" "${log}" 2>/dev/null && { outcome="fail"; break; }
            kill -0 "${pid}" 2>/dev/null || break
            sleep 1
          done

          if [[ "${outcome}" == "pass" ]]; then
            grep -F "WAVE_C13_BASELINE PASS" "${log}"
            kill -TERM -- "-${pid}" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-${pid}" 2>/dev/null || true
            wait "${pid}" 2>/dev/null || true
            exit 0
          fi

          cat "${log}"
          kill -TERM -- "-${pid}" 2>/dev/null || true
          sleep 1
          kill -KILL -- "-${pid}" 2>/dev/null || true
          wait "${pid}" 2>/dev/null || true
          exit 1

      - name: Prove suppressed boost with ordinary fireworks preserved
        shell: bash
        run: |
          set -euo pipefail
          log="wave-c13-suppressed.log"
          setsid ./gradlew :skyforge-neoforge-1211:runWaveC13SuppressedElytraAcceptanceServer --no-configuration-cache >"${log}" 2>&1 &
          pid=$!
          outcome=""

          for _ in $(seq 1 120); do
            grep -Fq "WAVE_C13_SUPPRESSED PASS" "${log}" 2>/dev/null && { outcome="pass"; break; }
            grep -Fq "WAVE_C13_SUPPRESSED FAIL" "${log}" 2>/dev/null && { outcome="fail"; break; }
            kill -0 "${pid}" 2>/dev/null || break
            sleep 1
          done

          if [[ "${outcome}" == "pass" ]]; then
            grep -F "WAVE_C13_SUPPRESSED PASS" "${log}"
            kill -TERM -- "-${pid}" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-${pid}" 2>/dev/null || true
            wait "${pid}" 2>/dev/null || true
            exit 0
          fi

          cat "${log}"
          kill -TERM -- "-${pid}" 2>/dev/null || true
          sleep 1
          kill -KILL -- "-${pid}" 2>/dev/null || true
          wait "${pid}" 2>/dev/null || true
          exit 1