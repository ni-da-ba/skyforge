name: WBY S0.5 Pack Shell

on:
  pull_request:
    paths:
      - ".github/workflows/wby-s0-5-pack-shell.yml"
      - "settings.gradle.kts"
      - "skyforge-neoforge-1211/build.gradle.kts"
      - "skyforge-neoforge-1211/wby-s0-5-pack-authority.properties"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeWbyWave1VisibilityClientAcceptance.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wby-s0-5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  s0-5-machine-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-java-gradle

      - name: Resolve cumulative S0.5A shell
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :skyforge-neoforge-1211:wbyS05ResolvePinnedMods --no-configuration-cache | tee wby-s0-5-resolve.log
          grep -Fq 'WBY S0.5A PACK AUTHORITY RESOLUTION PASS' wby-s0-5-resolve.log

      - name: Prepare clean S0.5A runtime
        shell: bash
        run: |
          set -euo pipefail
          run_dir="skyforge-neoforge-1211/run-wby-s05"
          rm -rf "$run_dir"
          mkdir -p "$run_dir"
          printf 'eula=true\n' > "$run_dir/eula.txt"

      - name: Create S0.5A world on dedicated server
        shell: bash
        run: |
          set -euo pipefail
          timeout 300 ./gradlew :skyforge-neoforge-1211:runWbyS05PrepareServer --no-configuration-cache 2>&1 | tee wby-s0-5-server.log
          result="skyforge-neoforge-1211/build/acceptance/wby-s05/prepare.properties"
          test -f "$result"
          grep -q '^status=PASS$' "$result"

      - name: Reopen same S0.5A save in actual client
        shell: bash
        run: |
          set -euo pipefail
          timeout 360 xvfb-run -a ./gradlew :skyforge-neoforge-1211:runWbyS05ClientAcceptance --no-configuration-cache 2>&1 | tee wby-s0-5-client.log
          result="skyforge-neoforge-1211/build/acceptance/wby-s05/client.properties"
          test -f "$result"
          grep -q '^status=PASS$' "$result"
          grep -q '^actualClient=true$' "$result"
          grep -q '^renderTransformMatchesExpected=true$' "$result"
          grep -q '^ssrdSublevelRenderObserved=true$' "$result"
          grep -q '^distantHorizonsLoaded=true$' "$result"
          grep -q '^sodiumLoaded=true$' "$result"
          grep -Fq 'WBY S0.5A CLIENT MOD STAGING PASS' wby-s0-5-client.log

      - name: Capture S0.5A sanity summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "profile=S0.5A"
            echo "head_sha=${GITHUB_SHA}"
            echo "resolver_closure=true"
            echo "server_world_created=true"
            echo "same_save_actual_client_reopen=true"
            echo "s0_visibility_regression=false"
            echo "client_mod_staging=true"
          } > wby-s0-5-summary.properties

      - name: Upload S0.5A evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wby-s0-5-machine-acceptance
          path: |
            wby-s0-5-*.log
            wby-s0-5-summary.properties
            skyforge-neoforge-1211/build/acceptance/wby-s05/*.properties
            skyforge-neoforge-1211/run-wby-s05/logs/latest.log
            skyforge-neoforge-1211/run-wby-s05/config/**
          if-no-files-found: warn
