name: Compiler Platform Aerodynamic Force Observation

on:
  pull_request:
    paths:
      - ".github/workflows/compiler-platform-aerodynamic-force-observation.yml"
      - "docs/agent-state/COMPILER_INTEGRATION_CAPABILITIES.json"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeAerodynamicForceObservationAcceptance.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeSwivelControlChildLifecycleAcceptance.java"
      - "skyforge-neoforge-1211/src/test/java/io/github/nidaba/skyforge/neoforge1211/AerodynamicForceObservationResourceTest.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-platform-aero-force-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  l1-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-java-gradle
      - name: Verify bounded force-observation contract
        run: ./gradlew :skyforge-neoforge-1211:test --tests '*AerodynamicForceObservationResourceTest' --tests '*SwivelControlChildLifecycleResourceTest' --no-configuration-cache
  l2-exact-stack:
    needs: l1-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-java-gradle
      - name: Resolve exact accepted Create/Sable/Aeronautics stack
        run: ./gradlew :skyforge-neoforge-1211:waveC11ResolvePinnedMods --no-configuration-cache
      - name: Qualify real Sable aerodynamic DRAG force observation
        run: >-
          scripts/compiler-integration/run-exact-stack-fixture.sh
          :skyforge-neoforge-1211:runCompilerPlatformAerodynamicForceObservationServer
          compiler-platform-aerodynamic-force-observation.log
          'COMPILER_PLATFORM_SWIVEL_CONTROL_CHILD_ON_SABLE_LIFECYCLE START'
          'COMPILER_PLATFORM_SABLE_AERODYNAMIC_FORCE_OBSERVATION_LIFECYCLE PASS'
          'COMPILER_PLATFORM_SABLE_AERODYNAMIC_FORCE_OBSERVATION_LIFECYCLE FAIL'
          120
          180
