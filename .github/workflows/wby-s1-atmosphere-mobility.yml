name: WBY S1 Atmosphere and Mobility

on:
  pull_request:
    paths:
      - ".github/workflows/wby-s1-atmosphere-mobility.yml"
      - "skyforge-neoforge-1211/build.gradle.kts"
      - "skyforge-neoforge-1211/wave-c2-mods.properties"
      - "skyforge-neoforge-1211/wave-c3-mods.properties"
      - "skyforge-neoforge-1211/wby-s0-5-*.properties"
      - "skyforge-neoforge-1211/wby-s1-atmosphere-mobility.properties"
      - "skyforge-neoforge-1211/wby-s0-5-policy/**"
      - "scripts/wby-s1-diagnostic-launch.sh"
      - "docs/integration/wby-s1-diagnostic-launch.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wby-s1-atmosphere-mobility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-s1-profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-java-gradle

      - name: Resolve baseline atmosphere profile
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :skyforge-neoforge-1211:wbyS1ResolvePinnedMods --no-configuration-cache | tee wby-s1-baseline.log
          grep -Fq 'WBY S1 RESOLUTION PASS' wby-s1-baseline.log
          grep -Fq 'glider=none clouds=none thinAir=false' wby-s1-baseline.log

      - name: Resolve Hang Glider comparison closure
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :skyforge-neoforge-1211:wbyS1ResolvePinnedMods -PwbyS1Glider=hang-glider --no-configuration-cache | tee wby-s1-hang-glider.log
          grep -Fq 'WBY S1 RESOLUTION PASS' wby-s1-hang-glider.log
          grep -Fq 'glider=hang-glider clouds=none thinAir=false' wby-s1-hang-glider.log

      - name: Resolve Ornithopter Glider comparison closure
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :skyforge-neoforge-1211:wbyS1ResolvePinnedMods -PwbyS1Glider=ornithopter --no-configuration-cache | tee wby-s1-ornithopter.log
          grep -Fq 'WBY S1 RESOLUTION PASS' wby-s1-ornithopter.log
          grep -Fq 'glider=ornithopter clouds=none thinAir=false' wby-s1-ornithopter.log

      - name: Resolve Better Clouds comparison closure
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :skyforge-neoforge-1211:wbyS1ResolvePinnedMods -PwbyS1Clouds=better-clouds --no-configuration-cache | tee wby-s1-better-clouds.log
          grep -Fq 'WBY S1 RESOLUTION PASS' wby-s1-better-clouds.log

      - name: Resolve ThinAir optional overlay closure
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :skyforge-neoforge-1211:wbyS1ResolvePinnedMods -PwbyS1ThinAir=true --no-configuration-cache | tee wby-s1-thinair.log
          grep -Fq 'WBY S1 RESOLUTION PASS' wby-s1-thinair.log

      - name: Validate manual launch task graphs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :skyforge-neoforge-1211:runWbyS1DiagnosticServer --dry-run --no-configuration-cache | tee wby-s1-server-dry-run.log
          ./gradlew :skyforge-neoforge-1211:runWbyS1DiagnosticClient --dry-run --no-configuration-cache | tee wby-s1-client-dry-run.log
          ./gradlew :skyforge-neoforge-1211:runWbyS1ClientJoinAcceptance --dry-run --no-configuration-cache | tee wby-s1-join-dry-run.log
          grep -Fq 'wbyS1StagePolicy' wby-s1-server-dry-run.log
          grep -Fq 'wbyS1StageClientMods' wby-s1-client-dry-run.log
          grep -Fq 'wbyS1StageClientMods' wby-s1-join-dry-run.log

      - name: Upload S1 resolver evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wby-s1-atmosphere-mobility-resolution
          path: |
            wby-s1-*.log
            skyforge-neoforge-1211/run-wby-s1/mods/*.jar
            skyforge-neoforge-1211/run-wby-s1/config/**
          if-no-files-found: warn

  cumulative-server-client:
    needs: resolve-s1-profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-java-gradle

      - name: Prepare isolated vanilla server and client run directories
        shell: bash
        run: |
          set -euo pipefail
          server_dir="skyforge-neoforge-1211/run-wby-s1-server"
          client_dir="skyforge-neoforge-1211/run-wby-s1-client"
          mkdir -p "$server_dir" "$client_dir"
          printf 'online-mode=false\nserver-port=25565\n' > "$server_dir/server.properties"
          printf 'eula=true\n' > "$server_dir/eula.txt"

      - name: Boot S1 dedicated server and join from the actual client
        shell: bash
        run: |
          set -euo pipefail
          server_dir="skyforge-neoforge-1211/run-wby-s1-server"
          server_log="wby-s1-server.log"
          setsid ./gradlew --no-daemon :skyforge-neoforge-1211:runWbyS1DiagnosticServer \
            -PwbyS1RunDirectory=run-wby-s1-server --no-configuration-cache > "$server_log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill -INT -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 150); do
            if grep -Fq 'Done (' "$server_log"; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$server_log"
              exit 1
            fi
            sleep 2
          done
          test "$ready" = true
          test -f "$server_dir/world/level.dat"

          set +e
          timeout --signal=INT 180 xvfb-run -a ./gradlew --no-daemon :skyforge-neoforge-1211:runWbyS1ClientJoinAcceptance \
            -PwbyS1RunDirectory=run-wby-s1-client --no-configuration-cache 2>&1 | tee wby-s1-client.log
          client_status=${PIPESTATUS[0]}
          set -e
          test "$client_status" -eq 124
          grep -E -q 'logged in with entity id|joined the game' "$server_log"

          kill -INT -- "-$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT
          grep -Fq 'Stopping server' "$server_log"
          test -f "$server_dir/world/level.dat"

      - name: Reopen the same S1 dedicated-server world
        shell: bash
        run: |
          set -euo pipefail
          server_log="wby-s1-server-reload.log"
          setsid ./gradlew --no-daemon :skyforge-neoforge-1211:runWbyS1DiagnosticServer \
            -PwbyS1RunDirectory=run-wby-s1-server --no-configuration-cache > "$server_log" 2>&1 &
          server_pid=$!
          ready=false
          for attempt in $(seq 1 150); do
            if grep -Fq 'Done (' "$server_log"; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$server_log"
              exit 1
            fi
            sleep 2
          done
          test "$ready" = true
          test -f skyforge-neoforge-1211/run-wby-s1-server/world/level.dat
          kill -INT -- "-$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          grep -Fq 'Stopping server' "$server_log"

      - name: Upload S1 runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wby-s1-runtime-acceptance
          path: |
            wby-s1-server*.log
            wby-s1-client.log
            skyforge-neoforge-1211/run-wby-s1-server/logs/latest.log
            skyforge-neoforge-1211/run-wby-s1-client/logs/latest.log
          if-no-files-found: warn
