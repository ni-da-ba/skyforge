name: Wave C11 First Flight Recipe Runtime

on:
  pull_request:
    paths:
      - ".github/workflows/wave-c11-first-flight-recipes.yml"
      - "skyforge-neoforge-1211/build.gradle.kts"
      - "skyforge-neoforge-1211/wave-c1-mods.properties"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeWaveC11FirstFlightRecipeAcceptance.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeNeoForge1211Mod.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave-c11-first-flight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recipe-surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Resolve exact first-flight runtime
        run: ./gradlew :skyforge-neoforge-1211:waveC11ResolvePinnedMods --no-configuration-cache

      - name: Assert live first-flight recipe surface
        shell: bash
        run: |
          set -euo pipefail
          log="wave-c11-first-flight-recipes.log"
          setsid ./gradlew :skyforge-neoforge-1211:runWaveC11FirstFlightRecipeServer --no-configuration-cache >"${log}" 2>&1 &
          pid=$!
          outcome=""

          for _ in $(seq 1 120); do
            if grep -Fq "WAVE_C11_ACCEPTANCE PASS" "${log}" 2>/dev/null; then
              outcome="pass"
              break
            fi
            if grep -Fq "WAVE_C11_ACCEPTANCE FAIL" "${log}" 2>/dev/null; then
              outcome="fail"
              break
            fi
            if ! kill -0 "${pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [[ "${outcome}" == "pass" ]]; then
            grep -F "WAVE_C11_RECIPE" "${log}" || true
            grep -F "WAVE_C11_ACCEPTANCE PASS" "${log}"
            kill -TERM -- "-${pid}" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-${pid}" 2>/dev/null || true
            wait "${pid}" 2>/dev/null || true
            exit 0
          fi

          echo "FAIL Wave C11 live first-flight recipe acceptance"
          cat "${log}"
          kill -TERM -- "-${pid}" 2>/dev/null || true
          sleep 1
          kill -KILL -- "-${pid}" 2>/dev/null || true
          wait "${pid}" 2>/dev/null || true
          exit 1
