name: SF-IMP-0071 Integration Runner

on:
  push:
    branches: [perf/524-packetize-catchup]
    paths:
      - scripts/sf_imp_0071_patch.py
      - .github/workflows/sf-imp-0071-patch.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/524-packetize-catchup
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply integration patch
        run: python3 scripts/sf_imp_0071_patch.py
      - name: Run NeoForge tests
        run: ./gradlew :skyforge-neoforge-1211:test --no-daemon
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/sf-imp-0071-patch.yml scripts/sf_imp_0071_patch.py
          git add skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeNeoForge1211SurfaceStage.java
          git add skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgePhysicalVolumeCatchupService.java
          git commit -m "SF-IMP-0071: integrate persisted packetized terrain catch-up"
          git push origin HEAD:perf/524-packetize-catchup
