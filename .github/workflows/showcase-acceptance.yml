name: Skyforge Showcase Acceptance

on:
  pull_request:
    paths:
      - "skyforge-neoforge-1211/**"
      - "docs/showcase/**"
      - ".github/workflows/showcase-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skyforge-showcase-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Compile and unit-test showcase packaging
        timeout-minutes: 8
        run: ./gradlew :skyforge-neoforge-1211:compileJava :skyforge-neoforge-1211:test --stacktrace --no-configuration-cache

      - name: Prepare deterministic showcase world
        timeout-minutes: 35
        run: ./gradlew :skyforge-neoforge-1211:showcasePrepareVerify --stacktrace --no-configuration-cache

      - name: Reopen persisted world in actual showcase client
        timeout-minutes: 10
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a ./gradlew :skyforge-neoforge-1211:showcaseViewerVerify --stacktrace --no-configuration-cache

      - name: Publish showcase preparation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skyforge-showcase-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            skyforge-neoforge-1211/build/acceptance/showcase/*.properties
            skyforge-neoforge-1211/run-skyforge-showcase/logs/*.log
            skyforge-neoforge-1211/run-skyforge-showcase/crash-reports/*.txt
