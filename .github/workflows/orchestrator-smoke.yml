name: Orchestrator Smoke

on:
  pull_request:
    paths:
      - "scripts/orchestrator/**"
      - "AGENTS.md"
      - "docs/agent-state/ORCHESTRATION_PROTOCOL.md"
      - ".github/workflows/orchestrator-smoke.yml"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "scripts/orchestrator/**"
      - "AGENTS.md"
      - "docs/agent-state/ORCHESTRATION_PROTOCOL.md"
      - ".github/workflows/orchestrator-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Compile controller
        run: python -m py_compile scripts/orchestrator/skyforge_orchestrator.py

      - name: Run deterministic event-filter tests
        run: python -m unittest scripts/orchestrator/test_skyforge_orchestrator.py
