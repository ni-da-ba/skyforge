name: Orchestrator Smoke

on:
  pull_request:
    paths:
      - "scripts/orchestrator/**"
      - "deploy/orchestrator/**"
      - "AGENTS.md"
      - "docs/agent-state/ORCHESTRATION_PROTOCOL.md"
      - "docs/agent-state/PROGRAM_ROADMAP.md"
      - "docs/agent-state/ORCHESTRATOR_ROADMAP.json"
      - "docs/agent-state/EXECUTION_BOUNDARIES.md"
      - ".github/workflows/orchestrator-smoke.yml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: orchestrator-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned orchestrator dependency
        run: |
          python -m pip install --disable-pip-version-check -r scripts/orchestrator/requirements.txt
          python -c "import openai_codex; print(openai_codex.__name__)"

      - name: Compile orchestrator Python
        run: python -m compileall -q scripts/orchestrator

      - name: Validate roadmap manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts/orchestrator")
          from roadmap_policy import load_manifest
          manifest = load_manifest(Path("docs/agent-state/ORCHESTRATOR_ROADMAP.json"))
          print(manifest.roadmap_id, len(manifest.nodes), manifest.fingerprint)
          PY

      - name: Check hosted shell syntax
        run: |
          bash -n scripts/orchestrator/install_hosted.sh
          bash -n scripts/orchestrator/decommission_hosted.sh

      - name: Validate daily timer expression
        run: systemd-analyze calendar "$(sed -n 's/^OnCalendar=//p' deploy/orchestrator/skyforge-value-report.timer)"

      - name: Run deterministic orchestration tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/orchestrator/test_*.py)
          if (( ${#tests[@]} == 0 )); then
            echo "No orchestrator test modules found."
            exit 1
          fi
          for test_file in "${tests[@]}"; do
            echo "==> ${test_file}"
            PYTHONPATH=scripts/orchestrator python -m unittest "${test_file}"
          done
