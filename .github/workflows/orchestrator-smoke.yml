name: Orchestrator Smoke

on:
  pull_request:
    paths:
      - "scripts/orchestrator/**"
      - "deploy/orchestrator/**"
      - "AGENTS.md"
      - "docs/agent-state/ORCHESTRATION_PROTOCOL.md"
      - ".github/workflows/orchestrator-smoke.yml"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "scripts/orchestrator/**"
      - "deploy/orchestrator/**"
      - "AGENTS.md"
      - "docs/agent-state/ORCHESTRATION_PROTOCOL.md"
      - ".github/workflows/orchestrator-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install pinned orchestrator dependency
        run: |
          python -m pip install --disable-pip-version-check -r scripts/orchestrator/requirements.txt
          python -c "import openai_codex; print(openai_codex.__name__)"

      - name: Compile controller and launcher
        run: |
          python -m py_compile scripts/orchestrator/skyforge_orchestrator.py
          python -m py_compile scripts/orchestrator/run_pilot.py
          python -m py_compile scripts/orchestrator/daily_value_report.py
          python -m py_compile scripts/orchestrator/verify_main_protection.py

      - name: Check hosted shell syntax
        run: |
          bash -n scripts/orchestrator/install_hosted.sh
          bash -n scripts/orchestrator/decommission_hosted.sh

      - name: Validate daily timer expression
        run: systemd-analyze calendar "$(sed -n 's/^OnCalendar=//p' deploy/orchestrator/skyforge-value-report.timer)"

      - name: Run deterministic orchestration tests
        run: |
          python -m unittest scripts/orchestrator/test_skyforge_orchestrator.py
          python -m unittest scripts/orchestrator/test_daily_value_report.py
          python -m unittest scripts/orchestrator/test_verify_main_protection.py
          python -m unittest scripts/orchestrator/test_decommission_contract.py
