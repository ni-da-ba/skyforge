name: NeoForge Focused Qualification

on:
  pull_request:
    paths:
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeAuthoredVisibleHydrologyAdapter.java"
      - "skyforge-neoforge-1211/src/main/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeNeoForge1211ChunkAdapter.java"
      - "skyforge-neoforge-1211/src/test/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeAuthoredVisibleHydrologyAdapterTest.java"
      - "skyforge-neoforge-1211/src/test/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeDr50IntegratedRegionEvidenceTest.java"
      - "skyforge-neoforge-1211/src/test/java/io/github/nidaba/skyforge/neoforge1211/SkyforgeDr70ReviewRepairTest.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neoforge-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: Production-scale NeoForge qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Run explicit qualification tests
        id: qualification
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s)
          ./gradlew :skyforge-neoforge-1211:neoforgeQualificationTest --profile
          elapsed=$(( $(date +%s) - started ))
          echo "wall_seconds=${elapsed}" >> "${GITHUB_OUTPUT}"

      - name: Summarize qualification timing
        if: always() && steps.qualification.outputs.wall_seconds != ''
        run: |
          python3 scripts/ci/summarize_validation_timings.py             --label "NeoForge focused qualification"             --wall-seconds "${{ steps.qualification.outputs.wall_seconds }}"             --warn-over-seconds 1800

      - name: Publish Gradle timing profile
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skyforge-neoforge-qualification-profile-${{ github.sha }}
          path: build/reports/profile/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
